            <button type="submit" class="px-5 py-2.5 rounded-xl bg-sage hover:bg-sage/90 text-paper text-sm font-medium">${existing ? 'Save Changes' : 'Save Proof'}</button>
          </div>
        </form>
      `);
      renderDraftProofAttachments();
    }

    function renderDraftProofAttachments() {
      const box = document.getElementById('pf-att-list');
      if (!box) return;
      if (draftProofAttachments.length === 0) {
        box.innerHTML = `<div class="text-xs text-ink-muted">No attachments added yet. Upload a receipt image/PDF or add a quick location note.</div>`;
        return;
      }
      box.innerHTML = draftProofAttachments.map((att, idx) => `
        <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-paper border border-hairline text-xs">
          <div class="truncate">
            <span class="font-medium text-ink">${esc(att.name)}</span>
            ${att.kind === 'note' ? `<span class="text-ink-muted"> — ${esc(att.textNote)}</span>` : `<span class="font-mono text-[10px] text-ink-muted ml-1">(${Math.round((att.size || 0)/1024)} KB)</span>`}
          </div>
          <button type="button" onclick="draftProofAttachments.splice(${idx}, 1); renderDraftProofAttachments()" class="text-ink-muted hover:text-coral px-1">×</button>
        </div>
      `).join('');
    }

    function handleProofFileUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      if (file.size > 1.5 * 1024 * 1024) {
        showToast('File is larger than 1.5 MB. Please use a smaller file or add a text location note instead.', 'amber');
        e.target.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        draftProofAttachments.push({
          id: uid('att'),
          kind: 'file',
          name: file.name,
          mimeType: file.type,
          size: file.size,
          dataUrl: reader.result,
        });
        renderDraftProofAttachments();
        showToast(`Attached ${file.name}`, 'sage');
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function addManualProofAttachment() {
      const inp = document.getElementById('pf-manual-att');
      const val = (inp?.value || '').trim();
      if (!val) return;
      draftProofAttachments.push({
        id: uid('att'),
        kind: 'note',
        name: 'Saved Location',
        textNote: val,
      });
      inp.value = '';
      renderDraftProofAttachments();
    }

    function submitProofModal(e, proofId) {
      e.preventDefault();
      const title = document.getElementById('pf-title').value.trim();
      if (!title) return;
      const data = {
        title,
        completionDate: document.getElementById('pf-date').value || todayISO(),
        refNumber: document.getElementById('pf-ref').value.trim(),
        organization: document.getElementById('pf-org').value.trim(),
        contactName: document.getElementById('pf-contact').value.trim(),
        notes: document.getElementById('pf-notes').value.trim(),
        attachments: [...draftProofAttachments],
      };

      if (proofId) {
        const p = state.proofs.find(x => x.id === proofId);
        if (p) Object.assign(p, data);
        showToast('Proof record updated.', 'sage');
      } else {
        state.proofs.unshift({ id: uid('prf'), situationId: null, waitingItemId: null, ...data });
        showToast('Proof of Done saved.', 'sage');
      }
      saveState();
      closeModal();
      renderCurrentView();
    }

    function confirmDeleteProof(id) {
      showConfirm('Delete this Proof of Done record?', 'This confirmation record and its attachments will be removed.', () => {
        state.proofs = state.proofs.filter(p => p.id !== id);
        saveState();
        renderCurrentView();
        showToast('Proof record deleted.', 'neutral');
      });
    }

    // ==================== 8. RECOVERY HISTORY ====================
    function renderRecoveryHistory(el) {
      const completed = state.situations.filter(s => s.status === 'completed');
      const q = uiState.historySearch.trim().toLowerCase();
      const filtered = completed.filter(s => {
        const matchCat = uiState.historyCategory === 'All' || s.category === uiState.historyCategory;
        const linkedProof = state.proofs.find(p => p.situationId === s.id);
        const matchQ = !q ||
          s.title.toLowerCase().includes(q) ||
          (s.outcomeNotes || '').toLowerCase().includes(q) ||
          (linkedProof?.refNumber || '').toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      el.innerHTML = `
        <div class="mb-6">
          <div class="text-xs font-mono uppercase tracking-widest text-ink-muted mb-1">Quiet Wins Archive</div>
          <h1 class="font-serif text-3xl sm:text-4xl font-medium tracking-tight text-ink">Recovery History</h1>
          <p class="text-sm text-ink-secondary mt-1">Revisit resolved situations, confirmation numbers, and notes anytime. If something resurfaces, you can reopen it in one tap.</p>
        </div>

        <div class="flex flex-col sm:flex-row gap-2.5 mb-5">
          <input type="text" value="${esc(uiState.historySearch)}"
            oninput="uiState.historySearch=this.value; renderRecoveryHistory(document.getElementById('app-content'))"
            placeholder="Search by keyword, outcome notes, or reference #..."
            class="flex-1 px-4 py-2.5 rounded-xl bg-paper border border-hairline text-sm" />
          <select onchange="uiState.historyCategory=this.value; renderRecoveryHistory(document.getElementById('app-content'))"
            class="px-3.5 py-2.5 rounded-xl bg-paper border border-hairline text-xs text-ink">
            <option value="All">All Categories</option>
            ${CATEGORIES.map(c => `<option value="${c}" ${uiState.historyCategory === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>

        ${filtered.length === 0 ? `
          <div class="bg-paper rounded-3xl border border-hairline p-10 text-center">
            <p class="font-serif text-xl text-ink">${completed.length === 0 ? 'No completed recoveries yet' : 'No matching records found'}</p>
            <p class="text-sm text-ink-muted mt-1">Resolved Fix It Paths appear here automatically along with their Proof of Done.</p>
          </div>
        ` : `
          <div class="space-y-3.5">
            ${filtered.map(s => {
              const proof = state.proofs.find(p => p.situationId === s.id);
              return `
                <article onclick="openHistoryDetailModal('${s.id}')"
                  class="cursor-pointer bg-paper hover:border-sage/50 rounded-3xl border border-hairline shadow-card p-5 transition-all">
                  <div class="flex flex-wrap items-center justify-between gap-2 mb-1.5">
                    <span class="text-[11px] font-medium uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-sage-soft text-sage">${esc(s.category)}</span>
                    <span class="font-mono text-xs text-ink-muted">Resolved ${formatDate(s.completedAt)}</span>
                  </div>
                  <h3 class="font-serif text-xl font-medium text-ink">${esc(s.title)}</h3>
                  ${s.outcomeNotes ? `<p class="text-sm text-ink-secondary mt-1.5 line-clamp-2">${esc(s.outcomeNotes)}</p>` : ''}
                  <div class="flex flex-wrap items-center gap-3 mt-3 text-xs text-ink-muted font-mono">
                    <span>${s.steps.length} steps completed</span>
                    ${proof?.refNumber ? `<span>· Ref ${esc(proof.refNumber)}</span>` : ''}
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    function openHistoryDetailModal(sitId) {

      const proof = state.proofs.find(p => p.situationId === sit.id);
      const call = state.callPreps.find(c => c.id === sit.callPrepId || c.situationId === sit.id);
      const docs = state.documents.filter(d => d.situationId === sit.id);

      openModal(`
        <div class="p-5 sm:p-6 border-b border-hairline flex items-start justify-between gap-3">
          <div>
            <span class="inline-block text-[11px] font-mono uppercase tracking-wider text-sage mb-1">Resolved · ${formatDate(sit.completedAt)}</span>
            <h2 class="font-serif text-2xl font-medium text-ink leading-snug">${esc(sit.title)}</h2>

        </div>

          <div class="p-4 rounded-2xl bg-sage-soft/50 border border-sage/20">

                  <span>${esc(st.text)}</span>
                </li>
              `).join('')}
            </ul>
          </div>

          ${call?.callNotes?.notes ? `
            <div class="p-4 rounded-2xl bg-canvas border border-hairline">

              <div class="text-xs text-ink-secondary">
                ${call.callNotes.repName ? `Rep: ${esc(call.callNotes.repName)} · ` : ''}

            <div>
              <h3 class="text-xs font-semibold uppercase tracking-wider text-ink-muted mb-2">Documents Used</h3>

          <button onclick="confirmDeleteSituation('${sit.id}')" class="px-3.5 py-2 rounded-xl border border-hairline bg-paper hover:bg-coral-soft hover:text-coral-dark text-xs font-medium text-ink-secondary">
            Delete Record
          </button>
          <div class="flex items-center gap-2">
            <button onclick="reopenSituation('${sit.id}')" class="px-4 py-2 rounded-xl bg-amberwarm-soft text-amberwarm hover:bg-amberwarm hover:text-paper text-xs font-medium transition-colors">

    function reopenSituation(sitId) {
      const sit = state.situations.find(s => s.id === sitId);
      if (!sit) return;
      sit.status = 'active';
      sit.completedAt = null;
      saveState();
      closeModal();
      showToast('Situation reopened to Active Fix It Paths.', 'sage');
      navigate('fixit');
    }

    // ==================== GLOBAL SEARCH MODAL ====================
    function openSearchModal() {
      openModal(`
        <div class="p-4 sm:p-5 border-b border-hairline flex items-center gap-3">
          <svg class="w-5 h-5 text-ink-muted shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="global-search-input" type="text" autofocus oninput="renderGlobalSearchResults(this.value)"
            placeholder="Search plans, scripts, documents, waiting room, proof #..."
            class="flex-1 bg-transparent border-none text-base text-ink focus:shadow-none" />
          <button onclick="closeModal()" class="p-1.5 rounded-lg text-ink-muted hover:bg-surface">${ICONS.close}</button>
        </div>
        <div id="global-search-results" class="p-4 sm:p-5 overflow-y-auto max-h-[65vh] space-y-2">
          <p class="text-xs text-ink-muted text-center py-6">Start typing to search across all 8 sections of AFTER THE FACT.</p>
        </div>
      `);
      setTimeout(() => document.getElementById('global-search-input')?.focus(), 60);
    }

    function renderGlobalSearchResults(query) {
      const box = document.getElementById('global-search-results');
      if (!box) return;
      const q = (query || '').trim().toLowerCase();
      if (!q) {
        box.innerHTML = `<p class="text-xs text-ink-muted text-center py-6">Start typing to search across all 8 sections.</p>`;
        return;
      }

      const results = [];
      state.situations.forEach(s => {
        if (s.title.toLowerCase().includes(q) || s.summary.toLowerCase().includes(q)) {
          results.push({
            section: s.status === 'active' ? 'Fix It Path' : 'Recovery History',
            title: s.title,
            sub: s.category,
            action: s.status === 'active' ? `closeModal(); navigate('fixit'); openSituationWorkspace('${s.id}')` : `closeModal(); navigate('history'); openHistoryDetailModal('${s.id}')`,
          });
        }
      });
      state.callPreps.forEach(c => {
        if (c.title.toLowerCase().includes(q) || (c.organization || '').toLowerCase().includes(q) || (c.openingScript || '').toLowerCase().includes(q)) {
          results.push({
            section: 'Call Prep',
            title: c.title,
            sub: c.organization || 'Script',
            action: `closeModal(); uiState.callPrepSelectedId='${c.id}'; navigate('callprep')`,
          });
        }
      });
      state.documents.forEach(d => {
        if (d.name.toLowerCase().includes(q) || (d.note || '').toLowerCase().includes(q)) {
          results.push({
            section: 'Document Checklist',
            title: d.name,
            sub: d.note || d.status,
            action: `closeModal(); navigate('documents')`,
          });
        }
      });
      state.waitingItems.forEach(w => {
        if (w.title.toLowerCase().includes(q) || w.organization.toLowerCase().includes(q) || (w.refNumber || '').toLowerCase().includes(q)) {
          results.push({
            section: 'Waiting Room',
            title: w.title,
            sub: `${w.organization} · ${w.type}`,
            action: `closeModal(); navigate('waiting')`,
          });
        }
      });
      state.proofs.forEach(p => {
        if (p.title.toLowerCase().includes(q) || (p.refNumber || '').toLowerCase().includes(q) || (p.notes || '').toLowerCase().includes(q)) {
          results.push({
            section: 'Proof of Done',
            title: p.title,
            sub: p.refNumber ? `Ref ${p.refNumber}` : formatDate(p.completionDate),
            action: `closeModal(); navigate('proof')`,
          });
        }
      });

      if (results.length === 0) {
        box.innerHTML = `<p class="text-sm text-ink-muted text-center py-8">No matching items found for “${esc(query)}”.</p>`;
        return;
      }

      box.innerHTML = results.slice(0, 15).map(r => `
        <button onclick="${r.action}" class="w-full text-left p-3.5 rounded-2xl bg-canvas hover:bg-surface border border-hairline transition-colors flex items-center justify-between gap-3">
          <div class="min-w-0">
            <div class="text-sm font-medium text-ink truncate">${esc(r.title)}</div>
            <div class="text-xs text-ink-muted truncate mt-0.5">${esc(r.sub)}</div>
          </div>
          <span class="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-paper border border-hairline text-ink-secondary shrink-0">${esc(r.section)}</span>
        </button>
      `).join('');
    }

    function exportStateJSON() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `after-the-fact-backup-${todayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Backup downloaded.', 'sage');
      } catch (err) {
        showToast('Could not export backup.', 'coral');
      }
    }

    function importStateJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.situations) || !Array.isArray(parsed.proofs)) {
            showToast('Invalid backup file format. Please choose a valid AFTER THE FACT .json export.', 'coral');
            return;
          }
          state = {
            version: 1,
            situations: parsed.situations || [],
            callPreps: Array.isArray(parsed.callPreps) ? parsed.callPreps : [],
            documents: Array.isArray(parsed.documents) ? parsed.documents : [],
            waitingItems: Array.isArray(parsed.waitingItems) ? parsed.waitingItems : [],
            standaloneDeadlines: Array.isArray(parsed.standaloneDeadlines) ? parsed.standaloneDeadlines : [],
            proofs: parsed.proofs || [],
          };
          saveState();
          closeModal();
          renderCurrentView();
          showToast('Backup imported successfully.', 'sage');
        } catch (err) {
          showToast('Could not read JSON file. Please verify the file is not corrupted.', 'coral');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function confirmLoadSampleData() {
      showConfirm(
        'Load sample scenarios?',
        'This will replace your current workspace with the built-in example scenarios. Export a backup first if you want to keep your current data.',
        () => {
          state = createSampleState();
          saveState();
          closeModal();
          renderCurrentView();
          showToast('Sample scenarios loaded.', 'sage');
        }
      );
    }

    function confirmClearAllData() {
      showConfirm(
        'Clear all data?',
        'This will empty all sections so you can start completely fresh. This cannot be undone unless you have a JSON backup.',
        () => {
          state = createEmptyState();
          saveState();
          closeModal();
          renderCurrentView();
          showToast('Workspace cleared.', 'neutral');
        }
      );
    }

    // ==================== MODAL, CONFIRM & TOAST ENGINE ====================
    function openModal(html) {
      const root = document.getElementById('modal-root');
      const box = document.getElementById('modal-box');
      box.innerHTML = html;
      root.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      document.body.style.overflow = '';
    }

    let pendingConfirmCallback = null;
    function showConfirm(title, message, onConfirm) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      pendingConfirmCallback = onConfirm;
      const el = document.getElementById('confirm-root');
      el.classList.remove('hidden');
      el.classList.add('flex');
    }

    function closeConfirm(confirmed) {
      const el = document.getElementById('confirm-root');
      el.classList.add('hidden');
      el.classList.remove('flex');
      const cb = pendingConfirmCallback;
      pendingConfirmCallback = null;
      if (confirmed && typeof cb === 'function') cb();
    }

    function showToast(message, tone = 'neutral') {
      const container = document.getElementById('toast-container');
      const colors = {
        sage: 'bg-sage text-paper',
        coral: 'bg-coral text-paper',
        amber: 'bg-amberwarm text-paper',
        neutral: 'bg-ink text-paper',
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-elevated text-xs sm:text-sm font-medium flex items-center justify-between gap-3 sheet-up ${colors[tone] || colors.neutral}`;
      toast.innerHTML = `<span>${esc(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3200);
    }

    // Keyboard shortcuts: '/' opens search, 'Escape' closes modals/drawers
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!document.getElementById('confirm-root').classList.contains('hidden')) {
          closeConfirm(false);
        } else if (!document.getElementById('modal-root').classList.contains('hidden')) {
          closeModal();
        } else {
          closeMoreDrawer();
        }
      } else if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) {
        e.preventDefault();
        openSearchModal();
      }
    });

    // -------------------- INITIALIZE APP --------------------
    window.addEventListener('DOMContentLoaded', () => {
      renderNavigation();
      renderCurrentView();
    });
  </script>
</body>
</html>
