  <style>
    /* Base editorial styling and smooth transitions */
    :root {
      --bg-canvas: #F8F5F0;
      --bg-surface: #F1ECE3;
      --bg-paper: #FFFDF9;
      --ink-primary: #1D1B18;
      --hairline: #E6DFD4;
    }

    html {
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background-color: var(--bg-canvas);
      overflow-x: hidden;
    }

    /* Editorial responsive breakpoint at 900px for Left Rail vs Mobile Bottom Nav */
    @media (min-width: 900px) {
      .desktop-rail {
        display: flex !important;
      }
      .mobile-bottom-nav {
        display: none !important;
      }
      .main-workspace {
        padding-left: 260px;
        padding-bottom: 48px !important;
      }
      .top-header-inner {
        padding-left: 260px;
      }
    }

    /* Subtle fade-in for view transitions */
    .view-fade {
      animation: fadeUp 0.22s ease-out;
    }
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Sheet & Modal transitions */
    .modal-backdrop {
      animation: fadeIn 0.16s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .sheet-up {
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(18px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Custom subtle scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #D9D0C3;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #C4B8A7;
    }

    /* Safe area bottom padding for mobile */
    .pb-safe {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }

    /* Focus ring in muted coral */
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #C75B46 !important;
      box-shadow: 0 0 0 3px rgba(199, 91, 70, 0.14);
    }
  </style>
</head>

    // -------------------- DATE & UTILITY HELPERS --------------------
    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function daysOffset(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function formatDate(iso) {
      if (!iso) return 'Not set';
      const parts = iso.split('-');
      if (parts.length !== 3) return iso;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function daysFromToday(iso) {
      if (!iso) return null;
      const parts = iso.split('-');
      if (parts.length !== 3) return null;
      const target = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function copyTextToClipboard(text, successMsg = 'Copied to clipboard') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg, 'sage');
      } catch (e) {
        showToast('Could not copy automatically — please select and copy manually.', 'amber');
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const seeded = createSampleState();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
          return seeded;
        }
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.situations)) {
          return createSampleState();
        }
        // Ensure all arrays exist
        return {
          version: 1,
          situations: Array.isArray(parsed.situations) ? parsed.situations : [],
          callPreps: Array.isArray(parsed.callPreps) ? parsed.callPreps : [],
          documents: Array.isArray(parsed.documents) ? parsed.documents : [],
          waitingItems: Array.isArray(parsed.waitingItems) ? parsed.waitingItems : [],
          standaloneDeadlines: Array.isArray(parsed.standaloneDeadlines) ? parsed.standaloneDeadlines : [],
          proofs: Array.isArray(parsed.proofs) ? parsed.proofs : [],
        };
      } catch (err) {
        console.error('Failed to load state:', err);
        return createSampleState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('Storage quota error:', err);
        showToast('Browser storage is full. Consider exporting your data or removing large file attachments.', 'coral');
      }
    }

    // -------------------- SMART LOCAL PLAN GENERATOR (100% Client-Side) --------------------
    function generateRecoveryPlanFromText(rawText, forcedCategory = null) {
      const text = (rawText || '').trim();
      const lower = text.toLowerCase();

      // 1. Detect category
      let category = forcedCategory || 'Other';
      if (!forcedCategory) {
        if (/(bill|payment|overdue|late fee|electric|water|gas|rent|credit card|utility|tax|invoice|balance|owe|mortgage|tuition)/.test(lower)) {
          category = 'Missed Payment';
        } else if (/(dentist|doctor|appointment|clinic|vet|checkup|reschedule|therapy|salon|visit|physical|exam)/.test(lower)) {
          category = 'Appointment';
        } else if (/(renew|registration|license|passport|expired|dmv|insurance|membership|permit|tags|id card|subscription)/.test(lower)) {
          category = 'Renewal';
        } else if (/(return|refund|order|package|exchange|store|damaged|wrong item|past 30|window|shipping|coat|shoes|amazon)/.test(lower)) {
          category = 'Return / Refund';
        } else if (/(apply|application|form|claim|scholarship|visa|benefits|grant|paperwork|submit|fafsa|fsa|reimbursement)/.test(lower)) {
          category = 'Application';
        } else if (/(letter|email|hoa|city|notice|reply|respond|landlord|neighbor|school|jury|message|call back)/.test(lower)) {
          category = 'Correspondence';
        }
      }

      // 2. Detect urgency calmly
      let urgency = 'soon';
      if (/(urgent|final notice|shutoff|disconnect|court|today|tomorrow|overdue|expired|late fee|penalty|past due|10 days|2 weeks|last month)/.test(lower)) {
        urgency = 'urgent';

            openingScript: `Hello, this is [Your Name] following up on the notice I received regarding "${cleanTitle}". I apologize for the delay in getting back to you—I wanted to confirm what you need from me so we can get this wrapped up smoothly.`,
            talkingPoints: [
              'Keep the message forward-looking: focus on the solution and timeline.',
              'Ask for written email confirmation of whatever you agree on.',
            ],
            questions: [
              'Is there a specific date you need this completed by?',
              'Who is the best email contact so I can send written confirmation?',
            ],
            checklist: ['Original notice / case number', 'Calendar ready for any agreed date'],
          },
          revisedDays: 3,
          nextAction: 'Read notice carefully and send a concise reply.',
        },
        'Other': {
          effort: '20 min',
          summary: 'Turn this lingering task into four calm, manageable steps so you can close the loop and clear it from your mind.',
          steps: [
            'Write down the single most important detail or contact needed to move forward',
            'Gather any reference numbers, emails, or documents related to the situation',
            'Take the main outreach or action step (message, call, or form)',
            'Record the confirmation or outcome in Proof of Done to close the loop',
          ],
          docs: [
            { name: 'Relevant Reference Numbers or Emails', note: 'Locate before taking action' },
          ],
          call: {
            organization: 'Primary Contact',
            openingScript: `Hello, my name is [Your Name]. I am reaching out to follow up on "${cleanTitle}". I appreciate your patience with the delay and would love to get this resolved today.`,
            talkingPoints: [
              'Clarify the outcome you are hoping for in one sentence.',
              'Take notes on names, dates, and next steps.',
            ],
            questions: [
              'What is the simplest next step to resolve this?',
              'Can you share a reference number or email confirmation?',
            ],
            checklist: ['Key details written down', 'Notepad open'],
          },
          revisedDays: 4,
          nextAction: 'Gather the key reference detail and take Step 1.',
        },
      };

      const bp = blueprints[category] || blueprints['Other'];
      const sitId = uid('sit');
      const cpId = uid('cp');

      const situation = {
        id: sitId,
        status: 'active',
        title: cleanTitle,
        summary: bp.summary,
        originalPrompt: text,
        category,
        urgency,
        effort: bp.effort,
        createdAt: todayISO(),
        completedAt: null,
        outcomeNotes: '',
        steps: bp.steps.map(t => ({ id: uid('st'), text: t, done: false })),
        deadline: {
          originalDate: '',
          revisedDate: daysOffset(bp.revisedDays),
          reminderNote: 'Gentle revised target — adjust anytime to fit your week.',
          nextAction: bp.nextAction,
        },
        callPrepId: cpId,
      };

      const callPrep = {
        id: cpId,
        situationId: sitId,
        title: `${cleanTitle} — Call Prep`,
        organization: bp.call.organization,
        phone: '',
        openingScript: bp.call.openingScript,
        talkingPoints: [...bp.call.talkingPoints],
        questions: [...bp.call.questions],
        checklist: bp.call.checklist.map(c => ({ id: uid('cc'), text: c, done: false })),
        callNotes: { repName: '', callDate: '', refNumber: '', notes: '' },
      };

      const documents = bp.docs.map(d => ({
        id: uid('doc'),
        situationId: sitId,
        name: d.name,
        status: 'needed',
        note: d.note,
      }));

      return { situation, callPrep, documents };
    }

    // -------------------- NAVIGATION & RENDERING CORE --------------------
    function navigate(viewId, opts = {}) {
      currentView = viewId;
      closeMoreDrawer();
      renderNavigation();
      renderCurrentView(opts);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderNavigation() {
      // Counts for subtle editorial badges
      const activeCount = state.situations.filter(s => s.status === 'active').length;
      const waitingAttention = state.waitingItems.filter(w => w.status !== 'received').length;
      const docsNeeded = state.documents.filter(d => d.status === 'needed').length;

      const badgeMap = {
        fixit: activeCount,
        waiting: waitingAttention,
        documents: docsNeeded,
      };

      // 1. Desktop Left Rail
      const desktopNav = document.getElementById('desktop-nav');
      desktopNav.innerHTML = NAV_ITEMS.map(item => {
        const active = currentView === item.id;
        const count = badgeMap[item.id];
        return `
          <button onclick="navigate('${item.id}')"
            class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm transition-all text-left ${
              active
                ? 'bg-paper text-ink font-semibold shadow-card border border-hairline'
                : 'text-ink-secondary hover:text-ink hover:bg-paper/60 border border-transparent'
            }">
            <span class="flex items-center gap-3">
              <span class="${active ? 'text-coral' : 'text-ink-muted'}">${ICONS[item.id]}</span>
              <span>${item.label}</span>
            </span>
            ${count > 0 ? `<span class="font-mono text-[11px] px-1.5 py-0.5 rounded-md ${active ? 'bg-coral-soft text-coral-dark' : 'bg-surface text-ink-muted'}">${count}</span>` : ''}
          </button>
        `;
      }).join('');

      // 2. Mobile Bottom Nav (4 primary + More)
      const mobileNav = document.getElementById('mobile-nav');
      const primaryItems = NAV_ITEMS.filter(i => i.primary);
      const isSecondaryActive = NAV_ITEMS.some(i => !i.primary && i.id === currentView);

      mobileNav.innerHTML = primaryItems.map(item => {
        const active = currentView === item.id;
        return `
          <button onclick="navigate('${item.id}')"
            class="flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-colors min-h-[48px] ${
              active ? 'text-coral' : 'text-ink-muted hover:text-ink'
            }">
            <span>${ICONS[item.id]}</span>
            <span class="text-[10px] mt-1 font-medium tracking-tight">${item.shortLabel}</span>
          </button>
        `;
      }).join('') + `
        <button onclick="openMoreDrawer()"
          class="flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-colors min-h-[48px] ${
            isSecondaryActive ? 'text-coral' : 'text-ink-muted hover:text-ink'
          }">
          <span>${ICONS.more}</span>
          <span class="text-[10px] mt-1 font-medium tracking-tight">More</span>
        </button>
      `;

      // 3. More Drawer items
      const drawerItems = document.getElementById('more-drawer-items');
      drawerItems.innerHTML = NAV_ITEMS.filter(i => !i.primary).map(item => {
        const active = currentView === item.id;
        return `
          <button onclick="navigate('${item.id}')"
            class="w-full flex items-center justify-between p-3.5 rounded-2xl border transition-all text-left ${
              active ? 'bg-coral-soft/60 border-coral/30' : 'bg-canvas border-hairline hover:bg-surface'
            }">
            <div class="flex items-center gap-3.5">
              <div class="w-10 h-10 rounded-xl bg-paper border border-hairline flex items-center justify-center ${active ? 'text-coral' : 'text-ink-secondary'}">
                ${ICONS[item.id]}
              </div>
              <div>
                <div class="text-sm font-semibold text-ink">${item.label}</div>
                <div class="text-xs text-ink-muted">${item.desc}</div>
              </div>
            </div>
            <span class="text-ink-muted">${ICONS.arrowRight}</span>
          </button>
        `;
      }).join('');
    }

    function openMoreDrawer() {
      document.getElementById('more-drawer').classList.remove('hidden');
    }
    function closeMoreDrawer() {
      document.getElementById('more-drawer').classList.add('hidden');
    }

    function renderCurrentView() {
      const container = document.getElementById('app-content');
      container.classList.remove('view-fade');
      void container.offsetWidth; // trigger reflow for smooth fade
      container.classList.add('view-fade');

      switch (currentView) {
        case 'rescue': renderRescueDesk(container); break;
        case 'fixit': renderFixItPath(container); break;
        case 'callprep': renderCallPrep(container); break;
        case 'documents': renderDocuments(container); break;
        case 'waiting': renderWaitingRoom(container); break;
        case 'deadlines': renderDeadlines(container); break;
        case 'proof': renderProofOfDone(container); break;
        case 'history': renderRecoveryHistory(container); break;
        default: renderRescueDesk(container);
      }
      renderNavigation();
    }

    // -------------------- SHARED UI HELPERS --------------------
    function urgencyBadge(urgency) {
      if (urgency === 'urgent') {
        return `<span class="inline-flex items-center gap-1 text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-coral-soft text-coral-dark">Urgent</span>`;
      }
      if (urgency === 'soon') {
        return `<span class="inline-flex items-center gap-1 text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-amberwarm-soft text-amberwarm">Soon</span>`;
      }
      return `<span class="inline-flex items-center gap-1 text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-surface text-ink-secondary">Calm</span>`;
    }

    function waitingStatusBadge(status) {
      const map = {
        waiting: { label: 'Waiting', cls: 'bg-surface text-ink-secondary' },
        followup_due: { label: 'Follow-up Due', cls: 'bg-amberwarm-soft text-amberwarm' },
        escalated: { label: 'Escalated', cls: 'bg-coral-soft text-coral-dark' },
        received: { label: 'Received', cls: 'bg-sage-soft text-sage' },
      };
      const cfg = map[status] || map.waiting;
      return `<span class="inline-flex items-center text-[11px] font-medium px-2.5 py-0.5 rounded-full ${cfg.cls}">${cfg.label}</span>`;
    }

    function docStatusBadge(status) {
      const map = {
        needed: { label: 'Needed', cls: 'bg-amberwarm-soft text-amberwarm' },
        ready: { label: 'Ready', cls: 'bg-sage-soft text-sage' },
        submitted: { label: 'Submitted', cls: 'bg-surface text-ink-secondary' },
      };
      const cfg = map[status] || map.needed;
      return `<span class="inline-flex items-center text-[11px] font-medium px-2.5 py-0.5 rounded-full ${cfg.cls}">${cfg.label}</span>`;
    }

    function getStepStats(sit) {
      const total = sit.steps.length;
      const done = sit.steps.filter(s => s.done).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      return { total, done, pct };
    }

    function getAllDeadlineEntries() {
      const fromSituations = state.situations
        .filter(s => s.status === 'active')
        .map(s => ({
          kind: 'situation',
          id: s.id,
          title: s.title,
          category: s.category,
          urgency: s.urgency,
          originalDate: s.deadline?.originalDate || '',
          revisedDate: s.deadline?.revisedDate || '',
          reminderNote: s.deadline?.reminderNote || '',
          nextAction: s.deadline?.nextAction || '',
        }));

      const fromStandalone = state.standaloneDeadlines.map(d => ({
        kind: 'standalone',
        id: d.id,
        title: d.title,
        category: d.category || 'Other',
        urgency: 'soon',
        originalDate: d.originalDate || '',
        revisedDate: d.revisedDate || '',
        reminderNote: d.reminderNote || '',
        nextAction: d.nextAction || '',
      }));

      return [...fromSituations, ...fromStandalone].sort((a, b) => {
        if (!a.revisedDate && !b.revisedDate) return 0;
        if (!a.revisedDate) return 1;
        if (!b.revisedDate) return -1;
        return a.revisedDate.localeCompare(b.revisedDate);
      });
    }

            <div class="flex items-center justify-between text-ink-muted mb-2">
              <span class="text-xs font-medium">Unresolved</span>
              <span class="text-coral group-hover:translate-x-0.5 transition-transform">${ICONS.fixit}</span>
            </div>
            <div class="font-serif text-3xl font-medium text-ink">${activeSits.length}</div>
            <div class="text-[11px] text-ink-muted mt-1">Active Fix It Paths</div>

          <button onclick="navigate('deadlines')" class="text-left bg-paper hover:border-coral/40 rounded-2xl border border-hairline p-4 transition-all shadow-card group">

              <span class="text-xs font-medium">Revised Targets</span>
              <span class="text-coral">${ICONS.deadlines}</span>
            </div>
            <div class="font-serif text-3xl font-medium text-ink">${urgentDeadlines.length}</div>
            <div class="text-[11px] text-ink-muted mt-1">Coming up within 5 days</div>

          <button onclick="navigate('waiting')" class="text-left bg-paper hover:border-amberwarm/50 rounded-2xl border border-hairline p-4 transition-all shadow-card group">

              <span class="text-amberwarm">${ICONS.waiting}</span>

            <div class="font-serif text-3xl font-medium text-ink">${waitingOpen.length}</div>
            <div class="text-[11px] text-ink-muted mt-1">Pending replies & claims</div>
          </button>

          <button onclick="navigate('history')" class="text-left bg-paper hover:border-sage/50 rounded-2xl border border-hairline p-4 transition-all shadow-card group">
            <div class="flex items-center justify-between text-ink-muted mb-2">

        <!-- Two-Column Workspace Overview -->

          <!-- Left 7 cols: Active Fix It Paths -->
          <section class="lg:col-span-7 space-y-4">
            <div class="flex items-center justify-between">

            ` : activeSits.slice(0, 4).map(sit => {
              const { done, total, pct } = getStepStats(sit);
              return `
                <article onclick="openSituationWorkspace('${sit.id}')"

                  <div class="flex flex-wrap items-center justify-between gap-2 mb-2">

              <div class="bg-paper rounded-2xl border border-hairline divide-y divide-hairline shadow-card overflow-hidden">

                    <div onclick="${d.kind === 'situation' ? `openSituationWorkspace('${d.id}')` : `navigate('deadlines')`}"

                  <div onclick="openHistoryDetailModal('${s.id}')" class="p-4 hover:bg-canvas/70 cursor-pointer transition-colors flex items-start gap-3">
                    <span class="w-6 h-6 rounded-full bg-sage-soft text-sage flex items-center justify-center shrink-0 mt-0.5">${ICONS.check}</span>
                    <div class="min-w-0">
                      <div class="text-sm font-medium text-ink truncate">${esc(s.title)}</div>
                      <div class="text-[11px] text-ink-muted mt-0.5">Resolved ${formatDate(s.completedAt)}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function handleQuickIntake(e) {
      e.preventDefault();
      const input = document.getElementById('quick-intake-input');
      const val = (input?.value || '').trim();
      if (!val) {
        showToast('Describe what slipped in a few words first.', 'amber');
        input?.focus();
        return;
      }
      createPlanAndOpen(val);
    }

    function launchExamplePrompt(idx) {
      const prompt = EXAMPLE_PROMPTS[idx];
      if (prompt) createPlanAndOpen(prompt);
    }

    function createPlanAndOpen(plainText, forcedCategory = null) {
      const generated = generateRecoveryPlanFromText(plainText, forcedCategory);
      state.situations.unshift(generated.situation);
      state.callPreps.unshift(generated.callPrep);
      state.documents.unshift(...generated.documents);
      saveState();
      showToast('Recovery plan created. Everything is editable.', 'sage');
      navigate('fixit');
      openSituationWorkspace(generated.situation.id);
    }

    // ==================== 2. FIX IT PATH (CENTRAL FEATURE) ====================
    function renderFixItPath(el) {
      const activeSits = state.situations.filter(s => s.status === 'active');
      const filtered = activeSits.filter(s => {
        const matchesCat = uiState.fixitCategory === 'All' || s.category === uiState.fixitCategory;
        const matchesUrg = uiState.fixitUrgency === 'All' || s.urgency === uiState.fixitUrgency;
        const q = uiState.fixitSearch.trim().toLowerCase();
        const matchesQ = !q ||
          s.title.toLowerCase().includes(q) ||
          s.summary.toLowerCase().includes(q) ||
          s.category.toLowerCase().includes(q) ||
          s.steps.some(st => st.text.toLowerCase().includes(q));
        return matchesCat && matchesUrg && matchesQ;
      });

      el.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6">
          <div>
            <div class="text-xs font-mono uppercase tracking-widest text-ink-muted mb-1">Central Workspace</div>
            <h1 class="font-serif text-3xl sm:text-4xl font-medium tracking-tight text-ink">Fix It Path</h1>
            <p class="text-sm text-ink-secondary mt-1">Turn plain-language problems into calm, editable step-by-step recovery plans.</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="openManualPlanModal()"
              class="px-4 py-2.5 rounded-xl bg-paper border border-hairline hover:bg-surface text-ink-secondary text-sm font-medium transition-colors">
              Manual Plan
            </button>
            <button onclick="toggleFixitBuilder()"
              class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-coral hover:bg-coral-dark text-paper text-sm font-medium transition-colors shadow-sm">
              ${ICONS.plus}
              <span>New Recovery Plan</span>
            </button>
          </div>
        </div>

        <!-- Plain-Language Recovery Plan Builder -->
        <section id="fixit-builder-card" class="${uiState.fixitBuilderOpen || activeSits.length === 0 ? '' : 'hidden'} bg-paper rounded-3xl border border-hairline shadow-card p-5 sm:p-6 mb-7">
          <div class="flex items-start justify-between gap-3 mb-3">
            <div>
              <h2 class="font-serif text-xl font-medium text-ink">Describe what needs to be resolved</h2>
              <p class="text-xs text-ink-muted mt-0.5">Generates ordered steps, required documents, a Call Prep script, and a revised target date—100% locally in your browser.</p>
            </div>
            ${activeSits.length > 0 ? `<button onclick="toggleFixitBuilder()" class="p-1.5 rounded-lg text-ink-muted hover:bg-surface">${ICONS.close}</button>` : ''}
          </div>

          <form onsubmit="handleFixitGenerate(event)" class="space-y-3.5">
            <div>
              <textarea id="fixit-prompt-input" rows="3"
                placeholder="Example: I missed my car registration renewal last month and I'm not sure what documents I need to renew it..."
                class="w-full px-4 py-3 rounded-2xl bg-canvas border border-hairline text-sm text-ink placeholder:text-ink-muted">${esc(uiState.fixitDraftPrompt)}</textarea>
            </div>
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="flex items-center gap-2">
                <label for="fixit-cat-override" class="text-xs text-ink-muted">Category:</label>
                <select id="fixit-cat-override" class="px-3 py-2 rounded-xl bg-canvas border border-hairline text-xs text-ink">
                  <option value="">Auto-detect from description</option>
                  ${CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}
                </select>
              </div>
              <div class="flex items-center gap-2">
                <button type="button" onclick="openManualPlanModal()" class="px-3.5 py-2.5 rounded-xl border border-hairline text-xs font-medium text-ink-secondary hover:bg-surface">
                  Build manually instead
                </button>
                <button type="submit" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-coral hover:bg-coral-dark text-paper text-sm font-medium transition-colors">
                  ${ICONS.spark}
                  <span>Generate Plan</span>
                </button>
              </div>
            </div>
          </form>

          <div class="mt-4 pt-4 border-t border-hairline">
            <div class="text-[11px] font-medium uppercase tracking-wider text-ink-muted mb-2">Or try a realistic scenario</div>
            <div class="flex flex-wrap gap-2">
              ${EXAMPLE_PROMPTS.map((p, idx) => `
                <button type="button" onclick="fillFixitPrompt(${idx})"
                  class="text-xs px-3 py-1.5 rounded-xl bg-surface hover:bg-hairline/70 text-ink-secondary transition-colors text-left">
                  ${esc(p)}
                </button>
              `).join('')}
            </div>
          </div>
        </section>

        <!-- Search & Filter Bar -->
        <section class="flex flex-col sm:flex-row gap-2.5 mb-5">
          <input type="text" value="${esc(uiState.fixitSearch)}"
            oninput="uiState.fixitSearch = this.value; renderFixItPath(document.getElementById('app-content'))"
            placeholder="Search active plans or steps..."
            class="flex-1 px-4 py-2.5 rounded-xl bg-paper border border-hairline text-sm" />
          <div class="flex gap-2">
            <select onchange="uiState.fixitCategory = this.value; renderFixItPath(document.getElementById('app-content'))"
              class="flex-1 sm:flex-none px-3 py-2.5 rounded-xl bg-paper border border-hairline text-xs text-ink">
              <option value="All">All Categories</option>
              ${CATEGORIES.map(c => `<option value="${c}" ${uiState.fixitCategory === c ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
            <select onchange="uiState.fixitUrgency = this.value; renderFixItPath(document.getElementById('app-content'))"
              class="flex-1 sm:flex-none px-3 py-2.5 rounded-xl bg-paper border border-hairline text-xs text-ink">
              <option value="All">All Urgency</option>
              <option value="urgent" ${uiState.fixitUrgency === 'urgent' ? 'selected' : ''}>Urgent</option>
              <option value="soon" ${uiState.fixitUrgency === 'soon' ? 'selected' : ''}>Soon</option>
              <option value="calm" ${uiState.fixitUrgency === 'calm' ? 'selected' : ''}>Calm</option>
            </select>
          </div>
        </section>

        <!-- Active Plans Grid -->
        ${filtered.length === 0 ? `
          <div class="bg-paper rounded-3xl border border-hairline p-10 text-center">
            <p class="font-serif text-xl text-ink">${activeSits.length === 0 ? 'No active recovery plans yet' : 'No plans match your current filter'}</p>
            <p class="text-sm text-ink-muted mt-1.5 max-w-md mx-auto">
              ${activeSits.length === 0
                ? 'Start by describing something that slipped in plain language, or build a custom recovery plan manually.'
                : 'Try clearing your search or category filter.'}
            </p>
            ${activeSits.length > 0 ? `<button onclick="uiState.fixitSearch='';uiState.fixitCategory='All';uiState.fixitUrgency='All';renderCurrentView()" class="mt-4 px-4 py-2 rounded-xl bg-surface text-xs font-medium text-ink">Reset Filters</button>` : ''}
          </div>
        ` : `
          <div class="space-y-4">
            ${filtered.map(sit => {
              const { done, total, pct } = getStepStats(sit);
              const linkedDocs = state.documents.filter(d => d.situationId === sit.id);
              const readyDocs = linkedDocs.filter(d => d.status !== 'needed').length;
              return `
                <article class="bg-paper rounded-3xl border border-hairline shadow-card p-5 sm:p-6 transition-all hover:border-ink-muted/50">
                  <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                    <div class="flex items-center gap-2">
                      <span class="text-[11px] font-medium uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-surface text-ink-secondary">${esc(sit.category)}</span>
                      ${urgencyBadge(sit.urgency)}
                    </div>
                    <div class="flex items-center gap-3 text-xs text-ink-muted font-mono">
                      <span>Est. ${esc(sit.effort)}</span>
                      ${sit.deadline?.revisedDate ? `<span>Target ${formatDate(sit.deadline.revisedDate)}</span>` : ''}
                    </div>
                  </div>

                  <div class="cursor-pointer" onclick="openSituationWorkspace('${sit.id}')">
                    <h3 class="font-serif text-xl sm:text-2xl font-medium text-ink leading-snug hover:text-coral transition-colors">${esc(sit.title)}</h3>
                    <p class="text-sm text-ink-secondary mt-1.5 leading-relaxed">${esc(sit.summary)}</p>
                  </div>

                  <!-- Quick Inline Step Preview (first 3 steps clickable) -->
                  <div class="mt-4 pt-4 border-t border-hairline space-y-2">
                    ${sit.steps.slice(0, 3).map(st => `
                      <label class="flex items-start gap-3 cursor-pointer group">
                        <input type="checkbox" ${st.done ? 'checked' : ''}
                          onchange="toggleStep('${sit.id}', '${st.id}')"
                          class="mt-1 w-4 h-4 rounded accent-[#4B6B53] cursor-pointer" />
                        <span class="text-sm leading-snug ${st.done ? 'line-through text-ink-muted' : 'text-ink group-hover:text-ink'}">${esc(st.text)}</span>
                      </label>
                    `).join('')}
                    ${sit.steps.length > 3 ? `<div class="text-xs text-ink-muted pl-7">+ ${sit.steps.length - 3} more step${sit.steps.length - 3 === 1 ? '' : 's'} inside workspace</div>` : ''}
                  </div>

                  <!-- Progress & Action Footer -->
                  <div class="mt-5 pt-4 border-t border-hairline flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex-1 max-w-xs">
                      <div class="flex items-center justify-between text-[11px] text-ink-muted mb-1">
                        <span>${done}/${total} steps · ${readyDocs}/${linkedDocs.length} docs ready</span>
                        <span class="font-mono">${pct}%</span>
                      </div>
                      <div class="h-1.5 bg-surface rounded-full overflow-hidden">
                        <div class="h-full bg-sage rounded-full transition-all" style="width:${pct}%"></div>
                      </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                      <button onclick="openSituationWorkspace('${sit.id}')"
                        class="px-3.5 py-2 rounded-xl bg-surface hover:bg-hairline/70 text-ink text-xs font-medium transition-colors">
                        Open Workspace
                      </button>
                      <button onclick="openResolveSituationModal('${sit.id}')"
                        class="px-3.5 py-2 rounded-xl bg-sage hover:bg-sage/90 text-paper text-xs font-medium transition-colors">
                        Mark as Resolved
                      </button>
                    </div>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    function toggleFixitBuilder() {
      uiState.fixitBuilderOpen = !uiState.fixitBuilderOpen;
      renderCurrentView();
    }

    function fillFixitPrompt(idx) {
      uiState.fixitDraftPrompt = EXAMPLE_PROMPTS[idx] || '';
      const ta = document.getElementById('fixit-prompt-input');
      if (ta) {
        ta.value = uiState.fixitDraftPrompt;
        ta.focus();
      }
    }

    function handleFixitGenerate(e) {
      e.preventDefault();
      const ta = document.getElementById('fixit-prompt-input');
      const catSel = document.getElementById('fixit-cat-override');
      const text = (ta?.value || '').trim();
      if (!text) {
        showToast('Please describe the situation in plain language first.', 'amber');
        ta?.focus();
        return;
      }
      uiState.fixitDraftPrompt = '';
      uiState.fixitBuilderOpen = false;
      createPlanAndOpen(text, catSel?.value || null);
    }

    function toggleStep(sitId, stepId, rerenderModal = false) {
      const sit = state.situations.find(s => s.id === sitId);
      if (!sit) return;
      const step = sit.steps.find(st => st.id === stepId);
      if (!step) return;
      step.done = !step.done;
      saveState();
      renderCurrentView();
      if (rerenderModal) openSituationWorkspace(sitId);
    }

    // -------------------- FULL RECOVERY WORKSPACE MODAL (Edit Everything) --------------------
    function openSituationWorkspace(sitId) {
      const sit = state.situations.find(s => s.id === sitId);
      if (!sit) return;
      const linkedDocs = state.documents.filter(d => d.situationId === sit.id);
      const linkedCall = state.callPreps.find(c => c.id === sit.callPrepId || c.situationId === sit.id);
      const { done, total, pct } = getStepStats(sit);

      openModal(`
        <div class="p-5 sm:p-6 border-b border-hairline flex items-start justify-between gap-3 bg-paper sticky top-0 z-10">
          <div class="min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-[11px] font-mono uppercase tracking-wider text-ink-muted">Recovery Workspace</span>
              ${urgencyBadge(sit.urgency)}
            </div>
            <h2 class="font-serif text-xl sm:text-2xl font-medium text-ink leading-snug">${esc(sit.title)}</h2>
          </div>
          <button onclick="closeModal()" class="p-2 rounded-xl text-ink-muted hover:bg-surface shrink-0">${ICONS.close}</button>
        </div>

        <div class="p-5 sm:p-6 overflow-y-auto space-y-6">
          <!-- Editable Core Details -->
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-medium text-ink-secondary mb-1">Plan Title</label>
              <input id="ws-title" type="text" value="${esc(sit.title)}"
                onchange="updateSituationField('${sit.id}', 'title', this.value)"
                class="w-full px-3.5 py-2.5 rounded-xl bg-canvas border border-hairline text-sm font-medium text-ink" />
            </div>
            <div>
              <label class="block text-xs font-medium text-ink-secondary mb-1">Calm Summary & Approach</label>
              <textarea id="ws-summary" rows="2"
                onchange="updateSituationField('${sit.id}', 'summary', this.value)"
                class="w-full px-3.5 py-2.5 rounded-xl bg-canvas border border-hairline text-sm text-ink">${esc(sit.summary)}</textarea>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block text-xs font-medium text-ink-secondary mb-1">Category</label>
                <select onchange="updateSituationField('${sit.id}', 'category', this.value)"
                  class="w-full px-3 py-2.5 rounded-xl bg-canvas border border-hairline text-sm text-ink">
                  ${CATEGORIES.map(c => `<option value="${c}" ${sit.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-ink-secondary mb-1">Urgency</label>
                <select onchange="updateSituationField('${sit.id}', 'urgency', this.value)"
                  class="w-full px-3 py-2.5 rounded-xl bg-canvas border border-hairline text-sm text-ink">
                  <option value="calm" ${sit.urgency === 'calm' ? 'selected' : ''}>Calm</option>
                  <option value="soon" ${sit.urgency === 'soon' ? 'selected' : ''}>Soon</option>
                  <option value="urgent" ${sit.urgency === 'urgent' ? 'selected' : ''}>Urgent</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-ink-secondary mb-1">Estimated Effort</label>
                <input type="text" value="${esc(sit.effort)}"
                  onchange="updateSituationField('${sit.id}', 'effort', this.value)"
                  placeholder="e.g. 20 min"
                  class="w-full px-3 py-2.5 rounded-xl bg-canvas border border-hairline text-sm text-ink" />
              </div>
            </div>
          </div>

          <!-- Ordered Actionable Steps -->
          <div class="pt-4 border-t border-hairline">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h3 class="font-serif text-lg font-medium text-ink">Ordered Recovery Steps</h3>
                <p class="text-xs text-ink-muted">${done} of ${total} completed (${pct}%) — edit, reorder, or add steps freely</p>
              </div>
            </div>
            <div class="space-y-2">
              ${sit.steps.map((st, idx) => `
                <div class="flex items-start gap-2 p-2.5 rounded-xl bg-canvas border border-hairline">
                  <input type="checkbox" ${st.done ? 'checked' : ''}
                    onchange="toggleStep('${sit.id}', '${st.id}', true)"
                    class="mt-2 w-4 h-4 accent-[#4B6B53] cursor-pointer shrink-0" />
                  <input type="text" value="${esc(st.text)}"
                    onchange="editStepText('${sit.id}', '${st.id}', this.value)"
                    class="flex-1 bg-transparent border border-transparent focus:bg-paper px-2 py-1 rounded-lg text-sm ${st.done ? 'line-through text-ink-muted' : 'text-ink'}" />
                  <div class="flex items-center gap-0.5 shrink-0">
                    <button type="button" title="Move up" onclick="moveStep('${sit.id}', ${idx}, -1)" ${idx === 0 ? 'disabled' : ''}
                      class="p-1.5 rounded-lg text-ink-muted hover:text-ink hover:bg-surface disabled:opacity-30 text-xs">↑</button>
                    <button type="button" title="Move down" onclick="moveStep('${sit.id}', ${idx}, 1)" ${idx === sit.steps.length - 1 ? 'disabled' : ''}
                      class="p-1.5 rounded-lg text-ink-muted hover:text-ink hover:bg-surface disabled:opacity-30 text-xs">↓</button>
                    <button type="button" title="Delete step" onclick="deleteStep('${sit.id}', '${st.id}')"
                      class="p-1.5 rounded-lg text-ink-muted hover:text-coral hover:bg-coral-soft/60">${ICONS.trash}</button>
                  </div>
                </div>
              `).join('')}
            </div>
            <form onsubmit="addStepToSituation(event, '${sit.id}')" class="flex gap-2 mt-3">
              <input id="ws-new-step" type="text" placeholder="Add another step..."
                class="flex-1 px-3.5 py-2 rounded-xl bg-canvas border border-hairline text-sm" />
              <button type="submit" class="px-3.5 py-2 rounded-xl bg-surface hover:bg-hairline text-ink text-xs font-medium">Add Step</button>
            </form>
          </div>

          <!-- Deadline Recovery Sync -->
          <div class="pt-4 border-t border-hairline">
            <h3 class="font-serif text-lg font-medium text-ink mb-2">Deadline Recovery</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-ink-muted mb-1">Original Deadline (if any)</label>
                <input type="date" value="${esc(sit.deadline?.originalDate || '')}"
                  onchange="updateSituationDeadline('${sit.id}', 'originalDate', this.value)"
                  class="w-full px-3 py-2 rounded-xl bg-canvas border border-hairline text-sm font-mono" />
              </div>
              <div>
                <label class="block text-xs text-ink-muted mb-1">Revised Target Deadline</label>
                <input type="date" value="${esc(sit.deadline?.revisedDate || '')}"
                  onchange="updateSituationDeadline('${sit.id}', 'revisedDate', this.value)"
                  class="w-full px-3 py-2 rounded-xl bg-canvas border border-hairline text-sm font-mono" />
              </div>
              <div class="sm:col-span-2">
                <label class="block text-xs text-ink-muted mb-1">Concrete Next Action</label>
                <input type="text" value="${esc(sit.deadline?.nextAction || '')}"
                  onchange="updateSituationDeadline('${sit.id}', 'nextAction', this.value)"
                  placeholder="One calm next step..."
                  class="w-full px-3 py-2 rounded-xl bg-canvas border border-hairline text-sm" />
              </div>
            </div>
          </div>

          <!-- Linked Documents & Call Prep Shortcuts -->
          <div class="pt-4 border-t border-hairline grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="p-4 rounded-2xl bg-canvas border border-hairline">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-semibold text-ink">Required Info & Docs (${linkedDocs.length})</span>
                <button onclick="closeModal(); uiState.docFilterSituation='${sit.id}'; navigate('documents')" class="text-xs text-coral hover:underline">Manage</button>
              </div>
              <ul class="space-y-1.5 text-xs text-ink-secondary">
                ${linkedDocs.length === 0 ? `<li class="text-ink-muted">No documents listed yet.</li>` : linkedDocs.slice(0, 4).map(d => `
                  <li class="flex items-center justify-between gap-2">
                    <span class="truncate">${esc(d.name)}</span>
                    ${docStatusBadge(d.status)}
                  </li>
                `).join('')}
              </ul>
            </div>

            <div class="p-4 rounded-2xl bg-canvas border border-hairline flex flex-col justify-between">
              <div>
                <div class="text-xs font-semibold text-ink mb-1">Call Prep Script</div>
                <p class="text-xs text-ink-secondary leading-relaxed">
                  ${linkedCall ? esc(linkedCall.organization) + ' — script, talking points, and call notes ready.' : 'Create a call prep guide if you need to speak with someone.'}
                </p>
              </div>
              <button onclick="openLinkedCallPrep('${sit.id}')" class="mt-3 w-full py-2 rounded-xl bg-paper border border-hairline hover:bg-surface text-xs font-medium text-ink transition-colors">
                ${linkedCall ? 'Open Call Prep Sheet' : 'Create Call Prep Sheet'}
              </button>
            </div>
          </div>
        </div>

        <!-- Workspace Footer Actions -->
        <div class="p-4 sm:p-5 border-t border-hairline bg-canvas/80 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <button onclick="duplicateSituation('${sit.id}')" class="px-3 py-2 rounded-xl border border-hairline bg-paper hover:bg-surface text-xs font-medium text-ink-secondary">
              Duplicate
            </button>
            <button onclick="confirmDeleteSituation('${sit.id}')" class="px-3 py-2 rounded-xl border border-hairline bg-paper hover:bg-coral-soft hover:text-coral-dark text-xs font-medium text-ink-secondary">
              Delete
            </button>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-hairline bg-paper text-xs font-medium text-ink">
              Done Editing
            </button>
            <button onclick="openResolveSituationModal('${sit.id}')" class="px-4 py-2 rounded-xl bg-sage hover:bg-sage/90 text-paper text-xs font-medium">
              Mark as Resolved
            </button>
          </div>
        </div>
      `);
    }

    function updateSituationField(sitId, field, value) {
      const sit = state.situations.find(s => s.id === sitId);
      if (!sit) return;
      if (field === 'title' && !value.trim()) {
        showToast('Title cannot be empty.', 'amber');
        return;
      }
      sit[field] = value.trim ? value.trim() : value;
      saveState();
      renderCurrentView();
    }

    function updateSituationDeadline(sitId, field, value) {
      const sit = state.situations.find(s => s.id === sitId);
      if (!sit) return;
      if (!sit.deadline) sit.deadline = { originalDate: '', revisedDate: '', reminderNote: '', nextAction: '' };
      sit.deadline[field] = value;
      saveState();
      renderCurrentView();
    }

    function editStepText(sitId, stepId, text) {
      const sit = state.situations.find(s => s.id === sitId);
      if (!sit) return;
      const st = sit.steps.find(x => x.id === stepId);
      if (!st || !text.trim()) return;
      st.text = text.trim();
      saveState();
      renderCurrentView();
    }

    function moveStep(sitId, idx, dir) {
      const sit = state.situations.find(s => s.id === sitId);
      if (!sit) return;
      const target = idx + dir;
      if (target < 0 || target >= sit.steps.length) return;
      [sit.steps[idx], sit.steps[target]] = [sit.steps[target], sit.steps[idx]];
      saveState();
      openSituationWorkspace(sitId);
      renderCurrentView();
    }

    function deleteStep(sitId, stepId) {
      const sit = state.situations.find(s => s.id === sitId);
      if (!sit) return;
      sit.steps = sit.steps.filter(x => x.id !== stepId);
      saveState();
      openSituationWorkspace(sitId);
      renderCurrentView();
    }

    function addStepToSituation(e, sitId) {
      e.preventDefault();
      const input = document.getElementById('ws-new-step');
      const text = (input?.value || '').trim();
      if (!text) return;
      const sit = state.situations.find(s => s.id === sitId);
      if (!sit) return;
      sit.steps.push({ id: uid('st'), text, done: false });
      saveState();
      openSituationWorkspace(sitId);
      renderCurrentView();
    }

    function duplicateSituation(sitId) {
      const orig = state.situations.find(s => s.id === sitId);
      if (!orig) return;

      saveState();
      closeModal();

    function submitManualPlan(e) {
      e.preventDefault();
      const title = document.getElementById('mp-title').value.trim();
      if (!title) return;
      const summary = document.getElementById('mp-summary').value.trim() || 'Step-by-step recovery plan.';
      const category = document.getElementById('mp-category').value;
      const urgency = document.getElementById('mp-urgency').value;
      const effort = document.getElementById('mp-effort').value.trim() || '20 min';
      const rawSteps = document.getElementById('mp-steps').value.split('\n').map(s => s.trim()).filter(Boolean);
      const steps = (rawSteps.length ? rawSteps : ['Take the first small step toward resolving this']).map(t => ({ id: uid('st'), text: t, done: false }));

      const sit = {
        id: uid('sit'),
        status: 'active',
        title,
        summary,
        originalPrompt: title,
        category,
        urgency,
        effort,
        createdAt: todayISO(),
        completedAt: null,
        outcomeNotes: '',
        steps,
        deadline: {
          originalDate: document.getElementById('mp-orig-date').value,
          revisedDate: document.getElementById('mp-rev-date').value,
          reminderNote: '',
          nextAction: steps[0]?.text || '',
        },
        callPrepId: null,
      };
      state.situations.unshift(sit);
      saveState();
      closeModal();
      renderCurrentView();
      showToast('Manual recovery plan created.', 'sage');
    }

    function submitResolveSituation(e, sitId) {
      e.preventDefault();
      const sit = state.situations.find(s => s.id === sitId);
      if (!sit) return;
      const completionDate = document.getElementById('res-date').value || todayISO();
      const refNumber = document.getElementById('res-ref').value.trim();
      const organization = document.getElementById('res-org').value.trim();
      const contactName = document.getElementById('res-contact').value.trim();
      const notes = document.getElementById('res-notes').value.trim();
      const attNote = document.getElementById('res-att-note').value.trim();

      sit.status = 'completed';
      sit.completedAt = completionDate;
      sit.outcomeNotes = notes || 'Resolved and closed.';
      sit.steps.forEach(st => st.done = true);

      const proof = {
        id: uid('prf'),
        situationId: sit.id,
        waitingItemId: null,
        title: sit.title,
        completionDate,
        organization: organization || sit.category,
        refNumber,
        contactName,
        notes: sit.outcomeNotes,
        attachments: attNote ? [{ id: uid('att'), kind: 'note', name: 'Supporting Reference', textNote: attNote }] : [],
      };
      state.proofs.unshift(proof);
      saveState();
      closeModal();
      renderCurrentView();
      showToast('Marked as resolved and archived with Proof of Done.', 'sage');
    }

                      Send Follow-up to Waiting Room
                    </button>
                    <button onclick="sendCallNotesToProof('${active.id}')"
                      class="px-4 py-2.5 rounded-xl bg-sage-soft text-sage hover:bg-sage hover:text-paper text-xs font-medium transition-colors">
                      Record as Proof of Done
                    </button>
                  </div>
                </div>

    function createStandaloneCallPrep() {
      const cp = {
        id: uid('cp'),
        situationId: null,
        title: 'New Call Prep Guide',
        organization: '',
        phone: '',
        openingScript: 'Hello, my name is [Your Name]. I am calling to get an update and resolve my account smoothly today.',
        talkingPoints: ['Keep the tone calm and concise.'],
        questions: ['Could you share a confirmation or reference number for this call?'],
        checklist: [{ id: uid('cc'), text: 'Account number & notepad ready', done: false }],
        callNotes: { repName: '', callDate: todayISO(), refNumber: '', notes: '' },
      };
      state.callPreps.unshift(cp);
      uiState.callPrepSelectedId = cp.id;
      saveState();
      renderCurrentView();
      showToast('New Call Prep sheet created.', 'sage');
    }

    function updateCallPrep(id, field, value) {
      const cp = state.callPreps.find(c => c.id === id);
      if (!cp) return;
      cp[field] = value;
      saveState();
      if (field === 'title' || field === 'organization') renderCurrentView();
    }

    function copyCallScript(id) {
      const cp = state.callPreps.find(c => c.id === id);
      if (!cp) return;
      copyTextToClipboard(cp.openingScript, 'Opening script copied to clipboard');
    }

    function editCallList(id, listKey, idx, val) {
      const cp = state.callPreps.find(c => c.id === id);
      if (!cp) return;
      cp[listKey][idx] = val;
      saveState();
    }

    function removeCallList(id, listKey, idx) {
      const cp = state.callPreps.find(c => c.id === id);
      if (!cp) return;
      cp[listKey].splice(idx, 1);
      saveState();
      renderCurrentView();
    }

    function addCallList(e, id, listKey, inputId) {
      e.preventDefault();
      const inp = document.getElementById(inputId);
      const val = (inp?.value || '').trim();
      if (!val) return;
      const cp = state.callPreps.find(c => c.id === id);
      if (!cp) return;
      cp[listKey].push(val);
      saveState();
      renderCurrentView();
    }

    function toggleCallChecklist(id, itemId) {
      const cp = state.callPreps.find(c => c.id === id);
      if (!cp) return;
      const item = cp.checklist.find(x => x.id === itemId);
      if (!item) return;
      item.done = !item.done;
      saveState();
      renderCurrentView();
    }

    function deleteCallChecklist(id, itemId) {
      const cp = state.callPreps.find(c => c.id === id);
      if (!cp) return;
      cp.checklist = cp.checklist.filter(x => x.id !== itemId);
      saveState();
      renderCurrentView();
    }

    function addCallChecklist(e, id) {
      e.preventDefault();
      const inp = document.getElementById('add-cc-input');
      const val = (inp?.value || '').trim();
      if (!val) return;
      const cp = state.callPreps.find(c => c.id === id);
      if (!cp) return;
      cp.checklist.push({ id: uid('cc'), text: val, done: false });
      saveState();
      renderCurrentView();
    }

    function updateCallNotes(id, field, val) {
      const cp = state.callPreps.find(c => c.id === id);
      if (!cp) return;
      if (!cp.callNotes) cp.callNotes = { repName: '', callDate: todayISO(), refNumber: '', notes: '' };
      cp.callNotes[field] = val;
      saveState();
    }

    function confirmDeleteCallPrep(id) {
      showConfirm('Delete this Call Prep sheet?', 'Your script and notes for this sheet will be removed.', () => {
        state.callPreps = state.callPreps.filter(c => c.id !== id);
        if (uiState.callPrepSelectedId === id) uiState.callPrepSelectedId = state.callPreps[0]?.id || null;
        saveState();
        renderCurrentView();
        showToast('Call Prep deleted.', 'neutral');
      });
    }

    function sendCallNotesToWaitingRoom(cpId) {
      const cp = state.callPreps.find(c => c.id === cpId);
      if (!cp) return;
      const item = {
        id: uid('wait'),
        situationId: cp.situationId || null,
        title: `Follow-up: ${cp.title.replace(/\s*—\s*Call Prep$/i, '')}`,
        organization: cp.organization || 'Contacted Office',
        type: 'Follow-up',
        dateInitiated: cp.callNotes?.callDate || todayISO(),
        followUpDate: daysOffset(7),
        refNumber: cp.callNotes?.refNumber || '',
        status: 'waiting',
        logs: [{
          id: uid('wl'),
          date: cp.callNotes?.callDate || todayISO(),
          note: `Spoke with ${cp.callNotes?.repName || 'representative'}. ${cp.callNotes?.notes || 'Awaiting follow-up.'}`,
        }],
      };
      state.waitingItems.unshift(item);
      saveState();
      showToast('Added follow-up to Waiting Room.', 'sage');
      navigate('waiting');
    }

    function sendCallNotesToProof(cpId) {
      const cp = state.callPreps.find(c => c.id === cpId);
      if (!cp) return;
      const proof = {
        id: uid('prf'),
        situationId: cp.situationId || null,
        waitingItemId: null,
        title: cp.title.replace(/\s*—\s*Call Prep$/i, ''),
        completionDate: cp.callNotes?.callDate || todayISO(),
        organization: cp.organization || 'Phone Confirmation',
        refNumber: cp.callNotes?.refNumber || '',
        contactName: cp.callNotes?.repName || '',
        notes: cp.callNotes?.notes || 'Confirmed by phone.',
        attachments: [],
      };
      state.proofs.unshift(proof);
      saveState();
      showToast('Saved call outcome to Proof of Done.', 'sage');
      navigate('proof');
    }

      });

      el.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6">

          </button>

        <!-- Filters -->

            ${['All', 'needed', 'ready', 'submitted'].map(st => `
              <button onclick="uiState.docFilterStatus='${st}'; renderCurrentView()"
                class="px-3 py-1.5 rounded-lg text-xs font-medium capitalize transition-colors ${
                  uiState.docFilterStatus === st ? 'bg-paper text-ink shadow-sm' : 'text-ink-secondary hover:text-ink'
                }">${st}</button>
            `).join('')}
          </div>

          <select onchange="uiState.docFilterSituation=this.value; renderCurrentView()"
            class="px-3 py-2 rounded-xl bg-paper border border-hairline text-xs text-ink">
            <option value="All">All Situations</option>
            <option value="standalone" ${uiState.docFilterSituation === 'standalone' ? 'selected' : ''}>Standalone Items</option>
            ${activeSits.map(s => `<option value="${s.id}" ${uiState.docFilterSituation === s.id ? 'selected' : ''}>${esc(s.title)}</option>`).join('')}
          </select>
        </div>

        ${filtered.length === 0 ? `
          <div class="bg-paper rounded-3xl border border-hairline p-10 text-center">
            <p class="font-serif text-xl text-ink">No documents in this view</p>
            <p class="text-sm text-ink-muted mt-1">Add account numbers, receipts, or forms you need to gather.</p>
            <button onclick="openDocModal()" class="mt-4 px-4 py-2 rounded-xl bg-coral text-paper text-xs font-medium">Add Document Item</button>
          </div>
        ` : `
          <div class="bg-paper rounded-3xl border border-hairline shadow-card divide-y divide-hairline overflow-hidden">
            ${filtered.map(doc => {
              const sit = state.situations.find(s => s.id === doc.situationId);
              return `
                <div class="p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-canvas/50 transition-colors">
                  <div class="flex items-start gap-3.5 min-w-0">
                    <button onclick="cycleDocStatus('${doc.id}')" title="Cycle status (Needed → Ready → Submitted)"
                      class="mt-0.5 w-6 h-6 rounded-lg border flex items-center justify-center shrink-0 transition-colors ${
                        doc.status === 'ready' || doc.status === 'submitted'
                          ? 'bg-sage border-sage text-paper'
                          : 'bg-canvas border-ink-muted/40 text-transparent hover:border-coral'
                      }">
                      ${ICONS.check}
                    </button>
                    <div class="min-w-0">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="text-sm font-semibold text-ink">${esc(doc.name)}</span>

                      ${doc.note ? `<div class="text-xs text-ink-secondary mt-1 font-mono break-words">${esc(doc.note)}</div>` : ''}

                    </div>
                  </div>
                  <div class="flex items-center gap-1.5 self-end sm:self-center shrink-0">

          </div>

    }

    function cycleDocStatus(id) {
      const doc = state.documents.find(d => d.id === id);
      if (!doc) return;
      const order = ['needed', 'ready', 'submitted'];
      doc.status = order[(order.indexOf(doc.status) + 1) % order.length];
      saveState();
      renderCurrentView();
    }

    function openDocModal(docId = null) {
      const existing = docId ? state.documents.find(d => d.id === docId) : null;
      const activeSits = state.situations.filter(s => s.status === 'active');

      openModal(`
        <div class="p-5 sm:p-6 border-b border-hairline flex items-center justify-between">
          <h2 class="font-serif text-2xl font-medium text-ink">${existing ? 'Edit Document Item' : 'Add Document or Detail'}</h2>
          <button onclick="closeModal()" class="p-2 rounded-xl text-ink-muted hover:bg-surface">${ICONS.close}</button>
        </div>
        <form onsubmit="submitDocModal(event, '${existing ? existing.id : ''}')" class="p-5 sm:p-6 space-y-4">
          <div>
            <label class="block text-xs font-medium text-ink-secondary mb-1">Document / Detail Name *</label>
            <input id="doc-name" type="text" required value="${esc(existing?.name || '')}" placeholder="e.g., Auto Insurance Policy Card"
              class="w-full px-3.5 py-2.5 rounded-xl bg-canvas border border-hairline text-sm" />

              <select id="doc-status" class="w-full px-3 py-2.5 rounded-xl bg-canvas border border-hairline text-sm">
                <option value="needed" ${existing?.status === 'needed' ? 'selected' : ''}>Needed</option>
                <option value="ready" ${existing?.status === 'ready' ? 'selected' : ''}>Ready</option>
                <option value="submitted" ${existing?.status === 'submitted' ? 'selected' : ''}>Submitted</option>

            <input id="doc-note" type="text" value="${esc(existing?.note || '')}" placeholder="e.g., Account #4821-902 or PDF in Downloads"
              class="w-full px-3.5 py-2.5 rounded-xl bg-canvas border border-hairline text-sm" />
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t border-hairline">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl border border-hairline text-sm text-ink-secondary">Cancel</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-coral hover:bg-coral-dark text-paper text-sm font-medium">${existing ? 'Save Changes' : 'Add Document'}</button>
          </div>
        </form>
      `);
    }

    function submitDocModal(e, docId) {
      e.preventDefault();
      const name = document.getElementById('doc-name').value.trim();
      if (!name) return;
      const situationId = document.getElementById('doc-sit').value || null;
      const status = document.getElementById('doc-status').value;
      const note = document.getElementById('doc-note').value.trim();

      if (docId) {
        const doc = state.documents.find(d => d.id === docId);
        if (doc) Object.assign(doc, { name, situationId, status, note });
        showToast('Document updated.', 'sage');
      } else {
        state.documents.unshift({ id: uid('doc'), name, situationId, status, note });
        showToast('Document added to checklist.', 'sage');
      }
      saveState();
      closeModal();
      renderCurrentView();
    }

    function confirmDeleteDoc(id) {
      showConfirm('Remove this document item?', 'It will be removed from your checklist.', () => {
        state.documents = state.documents.filter(d => d.id !== id);
        saveState();
        renderCurrentView();
        showToast('Document removed.', 'neutral');
      });
    }

    function submitWaitingModal(e, waitId) {
      e.preventDefault();
      const title = document.getElementById('w-title').value.trim();
      const organization = document.getElementById('w-org').value.trim();
      if (!title || !organization) return;

      const data = {
        title,
        organization,
        type: document.getElementById('w-type').value,
        dateInitiated: document.getElementById('w-init').value || todayISO(),
        followUpDate: document.getElementById('w-fup').value,
        refNumber: document.getElementById('w-ref').value.trim(),
        status: document.getElementById('w-status').value,
        situationId: document.getElementById('w-sit').value || null,
      };

      if (waitId) {
        const w = state.waitingItems.find(x => x.id === waitId);
        if (w) Object.assign(w, data);
        showToast('Waiting item updated.', 'sage');
      } else {
        const initNote = document.getElementById('w-note')?.value.trim();
        state.waitingItems.unshift({
          id: uid('wait'),
          ...data,
          logs: initNote ? [{ id: uid('wl'), date: data.dateInitiated, note: initNote }] : [],
        });
        showToast('Added to Waiting Room.', 'sage');
      }
      saveState();
      closeModal();
      renderCurrentView();
    }

    function openLogFollowupModal(waitId) {
      const w = state.waitingItems.find(x => x.id === waitId);
      if (!w) return;
      openModal(`
        <div class="p-5 sm:p-6 border-b border-hairline flex items-center justify-between">
          <div>
            <h2 class="font-serif text-2xl font-medium text-ink">Log Follow-Up</h2>
            <p class="text-xs text-ink-muted mt-0.5">${esc(w.title)}</p>
          </div>
          <button onclick="closeModal()" class="p-2 rounded-xl text-ink-muted hover:bg-surface">${ICONS.close}</button>
        </div>
        <form onsubmit="submitFollowupLog(event, '${w.id}')" class="p-5 sm:p-6 space-y-4">
          <div>
            <label class="block text-xs font-medium text-ink-secondary mb-1">Follow-up Note *</label>
            <textarea id="fl-note" required rows="3" placeholder="e.g., Sent polite check-in email; rep said refund will process by Friday."
              class="w-full px-3.5 py-2.5 rounded-xl bg-canvas border border-hairline text-sm"></textarea>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-ink-secondary mb-1">Next Follow-Up Date</label>
              <input id="fl-next" type="date" value="${daysOffset(7)}" class="w-full px-3 py-2.5 rounded-xl bg-canvas border border-hairline text-sm font-mono" />
            </div>
            <div>
              <label class="block text-xs font-medium text-ink-secondary mb-1">Update Status</label>
              <select id="fl-status" class="w-full px-3 py-2.5 rounded-xl bg-canvas border border-hairline text-sm">
                <option value="waiting" selected>Waiting</option>
                <option value="followup_due">Follow-up Due</option>
                <option value="escalated">Escalated</option>
              </select>
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t border-hairline">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl border border-hairline text-sm text-ink-secondary">Cancel</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-coral hover:bg-coral-dark text-paper text-sm font-medium">Save Log</button>
          </div>
        </form>
      `);
    }

    function submitFollowupLog(e, waitId) {
      e.preventDefault();
      const w = state.waitingItems.find(x => x.id === waitId);
      if (!w) return;
      const note = document.getElementById('fl-note').value.trim();
      if (!note) return;
      w.logs = w.logs || [];
      w.logs.push({ id: uid('wl'), date: todayISO(), note });
      w.followUpDate = document.getElementById('fl-next').value || w.followUpDate;
      w.status = document.getElementById('fl-status').value;
      saveState();
      closeModal();
      renderCurrentView();
      showToast('Follow-up logged.', 'sage');
    }

    function markWaitingReceived(waitId) {
      const w = state.waitingItems.find(x => x.id === waitId);
      if (!w) return;
      w.status = 'received';
      w.logs = w.logs || [];
      w.logs.push({ id: uid('wl'), date: todayISO(), note: 'Marked as received / resolved.' });

      state.proofs.unshift({
        id: uid('prf'),
        situationId: w.situationId || null,
        waitingItemId: w.id,
        title: w.title,
        completionDate: todayISO(),
        organization: w.organization,
        refNumber: w.refNumber || '',
        contactName: '',
        notes: `Received / completed from Waiting Room (${w.type}).`,
        attachments: [],
      });
      saveState();
      renderCurrentView();
      showToast('Marked received and saved to Proof of Done.', 'sage');
    }

    function confirmDeleteWaiting(id) {
      showConfirm('Delete this Waiting Room item?', 'Its follow-up timeline will be removed.', () => {
        state.waitingItems = state.waitingItems.filter(w => w.id !== id);
        saveState();
        renderCurrentView();
        showToast('Waiting item removed.', 'neutral');
      });
    }

          </div>
          <button onclick="openDeadlineModal()"
            class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-coral hover:bg-coral-dark text-paper text-sm font-medium transition-colors shadow-sm self-start sm:self-auto">

              }">${f.l}</button>
          `).join('')}
        </div>

        ${filtered.length === 0 ? `
          <div class="bg-paper rounded-3xl border border-hairline p-10 text-center">

          </div>
        ` : `
          <div class="space-y-4">
            ${filtered.map(d => {

                badge = `<span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-coral-soft text-coral-dark">Revised target soon</span>`;
              } else if (revDiff !== null && revDiff < 0) {
                badge = `<span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-amberwarm-soft text-amberwarm">Ready for a fresh target date</span>`;
              } else if (!d.revisedDate) {
                badge = `<span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-amberwarm-soft text-amberwarm">Needs revised date</span>`;
              }

              return `
                <article class="bg-paper rounded-3xl border border-hairline shadow-card p-5 sm:p-6">
                  <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <div class="flex items-center gap-2">
                      <span class="text-[11px] uppercase tracking-wider text-ink-muted font-medium">${esc(d.category)}</span>
                      ${origDiff !== null && origDiff < 0 ? `<span class="text-[11px] px-2 py-0.5 rounded-full bg-canvas border border-hairline text-ink-muted">Original date passed — reframed</span>` : ''}

                    ${badge}

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4 p-3.5 rounded-2xl bg-canvas border border-hairline">
                    <div>
                      <div class="text-[11px] text-ink-muted uppercase tracking-wider">Original Deadline</div>
                      <div class="font-mono text-sm text-ink-secondary mt-0.5">${formatDate(d.originalDate)}</div>
                    </div>
                    <div>
                      <div class="text-[11px] text-ink-muted uppercase tracking-wider">Revised Target</div>
                      <div class="font-mono text-sm font-medium text-ink mt-0.5">${formatDate(d.revisedDate)}</div>
                    </div>
                  </div>

                  ${d.nextAction ? `
                    <div class="mt-3.5 text-sm text-ink">

            category: s.category,
            originalDate: s.deadline?.originalDate || '',
            revisedDate: s.deadline?.revisedDate || '',
            reminderNote: s.deadline?.reminderNote || '',
            nextAction: s.deadline?.nextAction || '',

      } else if (kind === 'standalone' && id) {

      openModal(`
        <div class="p-5 sm:p-6 border-b border-hairline flex items-center justify-between">
          <h2 class="font-serif text-2xl font-medium text-ink">${existing ? 'Update Deadline Recovery' : 'Add Standalone Deadline'}</h2>

              <select id="dl-cat" class="w-full px-3 py-2.5 rounded-xl bg-canvas border border-hairline text-sm">
                ${CATEGORIES.map(c => `<option value="${c}" ${existing?.category === c ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
            </div>
          ` : `
            <div class="p-3 rounded-xl bg-surface text-sm font-medium text-ink">${esc(existing?.title || '')}</div>
          `}
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-ink-secondary mb-1">Original Deadline</label>
              <input id="dl-orig" type="date" value="${esc(existing?.originalDate || '')}" class="w-full px-3 py-2.5 rounded-xl bg-canvas border border-hairline text-sm font-mono" />

              <label class="block text-xs font-medium text-ink-secondary mb-1">Revised Target Deadline</label>
              <input id="dl-rev" type="date" value="${esc(existing?.revisedDate || daysOffset(3))}" class="w-full px-3 py-2.5 rounded-xl bg-canvas border border-hairline text-sm font-mono" />

              class="w-full px-3.5 py-2.5 rounded-xl bg-canvas border border-hairline text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-ink-secondary mb-1">Calm Reminder Note</label>
            <textarea id="dl-note" rows="2" placeholder="Helpful context or grace period note..."
              class="w-full px-3.5 py-2.5 rounded-xl bg-canvas border border-hairline text-sm">${esc(existing?.reminderNote || '')}</textarea>
          </div>
          <div class="flex justify-end gap-2 pt-3 border-t border-hairline">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl border border-hairline text-sm text-ink-secondary">Cancel</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-coral hover:bg-coral-dark text-paper text-sm font-medium">Save Deadline</button>

    function submitDeadlineModal(e, kind, id) {
      e.preventDefault();
      const originalDate = document.getElementById('dl-orig').value;
      const revisedDate = document.getElementById('dl-rev').value;
      const nextAction = document.getElementById('dl-action').value.trim();
      const reminderNote = document.getElementById('dl-note').value.trim();

      if (kind === 'situation' && id) {
        const s = state.situations.find(x => x.id === id);
        if (s) s.deadline = { originalDate, revisedDate, nextAction, reminderNote };
      } else {
        const title = document.getElementById('dl-title').value.trim();
        if (!title) return;
        const category = document.getElementById('dl-cat').value;
        if (id) {
          const d = state.standaloneDeadlines.find(x => x.id === id);
          if (d) Object.assign(d, { title, category, originalDate, revisedDate, nextAction, reminderNote });
        } else {
          state.standaloneDeadlines.unshift({ id: uid('dl'), title, category, originalDate, revisedDate, nextAction, reminderNote });
        }
      }
      saveState();
      closeModal();
      renderCurrentView();
      showToast('Deadline saved.', 'sage');
    }

    function confirmDeleteDeadline(id) {
      showConfirm('Delete this standalone deadline?', 'This deadline entry will be removed.', () => {
        state.standaloneDeadlines = state.standaloneDeadlines.filter(d => d.id !== id);
        saveState();
        renderCurrentView();
        showToast('Deadline removed.', 'neutral');
      });
    }

          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-ink-secondary mb-1">Completion Date *</label>
              <input id="pf-date" type="date" required value="${esc(existing?.completionDate || todayISO())}" class="w-full px-3 py-2.5 rounded-xl bg-canvas border border-hairline text-sm font-mono" />
            </div>
            <div>
              <label class="block text-xs font-medium text-ink-secondary mb-1">Reference / Confirmation #</label>
              <input id="pf-ref" type="text" value="${esc(existing?.refNumber || '')}" placeholder="e.g., CONF-10294" class="w-full px-3 py-2.5 rounded-xl bg-canvas border border-hairline text-sm font-mono" />

          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-ink-secondary mb-1">Organization / Context</label>

            </div>
            <div>
              <label class="block text-xs font-medium text-ink-secondary mb-1">Contact / Rep Name</label>

          </div>
          <div>
            <label class="block text-xs font-medium text-ink-secondary mb-1">Outcome Notes</label>

                ${ICONS.paperclip}
                <span>Attach File (max 1.5 MB)</span>

                <input id="pf-manual-att" type="text" placeholder="Or note receipt location..." class="flex-1 px-3 py-2 rounded-xl bg-paper border border-hairline text-xs" />
