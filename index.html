          ${field('Where this applies', `<input class="input" name="jurisdiction" value="${esc(I.jurisdiction ?? S.settings.region)}" data-input="intake-field" data-k="jurisdiction" placeholder="e.g. Oregon, US">`, 'Rules often depend on location. Used to remind you what to verify — nothing is looked up.')}
          ${field('Your own target date', `<input class="input" type="date" name="target" value="${esc(I.target || '')}" data-input="intake-field" data-k="target">`, 'Optional. A date you choose — not a deadline.')}
        </div>
      </details>

      <div class="between"><button type="button" class="btn btn-ghost" data-act="intake-cancel">Cancel</button><button type="submit" class="btn btn-primary">Create case</button></div>
    </form>`;
};

/* ===== Cases ===== */
function caseBuckets() {
  const b = { open: [], waiting: [], parked: [], closed: [], all: [] };
  S.cases.forEach(c => {
    b.all.push(c);
    if (isClosed(c)) return b.closed.push(c);
    const st = Engine.caseStatus(c.id).key;
    if (st === 'parked') return b.parked.push(c);
    b.open.push(c);
    if (st === 'waiting' || st === 'blocked') b.waiting.push(c);
  });
  return b;
}
function relationChips(caseId) {
  return S.links.filter(l => l.from === caseId || l.to === caseId).map(l => {
    const other = l.from === caseId ? l.to : l.from;
    const lbl = l.from === caseId ? LINK_TYPES[l.type].fwd : LINK_TYPES[l.type].back;
    return `<span class="pill line">${ico('link', 'sm')}${esc(lbl)}: ${esc(truncate(caseTitle(other), 28))}</span>`;
  }).join('');
}
Views.cases = () => {
  const b = caseBuckets();
  const f = UIState.casesFilter in b ? UIState.casesFilter : 'open';
  const q = norm(UIState.casesQuery);
  let list = b[f];
  if (q) list = list.filter(c => norm([c.title, c.summary, c.counterparty, c.reference, pb(c.type).label].join(' ')).includes(q));
  const pri = {}; Engine.prioritized().forEach(p => { pri[p.caseId] = p; });
  list = [...list].sort((a, c2) => {
    if (isClosed(a) !== isClosed(c2)) return isClosed(a) ? 1 : -1;
    if (isClosed(a)) return (c2.resolution.closedAt || '').localeCompare(a.resolution.closedAt || '');
    return ((pri[c2.id] || {}).score || 0) - ((pri[a.id] || {}).score || 0);
  });
  const tabs = [['open', 'Open'], ['waiting', 'Waiting'], ['parked', 'Parked'], ['closed', 'Closed'], ['all', 'All']];
  const rows = list.map(c => {
    const p = pri[c.id];
    const next = p && p.step ? p.step.text : (isClosed(c) ? (c.resolution.note || '') : '');
    const nd = S.deadlines.filter(d => d.caseId === c.id && d.status === 'open' && d.date && daysUntil(d.date) >= 0).sort((x, y) => x.date.localeCompare(y.date))[0];
    return `<div class="item"><div class="item-main">
      <a class="item-title serif stretch" style="text-decoration:none" href="${href('case', c.id)}">${esc(c.title)}</a>
      ${next ? `<p class="item-sub clamp2">${isClosed(c) ? '' : '<span class="muted">Next:</span> '}${esc(next)}</p>` : ''}
      <div class="item-meta"><span class="tag">${esc(pb(c.type).short)}</span>${statusPill(c.id)}${nd ? `<span class="pill ${daysUntil(nd.date) <= 3 && nd.kind === 'external' ? 'amber' : 'line'}">${esc(nd.label)} · ${esc(fmtDate(nd.date))}</span>` : ''}${relationChips(c.id)}${c.sample ? '<span class="pill line">Example</span>' : ''}</div>
      ${p && !isClosed(c) && p.reasons.length ? whyList(p.reasons.filter(r => r.hot), 1) : ''}
    </div></div>`;
  }).join('');
  return `<div class="page-head split"><div><p class="eyebrow">Everything you’re handling</p><h1 class="h1">Cases</h1><p class="lede">Sorted by what matters most — real deadlines, consequences that are hard to undo, and what unblocks other cases.</p></div><div class="actions"><a class="btn btn-ink" href="#/new">${ico('plus', 'sm')}New case</a></div></div>
    <div class="between" style="margin-bottom:14px"><div class="seg" role="group" aria-label="Filter cases">${tabs.map(([k, l]) => `<label><input type="radio" name="cf" value="${k}" data-change="cases-filter" ${f === k ? 'checked' : ''}><span>${l} <span class="muted mono xs">${b[k].length}</span></span></label>`).join('')}</div></div>
    <label class="sr-only" for="cases-search">Search cases</label>
    <input id="cases-search" class="input" type="search" placeholder="Search titles, organizations, references…" value="${esc(UIState.casesQuery)}" data-input="cases-search" data-fk="cases-search" autocomplete="off" style="margin-bottom:14px">
    ${list.length ? `<div class="list">${rows}</div>` : empty(q ? 'No matching cases' : f === 'open' ? 'No open cases' : 'Nothing here', q ? 'Try a different word, or clear the search.' : f === 'open' ? 'When something slips, start a case and it will appear here.' : 'Cases move here as their status changes.', f === 'open' && !q ? '<a class="btn btn-primary" href="#/new">Start a case</a>' : '')}`;
};

/* ===== Waiting ===== */
Views.waiting = () => {
  const all = S.waits.filter(w => { const c = getCase(w.caseId); return c && !isClosed(c); });
  const kinds = UIState.waitingKind;
  const open = all.filter(w => ['waiting', 'escalated'].includes(w.status) && (kinds === 'all' || w.kind === kinds)).map(w => ({ w, st: Engine.waitState(w) }));
  const groups = [
    ['Promises missed', 'They said a date and it has passed. This is a good moment to escalate — calmly and in writing.', open.filter(x => x.st.key === 'missed')],
    ['Ready for a follow-up', 'The follow-up window is open, or the expected date has passed.', open.filter(x => ['follow', 'overdue'].includes(x.st.key))],
    ['On track', 'Nothing to do yet.', open.filter(x => ['on_track', 'escalated'].includes(x.st.key))],
  ];
  const recent = S.waits.filter(w => w.status === 'received' && w.receivedAt && daysUntil(w.receivedAt) >= -30);
  const parallel = Engine.prioritized().filter(p => p.actionable && p.step && p.step.kind === 'task').slice(0, 3);
  const counts = {}; all.filter(w => ['waiting', 'escalated'].includes(w.status)).forEach(w => { counts[w.kind] = (counts[w.kind] || 0) + 1; });
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  return `<div class="page-head split"><div><p class="eyebrow">In someone else’s court</p><h1 class="h1">Waiting</h1><p class="lede">Replies, decisions, documents, actions and payments you’re owed — with the dates they promised and when it’s fair to follow up.</p></div><div class="actions"><button class="btn" data-act="wait-new">${ico('plus', 'sm')}Track something</button></div></div>
    <div class="seg" role="group" aria-label="Filter by kind" style="margin-bottom:18px"><label><input type="radio" name="wk" value="all" data-change="waiting-kind" ${kinds === 'all' ? 'checked' : ''}><span>All <span class="muted mono xs">${total}</span></span></label>${Object.entries(WAIT_KINDS).map(([k, v]) => `<label><input type="radio" name="wk" value="${k}" data-change="waiting-kind" ${kinds === k ? 'checked' : ''}><span>${v.label} <span class="muted mono xs">${counts[k] || 0}</span></span></label>`).join('')}</div>
    ${open.length ? groups.filter(g => g[2].length).map(([title, note, items]) => `<section class="section"><div class="section-head"><h2 class="h3">${title}</h2></div><p class="section-note">${note}</p><div class="list">${items.sort((a, b) => (a.w.expectedBy || a.w.followUpOn || '9').localeCompare(b.w.expectedBy || b.w.followUpOn || '9')).map(x => waitItem(x.w, x.st, true)).join('')}</div></section>`).join('')
      : empty('Nothing pending', 'When you’re waiting on a reply, refund or decision, track it here and you’ll be told when it’s fair to follow up.', '<button class="btn" data-act="wait-new">Track something</button>')}
    ${parallel.length && open.length ? `<section class="section"><div class="section-head"><h2 class="h3">While you wait</h2></div><p class="section-note">These don’t depend on anyone else.</p><div class="list">${parallel.map(p => `<div class="item"><button class="cb" role="checkbox" aria-checked="false" data-act="toggle-task" data-id="${esc(p.step.task.id)}" aria-label="Mark done: ${esc(p.step.task.text)}">${ICON.check}</button><div class="item-main"><p class="item-title">${esc(p.step.task.text)}</p><p class="item-sub">${caseLinkEl(p.caseId)}</p></div></div>`).join('')}</div></section>` : ''}
    ${recent.length ? `<details class="disclose"><summary>Received in the last 30 days (${recent.length})</summary><div class="list mt8">${recent.map(w => waitItem(w, Engine.waitState(w), true)).join('')}</div></details>` : ''}`;
};

function waitItem(w, st, showCase) {
  const last = w.log[w.log.length - 1];
  const basis = { promised: 'promised', policy: 'their stated timeframe', estimate: 'your estimate' }[w.basis];
  return `<div class="item"><div class="item-main">
    <div class="between" style="align-items:flex-start"><p class="item-title">${esc(w.what)}</p>${pill(st.label, st.tone)}</div>
    <p class="item-sub">${esc(WAIT_KINDS[w.kind].label)} from ${esc(w.from || 'them')}${showCase ? ` · ${caseLinkEl(w.caseId)}` : ''}</p>
    <div class="item-meta"><span>Since ${esc(fmtDate(w.since))}</span>${w.expectedBy ? `<span>Expected ${esc(fmtDate(w.expectedBy))} (${basis})</span>` : ''}${w.followUpOn && w.status !== 'received' ? `<span>Follow up ${esc(fmtDate(w.followUpOn))}</span>` : ''}${w.reference ? `<span class="mono">Ref ${esc(w.reference)}</span>` : ''}</div>
    ${last ? `<p class="xs muted mt4">Latest: ${esc(truncate(last.note, 140))}</p>` : ''}
    ${st.key === 'missed' || st.key === 'overdue' ? `<p class="xs mt8 ink2"><b>Escalation option:</b> ${esc(ESCALATE_HINTS[w.kind])}</p>` : ''}
    ${['waiting', 'escalated'].includes(w.status) ? `<div class="cluster mt12">
      <button class="btn btn-sm ${['missed', 'follow', 'overdue'].includes(st.key) ? 'btn-ink' : ''}" data-act="compose" data-case="${esc(w.caseId)}" data-purpose="${st.key === 'missed' ? 'escalate' : 'follow_up'}" data-wait="${esc(w.id)}">${st.key === 'missed' ? 'Draft an escalation' : 'Draft a follow-up'}</button>
      <button class="btn btn-sm btn-sage" data-act="wait-receive" data-id="${esc(w.id)}">Received</button>
      <button class="btn btn-sm btn-ghost" data-act="wait-log" data-id="${esc(w.id)}">Log an update</button>
      <button class="icon-btn" data-act="wait-edit" data-id="${esc(w.id)}" aria-label="Edit">${ICON.edit}</button>
    </div>` : w.outcome ? `<p class="xs ink2 mt4">Outcome: ${esc(w.outcome)}</p>` : ''}
  </div></div>`;
}

/* ===== Dates ===== */
Views.dates = () => {
  const items = Engine.agenda();
  const t = today();
  const attention = items.filter(i => i.date < t && !(i.kind === 'deadline' && i.passed && S.deadlines.some(d => d.id === i.id && d.status === 'missed')) && !['obligation', 'parked', 'target'].includes(i.kind));
  const todayItems = items.filter(i => i.date === t);
  const week = items.filter(i => { const n = daysUntil(i.date); return n >= 1 && n <= 7; });
  const later = items.filter(i => daysUntil(i.date) > 7);
  const passedKnown = items.filter(i => i.kind === 'deadline' && S.deadlines.some(d => d.id === i.id && d.status === 'missed'));
  const group = (title, note, arr) => arr.length ? `<section class="section"><div class="section-head"><h2 class="h3">${title}</h2></div>${note ? `<p class="section-note">${note}</p>` : ''}<div class="list plain">${arr.map(agendaRow).join('')}</div></section>` : '';
  return `<div class="page-head split"><div><p class="eyebrow">Ahead of you</p><h1 class="h1">Dates</h1><p class="lede">Deadlines, promised dates, follow-ups and your own targets in one place — each labelled with how sure it is.</p></div><div class="actions"><button class="btn" data-act="ics-upcoming">${ico('download', 'sm')}Add to calendar (.ics)</button></div></div>
    ${!items.length ? empty('No dates yet', 'Deadlines, follow-ups and promises from your cases will appear here.') : ''}
    ${group('Needs a decision', 'These dates have passed without being marked as met. Decide whether to act, set a new date, or mark it as no longer applying.', attention)}
    ${group('Today', '', todayItems)}${group('Next 7 days', '', week)}${group('Later', '', later)}
    ${passedKnown.length ? `<details class="disclose"><summary>Original dates that have already passed (${passedKnown.length})</summary><p class="section-note mt8">These are usually why the case exists. They’re kept for the record; the plan works from here.</p><div class="list plain">${passedKnown.map(agendaRow).join('')}</div></details>` : ''}`;
};

/* ===== Evidence ===== */
const ThumbCache = new Map();
function hydrateThumbs() {
  document.querySelectorAll('[data-thumb]').forEach(async el => {
    const id = el.dataset.thumb;
    try {
      let url = ThumbCache.get(id);
      if (!url) { const rec = await IDB.getBlob(id); if (!rec || !rec.blob) { el.title = 'File not found on this device'; return; } url = URL.createObjectURL(rec.blob); ThumbCache.set(id, url); }
      el.innerHTML = `<img class="thumb" src="${url}" alt="">`;
    } catch (e) { /* leave icon */ }
  });
}
function evidenceItem(e, showCase = true) {
  const isImg = e.file && /^image\//.test(e.file.mime);
  const links = e.links.length;
  return `<div class="item">
    <div class="item-lead" ${isImg ? `data-thumb="${esc(e.file.blobId)}"` : ''}><span class="thumb">${ico(e.file ? 'file' : 'clip')}</span></div>
    <div class="item-main"><p class="item-title">${esc(e.title)}</p>
      <div class="item-meta">${pill(EVIDENCE_TYPES[e.type])}${e.date ? `<span>${esc(fmtDate(e.date))}</span>` : ''}${e.reference ? `<button class="pill line mono" data-act="copy" data-text="${esc(e.reference)}" title="Copy reference">${esc(e.reference)} ${ICON.copy}</button>` : ''}${showCase ? (e.caseId ? `<span>${caseLinkEl(e.caseId)}</span>` : '<span class="muted">Not filed to a case</span>') : ''}${links ? `<span>${ico('link', 'sm')} supports ${plural(links, 'item')}</span>` : ''}</div>
      ${e.note ? `<p class="xs ink2 mt4 clamp2">${esc(e.note)}</p>` : ''}
      ${e.location ? `<p class="xs muted mt4">Kept at: ${esc(e.location)}</p>` : ''}
      ${e.file ? `<p class="xs muted mt4">${esc(e.file.name)} · ${esc(fmtBytes(e.file.size))}${e.file.sha256 ? ` · <span class="mono" title="SHA-256 fingerprint: lets you show the file hasn’t changed since you added it">fp ${esc(e.file.sha256.slice(0, 10))}</span>` : ''}</p>` : ''}
    </div>
    <div class="item-actions">${e.file ? `<button class="icon-btn" data-act="ev-open" data-id="${esc(e.id)}" aria-label="Open file">${ICON.download}</button>` : ''}<button class="icon-btn" data-act="ev-edit" data-id="${esc(e.id)}" aria-label="Edit">${ICON.edit}</button><button class="icon-btn danger" data-act="ev-delete" data-id="${esc(e.id)}" aria-label="Delete">${ICON.trash}</button></div>
  </div>`;
}
Views.evidence = () => {
  const q = norm(UIState.evidenceQuery); const tf = UIState.evidenceType;
  let list = S.evidence.filter(e => (tf === 'all' || e.type === tf) && (!q || norm([e.title, e.reference, e.note, e.location, e.file && e.file.name, e.caseId && caseTitle(e.caseId)].join(' ')).includes(q)));

/* ===== Focus session ===== */
Views.focus = route => {
  const F = UIState.focus;
  const min = Number(route.query.get('min')) || S.settings.focusMinutes || 15;
  if (!F || F.minutes !== min && F.idx === 0 && !F.done.length) {
    const q = Engine.focusQueue(min);
    UIState.focus = { minutes: min, queue: q.queue.map(x => x.task.id), idx: 0, done: [], skipped: [], startedAt: nowStamp() };
  }
  const f = UIState.focus;
  const ids = f.queue.filter(id => findRec('tasks', id));
  if (!ids.length) return `<div class="focus-wrap"><div class="page-head"><p class="eyebrow">Focus session</p><h1 class="h1">Nothing to do right now.</h1><p class="lede">Every open step is waiting on something or someone. That’s a fine place to be.</p></div><div class="cluster"><a class="btn" href="#/waiting">See what you’re waiting on</a><a class="btn btn-ghost" href="#/today">Back to Today</a></div></div>`;
  if (f.idx >= ids.length) {
    const next = Engine.prioritized().find(p => p.actionable && p.step && p.step.kind === 'task');
    return `<div class="focus-wrap"><div class="page-head"><p class="eyebrow">Session finished</p><h1 class="h1">${f.done.length ? `${plural(f.done.length, 'step')} done.` : 'That’s the session.'}</h1><p class="lede">${f.done.length ? 'Each of those is recorded in its case timeline.' : 'Nothing was marked done — and that’s okay. Looking at it is a step too.'}</p></div>
      ${f.done.length ? `<ul class="checklist">${f.done.map(id => { const t = findRec('tasks', id); return t ? `<li>${ico('check', 'sm')}<span class="grow">${esc(t.text)} <span class="muted xs">· ${esc(caseTitle(t.caseId))}</span></span></li>` : ''; }).join('')}</ul>` : ''}
      ${next ? `<p class="small ink2 mt16">Next time, start with: <b>${esc(next.step.text)}</b></p>` : ''}
      <div class="cluster mt24"><a class="btn btn-ink" href="#/today">Back to Today</a><button class="btn" data-act="focus-again">Another round</button></div></div>`;

  return `<div class="focus-wrap">
    <div class="between" style="margin-bottom:14px"><p class="eyebrow">Focus · ${f.idx + 1} of ${ids.length}</p><button class="btn btn-sm btn-ghost" data-act="focus-end">End session</button></div>

    <div class="focus-card mt16">
      <p class="small ink2">${caseLinkEl(c.id)}${t.effort ? ` · about ${t.effort} min` : ''}</p>
      <h1 class="focus-task">${esc(t.text)}</h1>

      ${p ? whyList(p.reasons, 2) : ''}
      <div class="cluster mt24"><button class="btn btn-sage" data-act="focus-done" data-id="${esc(t.id)}">${ico('check', 'sm')}Done</button><button class="btn" data-act="focus-skip">Skip for now</button><button class="btn btn-ghost" data-act="focus-blocked" data-id="${esc(t.id)}">Can’t do this yet</button></div>

async function hydrateDataPage() {
  const idbEl = document.getElementById('idb-status');
  const ok = await IDB.probe();
  if (idbEl) idbEl.textContent = ok ? 'Available' : 'Unavailable in this browser — files can’t be attached; snapshots last only until the tab closes.';
  const qEl = document.getElementById('quota-status');
  try {
    if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); if (qEl) qEl.textContent = `${fmtBytes(e.usage || 0)} used of about ${fmtBytes(e.quota || 0)}`; }
    else if (qEl) qEl.textContent = 'Not reported by this browser';
  } catch (e) { if (qEl) qEl.textContent = 'Not reported by this browser'; }
  const pr = document.getElementById('persist-row');
  try {
    if (pr && navigator.storage && navigator.storage.persisted) {
      const p = await navigator.storage.persisted();
      pr.innerHTML = p ? `${pill('Protected from automatic cleanup', 'sage')}` : `<button class="btn btn-sm" data-act="persist">Ask the browser to keep this data</button><span class="xs muted">Reduces the chance of the browser clearing it when space runs low.</span>`;
    }
  } catch (e) { /* ignore */ }
  const host = document.getElementById('snapshots');
  if (!host) return;
  const snaps = await Snapshots.list();
  host.innerHTML = snaps.length ? snaps.map(s => `<div class="item"><div class="item-main"><p class="item-title">${esc(s.reason)}</p><p class="item-meta"><span>${esc(fmtStamp(s.at))}</span><span>${esc(fmtBytes(s.size * 2))}</span></p></div><div class="item-actions"><button class="btn btn-sm" data-act="snapshot-restore" data-id="${esc(s.id)}">Restore</button><button class="icon-btn" data-act="snapshot-download" data-id="${esc(s.id)}" aria-label="Download">${ICON.download}</button><button class="icon-btn danger" data-act="snapshot-delete" data-id="${esc(s.id)}" aria-label="Delete">${ICON.trash}</button></div></div>`).join('') : '<div class="item"><p class="small muted">No snapshots yet.</p></div>';
}

/* ---------------- Case workspace ---------------- */
const CASE_TABS = [
  ['overview', 'Overview'], ['understand', 'Understand'], ['options', 'Options'], ['plan', 'Plan'], ['contact', 'Contact'],
  ['waiting', 'Waiting'], ['evidence', 'Evidence'], ['timeline', 'Timeline'], ['resolve', 'Resolve'],
];

Views.case = route => {
  const c = getCase(route.parts[1]);
  if (!c) return `<a class="back" href="#/cases">${ico('back', 'sm')}Cases</a><div class="page-head"><h1 class="h1">Case not found</h1><p class="lede">It may have been deleted. Deleted cases can be restored from the trash in <a class="linkish" href="#/data">Data & privacy</a>.</p></div>`;
  const tab = CASE_TABS.some(t => t[0] === route.parts[2]) ? route.parts[2] : 'overview';
  const counts = {
    understand: S.facts.filter(f => f.caseId === c.id && f.kind === 'missing').length,
    plan: Engine.openTasks(c.id).length,
    contact: S.comms.filter(m => m.caseId === c.id).length,
    waiting: Engine.openWaits(c.id).length,
    evidence: S.evidence.filter(e => e.caseId === c.id).length,
  };
  const crit = S.criteria.filter(x => x.caseId === c.id && x.status !== 'na');
  const parked = c.parkedUntil && daysUntil(c.parkedUntil) > 0;
  const res = RES_STATES[c.resolution.state];
  const body = (CaseTabs[tab] || CaseTabs.overview)(c);
  return `<a class="back" href="#/cases">${ico('back', 'sm')}Cases</a>
  <header class="case-head">
    <p class="eyebrow">${esc(pb(c.type).label)}${c.sample ? ' · Example' : ''}</p>
    <h1 class="h1">${esc(c.title)}</h1>
    <div class="meta">${statusPill(c.id)}${c.resolution.state !== 'open' && !res.closed && !parked ? '' : ''}${c.counterparty ? `<span class="small ink2">${esc(c.counterparty)}</span>` : ''}${c.reference ? `<button class="pill line mono" data-act="copy" data-text="${esc(c.reference)}" title="Copy">${esc(c.reference)} ${ICON.copy}</button>` : ''}${c.jurisdiction ? `<span class="pill line">${esc(c.jurisdiction)}</span>` : ''}<span class="xs muted">Opened ${esc(fmtDate(c.createdAt))}</span></div>
    <div class="cluster mt12">
      <button class="btn btn-sm" data-act="case-edit" data-id="${esc(c.id)}">${ico('edit', 'sm')}Details</button>
      ${!res.closed ? (parked ? `<button class="btn btn-sm" data-act="case-unpark" data-id="${esc(c.id)}">Unpark</button>` : `<button class="btn btn-sm" data-act="case-park" data-id="${esc(c.id)}">${ico('pause', 'sm')}Park</button>`) : ''}
      <button class="btn btn-sm" data-act="note-add" data-case="${esc(c.id)}">Add note</button>
      <button class="btn btn-sm btn-ghost" data-act="case-ics" data-id="${esc(c.id)}">${ico('dates', 'sm')}Dates to calendar</button>

  <nav class="tabs" aria-label="Case sections">${CASE_TABS.map(([k, l]) => {

const CaseTabs = {};

function nextStepCard(c) {
  const p = Engine.priority(c.id);
  const st = p ? p.step : Engine.nextStep(c.id);
  if (!st) return '';
  if (st.kind === 'closed') {
    return `<section class="card"><p class="eyebrow">Status</p><p class="h3 mt4">${esc(RES_STATES[c.resolution.state].label)}${c.resolution.closedAt ? ` · ${esc(fmtDate(c.resolution.closedAt))}` : ''}</p>${c.resolution.note ? `<p class="small ink2 mt8">${esc(c.resolution.note)}</p>` : ''}<div class="cluster mt12"><a class="btn btn-sm" href="${href('case', c.id, 'resolve')}">See how it was resolved</a></div></section>`;
  }
  const btn = {
    followup: st.wait ? `<button class="btn btn-ink" data-act="compose" data-case="${esc(c.id)}" data-purpose="${st.purpose}" data-wait="${esc(st.wait.id)}">${st.purpose === 'escalate' ? 'Draft an escalation' : 'Draft a follow-up'}</button><button class="btn btn-sage" data-act="wait-receive" data-id="${esc(st.wait.id)}">It arrived</button>` : '',
    task: `<button class="btn btn-sage" data-act="toggle-task" data-id="${esc(st.task && st.task.id)}">${ico('check', 'sm')}Mark done</button><a class="btn" href="${href('case', c.id, 'plan')}">Whole plan</a>`,
    choose: `<a class="btn btn-ink" href="${href('case', c.id, 'options')}">Compare options</a>`,
    blocked: `<a class="btn" href="${href('case', c.id, 'plan')}">See the plan</a>`,
    wait: `<a class="btn" href="${href('case', c.id, 'waiting')}">See what you’re waiting for</a>`,
    resolve: `<a class="btn btn-ink" href="${href('case', c.id, 'resolve')}">Check resolution</a>`,
    monitor: `<a class="btn btn-ink" href="${href('case', c.id, 'resolve')}">Do the check</a>`,
    watch: `<a class="btn" href="${href('case', c.id, 'resolve')}">See resolution</a>`,
  }[st.kind] || '';
  const label = { followup: 'Their turn is overdue', task: 'Next step', choose: 'First, decide how to approach it', blocked: 'On hold', wait: 'Waiting', resolve: 'Almost there', monitor: 'Check-in due', watch: 'Watching' }[st.kind] || 'Next';
  return `<section class="focal"><p class="eyebrow">${label}</p><p class="focus-task" style="font-size:clamp(21px,3.6vw,26px)">${esc(st.text)}</p>

    ${p ? whyList(p.reasons, 3) : ''}<div class="cluster mt16">${btn}</div></section>`;
}

CaseTabs.overview = c => {
  const facts = byCase('facts', c.id);
  const fc = k => facts.filter(f => f.kind === k).length;
  const missing = facts.filter(f => f.kind === 'missing');
  const dls = byCase('deadlines', c.id).filter(d => d.date);
  const ext = dls.filter(d => d.kind === 'external' && d.status === 'open' && daysUntil(d.date) >= 0).sort((a, b) => a.date.localeCompare(b.date))[0];
  const passed = dls.filter(d => d.kind === 'external' && (d.status === 'missed' || (d.status === 'open' && daysUntil(d.date) < 0)));
  const target = dls.filter(d => d.kind === 'self' && d.status === 'open').sort((a, b) => a.date.localeCompare(b.date))[0];
  const cons = byCase('consequences', c.id);
  const est = cons.filter(x => x.status === 'established');
  const pot = cons.filter(x => x.status === 'potential').sort((a, b) => b.severity - a.severity);
  const waits = Engine.openWaits(c.id);
  const chosen = S.paths.find(p => p.caseId === c.id && p.status === 'chosen');
  const P = pb(c.type);
  const unanswered = P.questions.filter(q => !c.answers[q.id] || c.answers[q.id] === 'unsure');
  const allDone = !Engine.openTasks(c.id).length && S.tasks.some(t => t.caseId === c.id) && !isClosed(c) && ['open', 'partial'].includes(c.resolution.state) && Engine.nextStep(c.id).kind === 'resolve';
  const links = S.links.filter(l => l.from === c.id || l.to === c.id);
  const lines = [];
  lines.push(`<p><b>${fc('confirmed')}</b> confirmed · <b>${fc('unverified') + fc('assumption')}</b> not yet checked · <b>${missing.length}</b> missing. <a class="linkish" href="${href('case', c.id, 'understand')}">Review</a></p>`);
  if (missing.length) lines.push(`<p class="small ink2">Still needed: ${missing.slice(0, 2).map(f => `<b>${esc(f.text.charAt(0).toLowerCase() + f.text.slice(1))}</b>`).join('; ')}${missing.length > 2 ? ` and ${missing.length - 2} more` : ''}.</p>`);
  if (ext) lines.push(`<p>Next deadline: <b>${esc(ext.label)}</b> — ${esc(dateAndRel(ext.date))} ${certaintyPill(ext.certainty)}</p>`);
  if (passed.length) lines.push(`<p class="small ink2">${esc(passed[0].label)} passed on ${esc(fmtDate(passed[0].date))}${passed[0].certainty !== 'confirmed' ? ' (not confirmed)' : ''}. That’s the starting point, not a verdict.</p>`);
  if (target) lines.push(`<p class="small ink2">Your own target: ${esc(dateAndRel(target.date))}.</p>`);
  if (est.length) lines.push(`<p>Already happened: ${est.map(x => `<b>${esc(x.text.charAt(0).toLowerCase() + x.text.slice(1))}</b>${x.reversibility === 'reversible' ? ' <span class="muted">(can be reversed)</span>' : ''}`).join('; ')}.</p>`);
  if (pot.length) lines.push(`<p>Could still happen: ${pot.slice(0, 2).map(x => `${esc(x.text.charAt(0).toLowerCase() + x.text.slice(1))} <span class="muted">(${esc(REVERSIBILITY[x.reversibility].toLowerCase())})</span>`).join('; ')}${pot.length > 2 ? `, and ${pot.length - 2} more` : ''}.</p>`);
  if (waits.length) lines.push(`<p>Waiting on: ${waits.map(w => `${esc(w.what)} <span class="muted">(${esc(Engine.waitState(w).label.toLowerCase())})</span>`).join('; ')}.</p>`);
  lines.push(chosen ? `<p>Approach: <b>${esc(chosen.title)}</b>. <a class="linkish" href="${href('case', c.id, 'options')}">Other options</a></p>` : `<p>No approach chosen yet. <a class="linkish" href="${href('case', c.id, 'options')}">Compare options</a></p>`);
  return `<div class="stack stack-lg">
    ${allDone ? `<div class="banner ok"><div class="grow"><p><b>Every step is done.</b> That isn’t always the same as the problem being solved. Check it against what “resolved” means for this case.</p><div class="cluster"><a class="btn btn-sm btn-sage" href="${href('case', c.id, 'resolve')}">Check resolution</a></div></div></div>` : ''}
    ${nextStepCard(c)}
    <section><div class="section-head"><h2 class="h2">Where you stand</h2></div><div class="statline where">${lines.join('')}</div></section>
    ${unanswered.length && !isClosed(c) ? `<section class="section"><div class="section-head"><h2 class="h3">Questions that would sharpen the plan</h2></div><p class="section-note">Answer only if you know — each one can change which option fits best.</p>
      <div class="stack">${unanswered.slice(0, 3).map(q => questionBlock(c, q)).join('')}</div></section>` : ''}
    <section class="section"><div class="section-head"><h2 class="h3">Connected cases</h2><button class="btn btn-sm" data-act="link-add" data-case="${esc(c.id)}">${ico('link', 'sm')}Link a case</button></div>
      ${links.length ? `<div class="list">${links.map(l => { const other = l.from === c.id ? l.to : l.from; const lbl = l.from === c.id ? LINK_TYPES[l.type].fwd : LINK_TYPES[l.type].back; return `<div class="item"><div class="item-main"><p class="xs muted">${esc(lbl)}</p>${caseLinkEl(other, 'item-title linkish plain')}${l.note ? `<p class="xs ink2 mt4">${esc(l.note)}</p>` : ''}</div><div class="item-actions">${statusPill(other)}<button class="icon-btn danger" data-act="link-delete" data-id="${esc(l.id)}" aria-label="Remove link">${ICON.close}</button></div></div>`; }).join('')}</div>` : '<p class="small muted">One problem often affects another — a ticket caused by an expired registration, a refund that blocks a payment. Link them so priorities account for it.</p>'}
    </section>
    <section class="section"><div class="section-head"><h2 class="h3">In your words</h2></div><blockquote class="serif italic ink2" style="margin:0;font-size:16.5px">“${esc(c.summary || c.title)}”</blockquote></section>
  </div>`;
};

function questionBlock(c, q) {
  const inferred = c.answerSource[q.id] === 'inferred';
  return `<fieldset class="card flat"><legend class="strong" style="font-size:14.5px;padding:0">${esc(q.q)}</legend><p class="xs muted mt4">${esc(q.why)}${inferred ? ' <span class="pill amber">Inferred from your words</span>' : ''}</p>
    <div class="seg mt8">${q.opts.map(([v, l]) => `<label><input type="radio" name="cq_${esc(q.id)}" value="${esc(v)}" data-change="case-answer" data-case="${esc(c.id)}" data-q="${esc(q.id)}" data-fk="cq-${esc(q.id)}-${esc(v)}" ${c.answers[q.id] === v ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div></fieldset>`;
}

CaseTabs.understand = c => {
  const facts = byCase('facts', c.id);
  const group = (kind, list) => `<div class="mt16"><div class="row-flex" style="align-items:center"><i class="kind-dot k-${kind}" style="margin-top:0"></i><p class="strong small">${FACT_KINDS[kind].label} <span class="muted">(${list.length})</span></p></div><p class="xs muted mt4">${FACT_KINDS[kind].desc}</p>
    ${list.length ? `<div class="list mt8">${list.map(f => `<div class="item"><div class="item-main"><p class="small" style="font-weight:500">${esc(f.text)}</p>
      ${f.why ? `<p class="xs muted mt4">Why it matters: ${esc(f.why)}</p>` : ''}${f.source ? `<p class="xs muted mt4">Source: ${esc(f.source)}</p>` : ''}
      ${f.evidenceIds.length || evidenceFor('facts', f.id).length ? `<p class="xs mt4">${ico('clip', 'sm')} ${plural(new Set([...f.evidenceIds, ...evidenceFor('facts', f.id).map(e => e.id)]).size, 'piece')} of evidence</p>` : ''}</div>
      <div class="item-actions">${kind === 'missing' ? `<button class="btn btn-sm" data-act="fact-fill" data-id="${esc(f.id)}">Fill in</button>` : kind !== 'confirmed' ? `<button class="btn btn-sm" data-act="fact-confirm" data-id="${esc(f.id)}">Confirm</button>` : ''}<button class="icon-btn" data-act="fact-edit" data-id="${esc(f.id)}" aria-label="Edit">${ICON.edit}</button><button class="icon-btn danger" data-act="fact-delete" data-id="${esc(f.id)}" aria-label="Delete">${ICON.trash}</button></div></div>`).join('')}</div>` : ''}</div>`;
  const cons = byCase('consequences', c.id).sort((a, b) => ({ established: 0, potential: 1, avoided: 2 }[a.status] - { established: 0, potential: 1, avoided: 2 }[b.status]) || b.severity - a.severity);
  const dls = byCase('deadlines', c.id).sort((a, b) => (a.date || '9').localeCompare(b.date || '9'));
  const P = pb(c.type);
  return `<div class="stack stack-lg">
    <section><div class="section-head"><h2 class="h2">What you know</h2><button class="btn btn-sm" data-act="fact-add" data-case="${esc(c.id)}">${ico('plus', 'sm')}Add</button></div>
      <p class="section-note">Kept in four separate piles so nothing you assume gets treated as settled. Drafts and plans only rely on what’s confirmed.</p>
      ${group('confirmed', facts.filter(f => f.kind === 'confirmed'))}${group('unverified', facts.filter(f => f.kind === 'unverified'))}${group('assumption', facts.filter(f => f.kind === 'assumption'))}${group('missing', facts.filter(f => f.kind === 'missing'))}
    </section>
    <section class="section"><div class="section-head"><h2 class="h2">Consequences</h2><button class="btn btn-sm" data-act="cons-add" data-case="${esc(c.id)}">${ico('plus', 'sm')}Add</button></div>
      <p class="section-note">What has happened, what could still happen, and how hard each would be to undo. Items marked “general guidance” come from the playbook, not your provider.</p>
      ${cons.length ? `<div class="list">${cons.map(x => `<div class="item"><div class="item-main"><p class="small" style="font-weight:500">${esc(x.text)}</p>
        <div class="item-meta">${pill(REVERSIBILITY[x.reversibility], x.reversibility === 'irreversible' ? 'coral' : x.reversibility === 'hard' ? 'amber' : x.reversibility === 'reversible' ? 'sage' : '')}${x.severity >= 3 ? pill('Serious', 'coral') : ''}${x.general ? '<span class="tag">General guidance</span>' : ''}</div>${x.note ? `<p class="xs muted mt4">${esc(x.note)}</p>` : ''}</div>
        <div class="item-actions"><label class="sr-only" for="cs-${esc(x.id)}">Status</label><select id="cs-${esc(x.id)}" class="select" style="min-height:36px;padding:4px 30px 4px 10px;font-size:13px;width:auto" data-change="cons-status" data-id="${esc(x.id)}">${Object.entries(CONS_STATUS).map(([k, l]) => `<option value="${k}" ${x.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select><button class="icon-btn" data-act="cons-edit" data-id="${esc(x.id)}" aria-label="Edit">${ICON.edit}</button><button class="icon-btn danger" data-act="cons-delete" data-id="${esc(x.id)}" aria-label="Delete">${ICON.trash}</button></div></div>`).join('')}</div>` : '<p class="small muted">None recorded.</p>'}
    </section>
    <section class="section"><div class="section-head"><h2 class="h2">Dates & deadlines</h2><button class="btn btn-sm" data-act="dl-add" data-case="${esc(c.id)}">${ico('plus', 'sm')}Add</button></div>
      <p class="section-note">Their deadlines are kept apart from your own targets, and each is marked by how sure it is.</p>
      ${dls.length ? `<div class="list">${dls.map(d => `<div class="item"><div class="item-main"><p class="small" style="font-weight:500">${esc(d.label)}</p>
        <div class="item-meta"><span class="mono">${esc(d.date ? fmtDate(d.date, { year: true }) : 'No date')}</span>${d.date ? `<span>${esc(relDay(d.date))}</span>` : ''}${pill(d.kind === 'self' ? 'Your target' : 'Their deadline', d.kind === 'self' ? '' : 'blue')}${certaintyPill(d.certainty)}${d.status !== 'open' ? pill(DL_STATUS[d.status], d.status === 'met' ? 'sage' : '') : ''}</div>${d.source ? `<p class="xs muted mt4">Source: ${esc(d.source)}</p>` : ''}</div>
        <div class="item-actions">${d.status === 'open' ? `<button class="btn btn-sm" data-act="dl-met" data-id="${esc(d.id)}">Met</button>` : ''}<button class="icon-btn" data-act="dl-edit" data-id="${esc(d.id)}" aria-label="Edit">${ICON.edit}</button><button class="icon-btn danger" data-act="dl-delete" data-id="${esc(d.id)}" aria-label="Delete">${ICON.trash}</button></div></div>`).join('')}</div>` : '<p class="small muted">No dates recorded.</p>'}
    </section>
    <section class="section"><div class="section-head"><h2 class="h2">Context</h2></div><p class="section-note">Your answers shape which options rank highest. Change them any time.</p><div class="stack">${P.questions.map(q => questionBlock(c, q)).join('')}</div></section>
    <section class="section"><div class="section-head"><h2 class="h2">What to verify</h2></div>
      <p class="section-note">Rules and policies vary by provider and location. This app can’t look them up; these are the authoritative places to check. Record what you find as a confirmed fact with its source.</p>
      <form class="input-row" data-form="case-jurisdiction" data-case="${esc(c.id)}" style="margin-bottom:12px"><label class="sr-only" for="jur">Where this applies</label><input id="jur" class="input" name="jurisdiction" value="${esc(c.jurisdiction)}" placeholder="Where this applies, e.g. Texas, US"><button class="btn" type="submit">Save</button></form>
      <ul class="checklist">${P.verify.map(v => `<li><span class="grow small">${esc(v)}${c.jurisdiction ? ` <span class="muted">— for ${esc(c.jurisdiction)}</span>` : ''}</span><button class="btn btn-xs" data-act="fact-add" data-case="${esc(c.id)}" data-kind="confirmed" data-source="${esc(v.split(':')[0])}">Record what I found</button></li>`).join('')}</ul>
    </section>
  </div>`;
};

function evidenceFor(t, id) { return S.evidence.filter(e => e.links.some(l => l.t === t && l.id === id)); }

CaseTabs.options = c => {
  const ranked = Engine.rankPaths(c.id);
  const P = pb(c.type);
  return `<section><div class="section-head"><h2 class="h2">Ways forward</h2><button class="btn btn-sm" data-act="path-add" data-case="${esc(c.id)}">${ico('plus', 'sm')}Your own approach</button></div>
    <p class="section-note">Every legitimate route, with why it might work, what it costs, and what’s uncertain. Ranked by your answers and the case so far — the most obvious route isn’t always best. No outcome is guaranteed.</p>
    ${ranked.map(({ path: p, score, reasons, best }) => {
      const def = P.paths.find(x => x.key === p.key);
      const dim = ['ruled_out', 'didnt_work'].includes(p.status);
      return `<article class="path ${p.status === 'chosen' ? 'chosen' : ''} ${dim ? 'dim' : ''}">
        <div class="between" style="align-items:flex-start"><div class="grow"><p class="tag">${esc(APPROACHES[p.approach])}${p.custom ? ' · yours' : ''}</p><h3 class="h3 mt4">${esc(p.title)}</h3></div>
          <div class="cluster">${best ? pill('Best fit so far', 'sage') : ''}${p.status !== 'considering' ? pill(p.status === 'chosen' ? 'Current approach' : PATH_STATUS[p.status], p.status === 'worked' ? 'sage' : p.status === 'chosen' ? 'ink' : '') : ''}</div></div>
        ${p.why ? `<p class="small ink2 mt8">${esc(p.why)}</p>` : ''}
        ${reasons.length ? `<div class="why">${reasons.map(r => `<span class="why-item ${r.delta < 0 ? 'neg' : ''}">${r.delta > 0 ? '+' : '−'} ${esc(r.text)}</span>`).join('')}</div>` : ''}
        <details class="disclose"><summary>Downsides, prerequisites and uncertainties</summary><div class="path-grid">
          <div><h4>Downsides</h4><p>${esc(p.downsides || '—')}</p></div>
          <div><h4>Likely outcome</h4><p>${esc(p.outcome || '—')}</p></div>
          <div><h4>You’ll need</h4>${p.prerequisites.length ? `<ul>${p.prerequisites.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p>Nothing special</p>'}</div>
          <div><h4>Uncertain</h4>${p.uncertainties.length ? `<ul>${p.uncertainties.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p>—</p>'}</div>
        </div></details>
        ${p.note ? `<p class="xs ink2 mt8"><b>Note:</b> ${esc(p.note)}</p>` : ''}
        <div class="cluster mt12">
          ${p.status === 'considering' ? `<button class="btn btn-sm btn-ink" data-act="path-choose" data-id="${esc(p.id)}">Choose this approach</button>` : ''}
          ${['considering', 'chosen'].includes(p.status) && (def && def.comm || p.custom) ? `<button class="btn btn-sm" data-act="compose" data-case="${esc(c.id)}" data-path="${esc(p.id)}">Draft a message</button>` : ''}
          ${p.status === 'chosen' ? `<button class="btn btn-sm btn-ghost" data-act="path-outcome" data-id="${esc(p.id)}" data-status="worked">It worked</button><button class="btn btn-sm btn-ghost" data-act="path-outcome" data-id="${esc(p.id)}" data-status="didnt_work">It didn’t work</button>` : ''}
          ${p.status === 'considering' ? `<button class="btn btn-sm btn-ghost" data-act="path-outcome" data-id="${esc(p.id)}" data-status="ruled_out">Rule out</button>` : ''}
          ${dim ? `<button class="btn btn-sm btn-ghost" data-act="path-reconsider" data-id="${esc(p.id)}">Reconsider</button>` : ''}
          ${p.custom ? `<button class="icon-btn danger" data-act="path-delete" data-id="${esc(p.id)}" aria-label="Delete approach">${ICON.trash}</button>` : ''}
        </div></article>`;
    }).join('') || empty('No options listed', 'Add your own approach.')}</section>`;
};

function taskRow(t) {
  const blockers = t.done ? [] : Engine.taskBlockers(t);
  const path = t.pathId ? findRec('paths', t.pathId) : null;
  return `<div class="item"><button class="cb item-lead" role="checkbox" aria-checked="${t.done}" data-act="toggle-task" data-id="${esc(t.id)}" aria-label="${t.done ? 'Mark not done' : 'Mark done'}: ${esc(t.text)}">${ICON.check}</button>
    <div class="item-main"><p class="small ${t.done ? 'done-text' : ''}" style="font-weight:500">${esc(t.text)}</p>
      <div class="item-meta">${t.effort ? `<span>~${t.effort} min</span>` : ''}${path ? `<span class="tag">${esc(truncate(path.title, 36))}</span>` : ''}${blockers.map(b => pill(b.text, 'blue')).join('')}${t.done && t.doneAt ? `<span>Done ${esc(fmtDate(stampDate(t.doneAt)))}</span>` : ''}</div>${t.note ? `<p class="xs muted mt4">${esc(t.note)}</p>` : ''}</div>
    ${t.done ? '' : `<div class="item-actions"><button class="icon-btn" data-act="task-move" data-id="${esc(t.id)}" data-dir="-1" aria-label="Move up">${ICON.up}</button><button class="icon-btn" data-act="task-move" data-id="${esc(t.id)}" data-dir="1" aria-label="Move down">${ICON.down}</button><button class="icon-btn" data-act="task-edit" data-id="${esc(t.id)}" aria-label="Edit step">${ICON.edit}</button><button class="icon-btn danger" data-act="task-delete" data-id="${esc(t.id)}" aria-label="Delete step">${ICON.trash}</button></div>`}</div>`;
}

CaseTabs.plan = c => {
  const open = Engine.openTasks(c.id);
  const done = S.tasks.filter(t => t.caseId === c.id && t.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
  const docs = byCase('docs', c.id);
  const chosen = S.paths.find(p => p.caseId === c.id && p.status === 'chosen');
  return `<div class="stack stack-lg"><section><div class="section-head"><h2 class="h2">Steps</h2></div>
    <p class="section-note">${chosen ? `Following: <b>${esc(chosen.title)}</b>. ` : ''}Steps can depend on other steps, on something you’re waiting for, or on another case being resolved — blocked steps say why.</p>
    ${open.length ? `<div class="list">${open.map(taskRow).join('')}</div>` : `<p class="small muted">${done.length ? 'No open steps.' : `No steps yet. <a class="linkish" href="${href('case', c.id, 'options')}">Choose an approach</a> to get a starting plan, or add your own below.`}</p>`}
    <form class="input-row mt12" data-form="task-add" data-case="${esc(c.id)}"><label class="sr-only" for="new-task">New step</label><input id="new-task" class="input" name="text" placeholder="Add a step…" data-fk="new-task" autocomplete="off"><select class="select" name="effort" style="width:auto" aria-label="Rough effort"><option value="0">Effort?</option><option value="5">5 min</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">1 hour</option></select><button class="btn" type="submit">Add</button></form>
    ${done.length ? `<details class="disclose"><summary>Done (${done.length})</summary><div class="list mt8">${done.map(taskRow).join('')}</div></details>` : ''}
  </section>
  <section class="section"><div class="section-head"><h2 class="h2">To gather</h2></div><p class="section-note">Documents and details you’ll need. Link the actual item as evidence when you have it.</p>
    ${docs.length ? `<div class="list">${docs.map(d => `<div class="item"><button class="item-lead pill ${d.status === 'needed' ? 'amber' : d.status === 'have' ? 'sage' : ''}" style="border:0" data-act="doc-cycle" data-id="${esc(d.id)}" title="Change status">${esc(DOC_STATUS[d.status])}</button><div class="item-main"><p class="small" style="font-weight:500">${esc(d.name)}</p>${d.note ? `<p class="xs muted mt4">${esc(d.note)}</p>` : ''}${d.evidenceId && findRec('evidence', d.evidenceId) ? `<p class="xs mt4">${ico('clip', 'sm')} ${esc(findRec('evidence', d.evidenceId).title)}</p>` : ''}</div><div class="item-actions"><button class="icon-btn" data-act="doc-edit" data-id="${esc(d.id)}" aria-label="Edit">${ICON.edit}</button><button class="icon-btn danger" data-act="doc-delete" data-id="${esc(d.id)}" aria-label="Delete">${ICON.trash}</button></div></div>`).join('')}</div>` : ''}
    <form class="input-row mt12" data-form="doc-add" data-case="${esc(c.id)}"><label class="sr-only" for="new-doc">New item to gather</label><input id="new-doc" class="input" name="name" placeholder="Add something to gather…" data-fk="new-doc" autocomplete="off"><button class="btn" type="submit">Add</button></form>
  </section></div>`;
};

CaseTabs.contact = c => {
  const comms = byCase('comms', c.id).sort((a, b) => (b.date || b.createdAt.slice(0, 10)).localeCompare(a.date || a.createdAt.slice(0, 10)));
  const commits = byCase('commitments', c.id);
  const cmRow = m => {
    const overdue = m.status === 'pending' && m.due && daysUntil(m.due) < 0;
    return `<div class="item"><div class="item-main"><p class="small" style="font-weight:500">${esc(m.text)}</p><div class="item-meta">${m.due ? `<span>By ${esc(fmtDate(m.due))}</span>` : '<span>No date given</span>'}${pill(overdue ? (m.party === 'them' ? 'Missed' : 'Overdue') : COMMIT_STATUS[m.status], overdue ? 'coral' : m.status === 'kept' ? 'sage' : '')}${evidenceFor('commitments', m.id).length ? `<span>${ico('clip', 'sm')} in writing</span>` : ''}</div></div>
      <div class="item-actions">${m.status === 'pending' ? `<button class="btn btn-xs" data-act="cmt-status" data-id="${esc(m.id)}" data-status="kept">Kept</button><button class="btn btn-xs btn-ghost" data-act="cmt-status" data-id="${esc(m.id)}" data-status="missed">${m.party === 'them' ? 'Missed' : 'Not done'}</button><button class="btn btn-xs btn-ghost" data-act="cmt-status" data-id="${esc(m.id)}" data-status="released">Drop</button>` : `<button class="btn btn-xs btn-ghost" data-act="cmt-status" data-id="${esc(m.id)}" data-status="pending">Reopen</button>`}<button class="icon-btn danger" data-act="cmt-delete" data-id="${esc(m.id)}" aria-label="Delete">${ICON.trash}</button></div></div>`;
  };
  return `<div class="stack stack-lg"><section>
    <div class="section-head"><h2 class="h2">Communications</h2></div>
    <p class="section-note">Prepare calls, emails and letters in the right tone, record what was said, and keep track of who promised what. You send everything yourself.</p>
    <div class="cluster" style="margin-bottom:14px"><button class="btn btn-ink" data-act="compose" data-case="${esc(c.id)}">${ico('mail', 'sm')}Prepare a message or call</button><button class="btn" data-act="incoming" data-case="${esc(c.id)}">Log a reply or contact</button></div>

function undoToast(msg, trashId) {
  UI.toast(msg, '', trashId ? { label: 'Undo', fn: () => { commit(() => restoreTrash(trashId)); UI.toast('Restored.', 'ok'); } } : null);
}
/* Keep both sides of an evidence link in step (record.evidenceIds and evidence.links). */
function syncEvidenceLinks(coll, rec, evIds) {
  rec.evidenceIds = [...new Set(evIds)];
  S.evidence.filter(e => e.caseId === rec.caseId).forEach(e => {
    const has = e.links.some(l => l.t === coll && l.id === rec.id);
    if (rec.evidenceIds.includes(e.id) && !has) e.links.push({ t: coll, id: rec.id });
    if (!rec.evidenceIds.includes(e.id) && has) e.links = e.links.filter(l => !(l.t === coll && l.id === rec.id));
  });
}
function evidenceChecklist(caseId, selected = [], name = 'evidence') {
  const evs = byCase('evidence', caseId);
  if (!evs.length) return '<p class="xs muted">No evidence in this case yet.</p>';
  return `<div class="list plain">${evs.map(e => `<label class="check" style="padding:6px 0"><input type="checkbox" name="${name}" value="${esc(e.id)}" ${selected.includes(e.id) ? 'checked' : ''}><span class="small">${esc(e.title)}${e.reference ? ` <span class="mono muted">${esc(e.reference)}</span>` : ''}</span></label>`).join('')}</div>`;
}

    foot: '<button type="button" class="btn" data-dlg-close>Cancel</button><button class="btn btn-ink" type="submit">Link</button>',
    onSubmit: fd => commit(() => { const to = val(fd, 'to'); const type = val(fd, 'type'); S.links.push(Normalize.links({ from: c.id, to, type, note: val(fd, 'note') })); logEvent(c.id, 'note', `Linked: ${LINK_TYPES[type].fwd.toLowerCase()} “${caseTitle(to)}”`); logEvent(to, 'note', `Linked: ${LINK_TYPES[type].back.toLowerCase()} “${c.title}”`); }, { caseId: c.id }),
  });
};
Actions['link-delete'] = el => { const l = findRec('links', el.dataset.id); commit(() => { S.links = S.links.filter(x => x.id !== l.id); logEvent(l.from, 'note', `Unlinked from “${caseTitle(l.to)}”`); }); };

/* ===== Facts ===== */
function openFact(caseId, { id = '', kind = '', source = '', mode = 'add' } = {}) {
  const f = id ? findRec('facts', id) : null;
  const k = mode === 'confirm' || mode === 'fill' ? 'confirmed' : (f ? f.kind : (kind || 'unverified'));
  const title = { add: 'Add to what you know', edit: 'Edit', confirm: 'Confirm this', fill: 'Fill in a missing detail' }[mode];
  const linked = f ? [...f.evidenceIds] : [];
  Dialog.open({
    title, sub: mode === 'fill' ? esc(f.text) : mode === 'confirm' ? 'Confirmed means you checked it against a document, a statement or the organization.' : '',
    body: `${field(mode === 'fill' ? 'What did you find out?' : 'Detail', textareaEl('text', mode === 'fill' ? '' : (f ? f.text : ''), `rows="2" required ${mode === 'fill' ? 'placeholder="e.g. $86.40 including an $18 fee"' : ''}`))}
      ${segEl('kind', Object.entries(FACT_KINDS).filter(([x]) => mode === 'fill' ? x !== 'missing' : true).map(([x, v]) => [x, v.label]), k, 'How sure is this?')}
      ${field('Source', inputEl('source', mode === 'confirm' ? '' : (source || (f ? f.source : '')), `${mode === 'confirm' ? 'required' : ''} placeholder="e.g. Statement dated Nov 3, call with Maya, official website"`), 'Where it came from — so you can trust it later.')}
      ${f && f.kind === 'missing' && mode === 'edit' ? field('Why it matters', inputEl('why', f.why)) : ''}
      <fieldset class="field"><legend class="label">Supporting evidence</legend>${evidenceChecklist(caseId, linked)}</fieldset>`,
    foot: '<button type="button" class="btn" data-dlg-close>Cancel</button><button class="btn btn-ink" type="submit">Save</button>',
    onSubmit: fd => {
      const newKind = val(fd, 'kind') || k; const src = val(fd, 'source');
      if (newKind === 'confirmed' && !src) { UI.toast('Add where you confirmed it — that’s what makes it trustworthy.', 'warn'); return false; }
      const text = val(fd, 'text');
      const evIds = fd.getAll('evidence').map(String);
      commit(() => {
        if (f) {
          const before = f.kind;
          const label = mode === 'fill' ? `${f.text}: ${text}` : text;
          Object.assign(f, { text: mode === 'fill' ? label : text, kind: newKind, source: src, updatedAt: nowStamp(), why: fd.has('why') ? val(fd, 'why') : f.why });
          syncEvidenceLinks('facts', f, evIds);
          logEvent(caseId, 'understanding', before !== newKind ? `${FACT_KINDS[newKind].label}: ${f.text}${src ? ` (source: ${src})` : ''}` : `Updated: ${f.text}`);
        } else {
          const nf = Normalize.facts({ caseId, text, kind: newKind, source: src });
          S.facts.push(nf); syncEvidenceLinks('facts', nf, evIds);
          logEvent(caseId, 'understanding', `${FACT_KINDS[newKind].label}: ${text}${src ? ` (source: ${src})` : ''}`);
        }
      }, { caseId });
    },
  });
}
Actions['fact-add'] = el => openFact(el.dataset.case, { kind: el.dataset.kind, source: el.dataset.source });
Actions['fact-edit'] = el => { const f = findRec('facts', el.dataset.id); openFact(f.caseId, { id: f.id, mode: 'edit' }); };
Actions['fact-confirm'] = el => { const f = findRec('facts', el.dataset.id); openFact(f.caseId, { id: f.id, mode: 'confirm' }); };
Actions['fact-fill'] = el => { const f = findRec('facts', el.dataset.id); openFact(f.caseId, { id: f.id, mode: 'fill' }); };
Actions['fact-delete'] = el => { const f = findRec('facts', el.dataset.id); const tid = commit(() => deleteRecord('facts', f.id, `Detail: ${truncate(f.text, 60)}`), { caseId: f.caseId }); undoToast('Removed.', tid); };

      ${segEl('reversibility', Object.entries(REVERSIBILITY), x ? x.reversibility : 'unknown', 'If it happens, can it be undone?')}

Actions['cons-delete'] = el => { const x = findRec('consequences', el.dataset.id); const tid = commit(() => deleteRecord('consequences', x.id, `Consequence: ${truncate(x.text, 60)}`), { caseId: x.caseId }); undoToast('Removed.', tid); };
Changes['cons-status'] = el => { const x = findRec('consequences', el.dataset.id); commit(() => { x.status = el.value; logEvent(x.caseId, 'understanding', `${x.text}: ${CONS_STATUS[x.status].toLowerCase()}`); }, { caseId: x.caseId }); };

/* ===== Deadlines ===== */
function openDeadline(caseId, id = '') {
  const d = id ? findRec('deadlines', id) : null;
  Dialog.open({
    title: d ? 'Edit date' : 'Add a date',
    body: `${field('What is it?', inputEl('label', d ? d.label : '', 'required placeholder="e.g. Contest deadline, My target"'))}
      <div class="grid2">${field('Date', inputEl('date', d ? d.date : '', 'type="date" required'))}${field('Status', selectEl('status', Object.entries(DL_STATUS), d ? d.status : 'open'))}</div>
      ${segEl('kind', [['external', 'Their deadline'], ['self', 'Your own target']], d ? d.kind : 'external', 'Whose date is it?')}
      ${segEl('certainty', Object.entries(CERTAINTY), d ? d.certainty : 'reported', 'How sure is it?')}
      ${field('Source', inputEl('source', d ? d.source : '', 'placeholder="e.g. Printed on the notice"'))}`,
    foot: '<button type="button" class="btn" data-dlg-close>Cancel</button><button class="btn btn-ink" type="submit">Save</button>',
    onSubmit: fd => {
      const data = { label: val(fd, 'label'), date: val(fd, 'date'), status: val(fd, 'status'), kind: val(fd, 'kind'), certainty: val(fd, 'certainty'), source: val(fd, 'source') };
      if (!isISODate(data.date)) { UI.toast('Choose a valid date.', 'warn'); return false; }
      if (data.kind === 'external' && data.certainty === 'confirmed' && !data.source) { UI.toast('Add where the confirmed date comes from.', 'warn'); return false; }
      commit(() => {
        if (d) { const old = d.date; Object.assign(d, data); logEvent(caseId, 'date', `${data.label}: ${old !== data.date ? `moved from ${fmtDate(old)} to ` : ''}${fmtDate(data.date)} (${CERTAINTY[data.certainty].toLowerCase()})`); }
        else { S.deadlines.push(Normalize.deadlines({ caseId, ...data })); logEvent(caseId, 'date', `Added date: ${data.label} — ${fmtDate(data.date)} (${CERTAINTY[data.certainty].toLowerCase()})`); }
      }, { caseId });
    },
  });
}
Actions['dl-add'] = el => openDeadline(el.dataset.case);
Actions['dl-edit'] = el => { const d = findRec('deadlines', el.dataset.id); openDeadline(d.caseId, d.id); };
Actions['dl-met'] = el => { const d = findRec('deadlines', el.dataset.id); commit(() => { d.status = 'met'; logEvent(d.caseId, 'date', `Met: ${d.label}`); }, { caseId: d.caseId }); };
Actions['dl-delete'] = el => { const d = findRec('deadlines', el.dataset.id); const tid = commit(() => deleteRecord('deadlines', d.id, `Date: ${d.label}`), { caseId: d.caseId }); undoToast('Removed.', tid); };

Actions['path-add'] = el => {

/* ===== Tasks & docs ===== */
Forms['task-add'] = (fd, form) => {
  const text = val(fd, 'text'); if (!text) return;
  const caseId = form.dataset.case;
  commit(() => { const order = Math.max(-1, ...byCase('tasks', caseId).map(t => t.order)) + 1; S.tasks.push(Normalize.tasks({ caseId, text, effort: Number(val(fd, 'effort')) || 0, order })); logEvent(caseId, 'task', `Added step: ${text}`); }, { caseId });
};
Actions['task-move'] = el => {
  const t = findRec('tasks', el.dataset.id); const dir = Number(el.dataset.dir);
  const list = Engine.openTasks(t.caseId); const i = list.indexOf(t); const j = i + dir;
  if (j < 0 || j >= list.length) return;
  commit(() => { list.forEach((x, k) => { x.order = k; }); const tmp = list[i].order; list[i].order = list[j].order; list[j].order = tmp; }, { caseId: t.caseId });
};
Actions['task-delete'] = el => { const t = findRec('tasks', el.dataset.id); const tid = commit(() => deleteRecord('tasks', t.id, `Step: ${truncate(t.text, 60)}`), { caseId: t.caseId }); undoToast('Step removed.', tid); };
Actions['task-edit'] = el => {
  const t = findRec('tasks', el.dataset.id);
  const others = Engine.openTasks(t.caseId).filter(x => x.id !== t.id);
  const waits = Engine.openWaits(t.caseId);
  Dialog.open({
    title: 'Edit step',
    body: `${field('Step', inputEl('text', t.text, 'required'))}<div class="grid2">${field('Rough effort', selectEl('effort', [[0, 'Not set'], [5, '5 min'], [10, '10 min'], [15, '15 min'], [20, '20 min'], [30, '30 min'], [60, '1 hour'], [120, '2 hours']], t.effort))}${field('Can’t start until this case is resolved', selectEl('caseDep', [['', 'No other case'], ...caseOptions(t.caseId)], t.caseDep))}</div>
      ${waits.length ? field('Can’t start until you receive', selectEl('waitDep', [['', 'Nothing'], ...waits.map(w => [w.id, w.what])], t.waitDep)) : ''}
      ${others.length ? `<fieldset class="field"><legend class="label">Can’t start until these steps are done</legend>${others.map(o => `<label class="check" style="padding:5px 0"><input type="checkbox" name="dependsOn" value="${esc(o.id)}" ${t.dependsOn.includes(o.id) ? 'checked' : ''}><span class="small">${esc(o.text)}</span></label>`).join('')}</fieldset>` : ''}
      ${field('Note', textareaEl('note', t.note, 'rows="2"'))}`,
    foot: '<button type="button" class="btn" data-dlg-close>Cancel</button><button class="btn btn-ink" type="submit">Save</button>',
    onSubmit: fd => {
      const deps = fd.getAll('dependsOn').map(String);
      const cyclic = deps.some(d => (function reaches(id, seen = new Set()) { if (id === t.id) return true; if (seen.has(id)) return false; seen.add(id); const x = findRec('tasks', id); return !!x && x.dependsOn.some(n => reaches(n, seen)); })(d));
      if (cyclic) { UI.toast('That would make steps wait on each other forever. Choose different dependencies.', 'warn'); return false; }
      commit(() => { Object.assign(t, { text: val(fd, 'text') || t.text, effort: Number(val(fd, 'effort')) || 0, caseDep: val(fd, 'caseDep'), waitDep: fd.has('waitDep') ? val(fd, 'waitDep') : t.waitDep, dependsOn: deps, note: val(fd, 'note') }); logEvent(t.caseId, 'task', `Edited step: ${t.text}`); }, { caseId: t.caseId });
    },
  });
};
Forms['doc-add'] = (fd, form) => { const name = val(fd, 'name'); if (!name) return; commit(() => S.docs.push(Normalize.docs({ caseId: form.dataset.case, name })), { caseId: form.dataset.case }); };
Actions['doc-cycle'] = el => { const d = findRec('docs', el.dataset.id); const order = ['needed', 'have', 'sent']; commit(() => { d.status = order[(order.indexOf(d.status) + 1) % 3]; logEvent(d.caseId, 'task', `${d.name}: ${DOC_STATUS[d.status].toLowerCase()}`); }, { caseId: d.caseId }); };

    onSubmit: fd => commit(() => Object.assign(d, { name: val(fd, 'name'), status: val(fd, 'status'), note: val(fd, 'note'), evidenceId: val(fd, 'evidenceId') }), { caseId: d.caseId }),
  });

Actions['doc-delete'] = el => { const d = findRec('docs', el.dataset.id); const tid = commit(() => deleteRecord('docs', d.id, `To gather: ${d.name}`), { caseId: d.caseId }); undoToast('Removed.', tid); };

Actions['comm-view'] = el => {
  const m = findRec('comms', el.dataset.id);

    title: m.subject || PURPOSES[m.purpose], sub: `${CHANNELS[m.channel]} · ${m.direction === 'in' ? 'from them' : 'from you'} · ${COMM_STATUS[m.status]}${m.date ? ' · ' + fmtDate(m.date, { year: true }) : ''}`,

      ${m.outcome ? `<div class="inset mt12"><p class="label">${m.channel === 'call' ? 'What happened' : 'Summary'}</p><p class="small draft">${esc(m.outcome)}</p></div>` : ''}

      ${cm.length ? `<div class="mt12"><p class="label">Commitments from this contact</p><ul class="bullets">${cm.map(x => `<li>${x.party === 'them' ? 'They' : 'You'}: ${esc(x.text)}${x.due ? ` (by ${esc(fmtDate(x.due))})` : ''} — ${esc(COMMIT_STATUS[x.status].toLowerCase())}</li>`).join('')}</ul></div>` : ''}

  });

function openComposer(caseId, init = {}) {
  const c = getCase(caseId);
  const existing = init.commId ? findRec('comms', init.commId) : null;
  const st = existing ? { channel: existing.channel, purpose: existing.purpose, stance: existing.stance, tone: existing.tone, proposal: existing.proposal, replyBy: existing.replyBy, pathId: existing.pathId, includeFacts: true, reason: '', waitId: '' } : { ...Comms.defaults(caseId, init), reason: '' };
  let draft = existing ? { subject: existing.subject, body: existing.body } : Comms.compose(caseId, st);
  let edited = existing ? existing.edited : false;
  const paths = S.paths.filter(p => p.caseId === caseId && ['considering', 'chosen'].includes(p.status));
  const body = `
    <div class="grid2">${segEl('channel', entriesOf(CHANNELS).filter(([k]) => k !== 'in_person'), st.channel, 'How')}${field('Purpose', selectEl('purpose', entriesOf(PURPOSES), st.purpose))}</div>
    <fieldset class="field"><legend class="label">Stance — what you’re acknowledging, conceding or claiming</legend><div class="choices" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">${Object.entries(STANCES).map(([k, v]) => `<label class="choice"><input type="radio" name="stance" value="${k}" ${st.stance === k ? 'checked' : ''}><span class="box"><b>${esc(v.label)}</b><small>${esc(v.desc)}</small></span></label>`).join('')}</div></fieldset>
    <div class="grid2">${segEl('tone', entriesOf(TONES), st.tone, 'Tone')}${field('Approach', selectEl('pathId', [['', 'Not tied to an approach'], ...paths.map(p => [p.id, p.title])], st.pathId))}</div>
    <details class="disclose"><summary>Details for the draft</summary><div class="grid2 mt8">
      ${field('Your proposal or details', inputEl('proposal', st.proposal, 'placeholder="e.g. $50 a month from next week"'), 'For arrangements, negotiating, rebooking and updates.')}
      ${field('Why you disagree', inputEl('reason', st.reason, 'placeholder="e.g. I paid on the 3rd — confirmation attached"'), 'Used with the Dispute stance.')}
      ${field('Reply by', inputEl('replyBy', st.replyBy, 'type="date"'), 'Used with a firm tone.')}
      <label class="check" style="align-self:center"><input type="checkbox" name="includeFacts" ${st.includeFacts ? 'checked' : ''}><span class="small">Include confirmed details only</span></label>
    </div></details>
    <div class="between mt16"><p class="xs muted" data-role="edited-note"></p><button type="button" class="btn btn-sm" data-role="regen">Regenerate from options</button></div>
    <div data-role="subject-wrap" class="mt8">${field('Subject', inputEl('subject', draft.subject))}</div>
    ${field('Draft', `<textarea class="textarea tall" name="body" aria-describedby="draft-hint">${esc(draft.body)}</textarea>`, '<span id="draft-hint">[Square brackets] mark details only you can fill in. Nothing is sent from here.</span>')}
    <div data-role="checks" class="stack stack-sm mt12"></div>
    <div data-role="callplan" class="mt12"></div>`;
  const foot = `${existing ? '<button type="button" class="btn btn-ghost btn-danger" data-role="delete">Delete</button>' : ''}<span class="spacer"></span>
    <button type="button" class="btn" data-role="copy">${ico('copy', 'sm')}Copy</button><button type="button" class="btn" data-role="mailto">${ico('mail', 'sm')}Email app</button><button type="button" class="btn" data-role="download">${ico('download', 'sm')}.txt</button>
    <button type="submit" class="btn" name="act" value="save">Save draft</button><button type="submit" class="btn btn-ink" name="act" value="sent" data-role="primary">Mark as sent</button>`;
  Dialog.open({
    title: existing ? (existing.channel === 'call' ? 'Call script' : 'Edit draft') : 'Prepare a message', sub: esc(c.title), body, foot, size: 'wide full',
    onOpen: form => {
      const $ = sel => form.querySelector(sel);
      const read = () => { const fd = new FormData(form); ['channel', 'purpose', 'stance', 'tone', 'pathId', 'proposal', 'replyBy', 'reason'].forEach(k => { st[k] = val(fd, k) || (k === 'pathId' || k === 'proposal' || k === 'replyBy' || k === 'reason' ? '' : st[k]); }); st.includeFacts = fd.has('includeFacts'); };
      const refresh = () => {
        const call = st.channel === 'call';
        $('[data-role=subject-wrap]').hidden = call;
        $('[data-role=mailto]').hidden = st.channel !== 'email';
        $('[data-role=download]').hidden = call;
        $('[data-role=primary]').textContent = call ? 'Record the call' : 'Mark as sent';
        $('[data-role=edited-note]').textContent = edited ? 'You’ve edited the text, so changing options won’t overwrite it.' : 'The draft updates as you change the options.';
        const text = `${call ? '' : $('[name=subject]').value + '\n'}${$('[name=body]').value}`;
        const checks = Comms.preflight(caseId, text, st);
        $('[data-role=checks]').innerHTML = checks.length ? `<p class="label">Before you send</p>${checks.map(ch => `<div class="banner ${ch.level === 'warn' ? 'warn' : 'info'}"><p>${esc(ch.text)}</p></div>`).join('')}` : '<div class="banner ok"><p>No placeholders left, nothing unconfirmed, and the stance matches your approach.</p></div>';
        if (call) { const plan = Comms.callPlan(caseId, st); $('[data-role=callplan]').innerHTML = `<div class="grid2"><div class="inset"><p class="label">Have ready</p><ul class="bullets">${plan.checklist.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><div class="inset"><p class="label">Questions to ask</p><ul class="bullets">${plan.questions.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div>`; }
        else $('[data-role=callplan]').innerHTML = '';
      };
      const regen = () => { draft = Comms.compose(caseId, st); $('[name=subject]').value = draft.subject; $('[name=body]').value = draft.body; edited = false; refresh(); };
      form.addEventListener('change', e => { if (['channel', 'purpose', 'stance', 'tone', 'pathId', 'includeFacts', 'replyBy'].includes(e.target.name)) { read(); if (!edited) regen(); else refresh(); } });
      form.addEventListener('input', e => { if (e.target.name === 'body' || e.target.name === 'subject') { edited = true; refresh(); } else if (['proposal', 'reason'].includes(e.target.name)) { read(); if (!edited) regen(); } });
      $('[data-role=regen]').addEventListener('click', async () => { read(); if (edited && !await confirmDialog({ title: 'Replace your edits?', text: 'Regenerating rewrites the draft from the options and discards your changes to the text.', ok: 'Replace' })) return; regen(); });
      $('[data-role=copy]').addEventListener('click', async () => { const call = st.channel === 'call'; const ok = await copyText(call ? $('[name=body]').value : `Subject: ${$('[name=subject]').value}\n\n${$('[name=body]').value}`); UI.toast(ok ? 'Copied.' : 'Couldn’t copy — select the text and copy it manually.', ok ? 'ok' : 'warn'); });
      $('[data-role=mailto]').addEventListener('click', () => { const a = document.createElement('a'); a.href = `mailto:?subject=${encodeURIComponent($('[name=subject]').value)}&body=${encodeURIComponent($('[name=body]').value)}`; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); UI.toast('Opened in your email app — nothing is sent until you press send there.'); });
      $('[data-role=download]').addEventListener('click', () => downloadText(`${safeFileName($('[name=subject]').value || 'message')}.txt`, `${$('[name=subject]').value}\n\n${$('[name=body]').value}`));
      const del = $('[data-role=delete]');
      if (del) del.addEventListener('click', async () => { if (!await confirmDialog({ title: 'Delete this draft?', text: 'It will move to the trash.', ok: 'Delete', danger: true })) return; const tid = commit(() => deleteRecord('comms', existing.id, `Draft: ${existing.subject}`), { caseId }); Dialog.close(); undoToast('Draft removed.', tid); });
      refresh();
    },
    onSubmit: (fd, form, submitter) => {
      const act = submitter && submitter.value === 'sent' ? 'sent' : 'save';
      const plan = Comms.callPlan(caseId, st);
      const data = { caseId, channel: st.channel, purpose: st.purpose, stance: st.stance, tone: st.tone, proposal: st.proposal, replyBy: st.replyBy, pathId: st.pathId, subject: val(fd, 'subject') || draft.subject, body: String(fd.get('body') || ''), edited, direction: 'out' };
      let id = existing ? existing.id : '';
      commit(() => {
        if (existing) { Object.assign(existing, data); if (st.channel === 'call' && !existing.checklist.length) { existing.checklist = plan.checklist.map(t => ({ id: uid('ck'), text: t, done: false })); existing.questions = plan.questions.map(t => ({ id: uid('q'), text: t, answer: '' })); } }
        else { const m = Normalize.comms({ ...data, status: 'draft', checklist: st.channel === 'call' ? plan.checklist.map(t => ({ text: t })) : [], questions: st.channel === 'call' ? plan.questions.map(t => ({ text: t })) : [] }); S.comms.push(m); id = m.id; logEvent(caseId, 'comm', `Drafted: ${m.subject} (${CHANNELS[m.channel].toLowerCase()}, ${STANCES[m.stance].label.toLowerCase()})`); }
      }, { caseId });
      if (act === 'save') { UI.toast('Draft saved in Contact.', 'ok'); return; }
      setTimeout(() => (st.channel === 'call' ? openCallNotes(id) : openMarkSent(id, init.waitId || st.waitId)), 60);
    },
  });
}

function openMarkSent(commId, waitId = '') {
  const m = findRec('comms', commId); const c = getCase(m.caseId);
  const w = waitId ? findRec('waits', waitId) : null;
  Dialog.open({
    title: 'Mark as sent', sub: esc(m.subject),
    body: `${field('Sent on', inputEl('date', today(), 'type="date" required'))}
      <label class="check mt12"><input type="checkbox" name="track" checked><span class="small">${w ? `Update the waiting item “${esc(w.what)}”` : 'Track their reply in Waiting'}</span></label>
      <div class="grid2 mt12">${field('Expect a reply by', inputEl('expectedBy', offset(m.purpose === 'escalate' ? 10 : 7), 'type="date"'), 'Your estimate unless they’ve promised a date.')}${field('Follow up if nothing by', inputEl('followUpOn', offset(m.purpose === 'escalate' ? 11 : 8), 'type="date"'))}</div>
      ${!w ? field('What are you waiting for?', selectEl('kind', Object.entries(WAIT_KINDS).map(([k, v]) => [k, v.long]), m.purpose === 'arrangement' || m.purpose === 'request' ? 'decision' : 'response')) : ''}`,
    foot: '<button type="button" class="btn" data-dlg-close>Not now</button><button class="btn btn-ink" type="submit">Save</button>',
    onSubmit: fd => commit(() => {
      const date = val(fd, 'date') || today();
      m.status = 'sent'; m.date = date;
      logEvent(m.caseId, 'comm', `Sent: ${m.subject} (${CHANNELS[m.channel].toLowerCase()})`);
      if (!fd.has('track')) return;
      if (w) { w.log.push({ id: uid('wl'), date, note: `${m.purpose === 'escalate' ? 'Escalated' : 'Followed up'} by ${CHANNELS[m.channel].toLowerCase()}: ${m.subject}` }); w.followUpOn = val(fd, 'followUpOn'); if (m.purpose === 'escalate') w.status = 'escalated'; if (!w.expectedBy || daysUntil(w.expectedBy) < 0) { w.expectedBy = val(fd, 'expectedBy'); w.basis = 'estimate'; } }
      else S.waits.push(Normalize.waits({ caseId: m.caseId, kind: val(fd, 'kind'), what: `Reply to: ${m.subject}`, from: c.counterparty, since: date, expectedBy: val(fd, 'expectedBy'), basis: 'estimate', followUpOn: val(fd, 'followUpOn'), log: [{ date, note: `Sent ${CHANNELS[m.channel].toLowerCase()}: ${m.subject}` }] }));
    }, { caseId: m.caseId }),
  });
}

function commitmentRows(prefix, n = 1) {
  return `<div data-rows="${prefix}">${Array.from({ length: n }).map(() => commitmentRow(prefix)).join('')}</div><button type="button" class="btn btn-xs btn-ghost mt8" data-add-row="${prefix}">+ Another</button>`;
}
function commitmentRow(prefix) {
  return `<div class="grid2" style="grid-template-columns:2fr 1fr;margin-top:6px"><input class="input" name="${prefix}_text" placeholder="${prefix === 'them' ? 'e.g. send written confirmation of the waiver' : 'e.g. pay the balance'}" aria-label="What"><input class="input" type="date" name="${prefix}_due" aria-label="By when"></div>`;
}
function wireRows(form) { form.querySelectorAll('[data-add-row]').forEach(b => b.addEventListener('click', () => { const p = b.dataset.addRow; form.querySelector(`[data-rows="${p}"]`).insertAdjacentHTML('beforeend', p === 'fact' ? factRow() : commitmentRow(p)); })); }
const factRow = () => '<input class="input mt8" name="fact_text" placeholder="e.g. The balance is $86.40 including the fee" aria-label="Fact learned">';
function saveCommitmentsAndFacts(fd, caseId, commId, source) {
  const out = { them: 0, me: 0, facts: 0 };
  ['them', 'me'].forEach(p => {
    const texts = fd.getAll(`${p}_text`).map(String); const dues = fd.getAll(`${p}_due`).map(String);
    texts.forEach((t, i) => { if (t.trim()) { Ops.addCommitment(caseId, { party: p, text: t.trim(), due: isISODate(dues[i]) ? dues[i] : '', commId, waitKind: p === 'them' ? (val(fd, 'waitKind') || 'action') : '' }); out[p]++; } });
  });
  fd.getAll('fact_text').map(String).forEach(t => { if (t.trim()) { S.facts.push(Normalize.facts({ caseId, kind: 'confirmed', text: t.trim(), source })); logEvent(caseId, 'understanding', `Confirmed: ${t.trim()} (source: ${source})`); out.facts++; } });
  return out;
}

function openCallNotes(commId) {
  const m = findRec('comms', commId); const c = getCase(m.caseId);
  Dialog.open({
    title: 'Call notes', sub: esc(c.title) + (c.counterparty ? ' · ' + esc(c.counterparty) : ''), size: 'wide full',
    body: `<details class="disclose" style="border-top:0;margin-top:0;padding-top:0"><summary>Your script</summary><p class="draft mt8 small">${esc(m.body)}</p></details>
      ${m.checklist.length ? `<fieldset class="field mt12"><legend class="label">Have ready</legend>${m.checklist.map(i => `<label class="check" style="padding:5px 0"><input type="checkbox" name="ck" value="${esc(i.id)}" ${i.done ? 'checked' : ''}><span class="small">${esc(i.text)}</span></label>`).join('')}</fieldset>` : ''}
      <div class="grid3 mt12">${field('Date', inputEl('date', m.date || today(), 'type="date"'))}${field('Who you spoke to', inputEl('contact', m.contact, 'placeholder="Name"'))}${field('Reference number', inputEl('reference', m.reference, 'class="input mono"'))}</div>
      ${m.questions.length ? `<fieldset class="field mt12"><legend class="label">Questions to ask — note the answers</legend>${m.questions.map(q => `<label class="field" style="margin-top:8px"><span class="small">${esc(q.text)}</span><input class="input" name="qa_${esc(q.id)}" value="${esc(q.answer)}"></label>`).join('')}</fieldset>` : ''}
      ${field('What happened', textareaEl('outcome', m.outcome, 'rows="3" placeholder="What did they agree to, refuse, or explain?"'))}
      <fieldset class="field"><legend class="label">They committed to…</legend>${commitmentRows('them')}<div class="mt8">${field('Track their promises as', selectEl('waitKind', Object.entries(WAIT_KINDS).map(([k, v]) => [k, v.long]), 'action'))}</div></fieldset>
      <fieldset class="field"><legend class="label">You committed to…</legend>${commitmentRows('me')}</fieldset>
      <fieldset class="field"><legend class="label">Facts you learned (saved as confirmed)</legend><div data-rows="fact">${factRow()}</div><button type="button" class="btn btn-xs btn-ghost mt8" data-add-row="fact">+ Another</button></fieldset>
      <label class="check mt12"><input type="checkbox" name="asEvidence" checked><span class="small">Save this call record as evidence</span></label>`,
    foot: '<button type="button" class="btn" data-dlg-close>Cancel</button><button class="btn btn-ink" type="submit">Save call record</button>',
    onOpen: wireRows,
    onSubmit: fd => {
      const date = val(fd, 'date') || today();
      const r = commit(() => {
        const checked = fd.getAll('ck').map(String);
        m.checklist.forEach(i => { i.done = checked.includes(i.id); });
        m.questions.forEach(q => { q.answer = val(fd, `qa_${q.id}`); });
        Object.assign(m, { status: 'done', date, contact: val(fd, 'contact'), reference: val(fd, 'reference'), outcome: val(fd, 'outcome') });
        logEvent(m.caseId, 'comm', `Call${m.contact ? ' with ' + m.contact : ''}${m.reference ? ' (ref ' + m.reference + ')' : ''}${m.outcome ? ': ' + truncate(m.outcome, 300) : ''}`);
        const source = `Call${m.contact ? ' with ' + m.contact : ''} on ${fmtDate(date, { year: true })}`;
        const out = saveCommitmentsAndFacts(fd, m.caseId, m.id, source);
        m.questions.filter(q => q.answer).forEach(q => { S.facts.push(Normalize.facts({ caseId: m.caseId, kind: 'confirmed', text: `${q.text.replace(/^Can you confirm:\s*/i, '').replace(/\?$/, '')}: ${q.answer}`, source })); out.facts++; });
        if (fd.has('asEvidence')) S.evidence.push(Normalize.evidence({ caseId: m.caseId, type: 'call_note', title: `Call record — ${fmtDate(date)}${m.contact ? ', ' + m.contact : ''}`, reference: m.reference, note: m.outcome, date, links: [{ t: 'comms', id: m.id }, ...S.commitments.filter(x => x.commId === m.id).map(x => ({ t: 'commitments', id: x.id }))] }));
        return out;
      }, { caseId: m.caseId });
      UI.toast(`Call recorded.${r.them ? ` ${plural(r.them, 'promise')} now tracked in Waiting.` : ''}${r.facts ? ` ${plural(r.facts, 'fact')} confirmed.` : ''}`, 'ok');
    },
  });
}

        S.comms.push(m);

Actions['cmt-add'] = el => {

    onSubmit: fd => commit(() => Ops.addCommitment(caseId, { party: val(fd, 'party'), text: val(fd, 'text'), due: val(fd, 'due'), waitKind: val(fd, 'party') === 'them' ? val(fd, 'waitKind') : '' }), { caseId }),
  });

Actions['cmt-status'] = el => {
  const m = findRec('commitments', el.dataset.id); const status = el.dataset.status;
  commit(() => {
    m.status = status;
