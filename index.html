    const ranked = P.paths.map(p => ({ p, ...this.scorePath(d.type, p, d.answers) })).sort((a, b2) => b2.score - a.score);
    ranked.forEach(({ p }) => {
      b.paths.push({ id: uid('path'), caseId, key: p.key, approach: p.approach, title: p.title, why: p.why, downsides: p.downsides || '', prerequisites: [...(p.prereq || [])], uncertainties: [...(p.uncertain || [])], outcome: p.outcome || '', status: p.key === pathKey ? 'chosen' : 'considering', note: '', custom: false });
    });
    const chosen = b.paths.find(p => p.status === 'chosen');
    if (chosen) b.tasks.push(...this.tasksForPath(caseId, chosen, 0, d.type));
    P.docs.forEach(name => b.docs.push({ id: uid('doc'), caseId, name, status: 'needed', note: '', evidenceId: '' }));
    P.criteria.forEach((text, i) => b.criteria.push({ id: uid('crit'), caseId, text, status: 'pending', evidenceIds: [], note: '', checkedAt: '', key: 'c' + i }));
    b.events.push({ id: uid('evt'), caseId, at, type: 'created', text: `Case opened: “${truncate(d.text, 300)}”`, manual: false });
    const answered = Object.keys(d.answers).map(q => { const qd = P.questions.find(x => x.id === q); const o = qd && qd.opts.find(x => x[0] === d.answers[q]); return qd && o ? `${qd.q} → ${o[1]}${d.answerSource[q] === 'inferred' ? ' (inferred from your description)' : ''}` : null; }).filter(Boolean);
    if (answered.length) b.events.push({ id: uid('evt'), caseId, at, type: 'understanding', text: `Context recorded: ${answered.join('; ')}`, manual: false });
    if (chosen) b.events.push({ id: uid('evt'), caseId, at, type: 'path', text: `Chose an approach: ${chosen.title}`, manual: false });
    return { caseId, bundle: b };
  },

  tasksForPath(caseId, path, startOrder, type) {
    const def = pb(type).paths.find(p => p.key === path.key);
    if (!def) return [];
    const out = [];
    def.tasks.forEach(([raw, effort], i) => {
      const dep = raw.startsWith('>');
      const id = uid('task');
      out.push({ id, caseId, text: dep ? raw.slice(1) : raw, done: false, doneAt: '', pathId: path.id, dependsOn: dep && out[i - 1] ? [out[i - 1].id] : [], waitDep: '', caseDep: '', effort, order: startOrder + i, note: '', createdAt: nowStamp() });
    });
    return out;
  },

  /* Used for migrated v1 cases: add the understanding layer without touching their tasks. */
  enrichCase(s, c) {
    const P = pb(c.type);
    const at = nowStamp();
    const has = coll => s[coll].some(r => r.caseId === c.id);
    if (!has('paths')) P.paths.forEach(p => s.paths.push({ id: uid('path'), caseId: c.id, key: p.key, approach: p.approach, title: p.title, why: p.why, downsides: p.downsides || '', prerequisites: [...(p.prereq || [])], uncertainties: [...(p.uncertain || [])], outcome: p.outcome || '', status: 'considering', note: '', custom: false }));
    if (!has('criteria')) P.criteria.forEach((text, i) => s.criteria.push({ id: uid('crit'), caseId: c.id, text, status: 'pending', evidenceIds: [], note: '', checkedAt: '', key: 'c' + i }));
    if (!has('facts')) P.facts.forEach(([key, text, why]) => s.facts.push({ id: uid('fact'), caseId: c.id, kind: 'missing', text, why, source: '', key, evidenceIds: [], createdAt: at, updatedAt: at }));
    if (!has('consequences')) this.consequencesFor(c.type, c.answers || {}).forEach(x => s.consequences.push({ id: uid('csq'), caseId: c.id, ...x }));
    if (!has('docs')) P.docs.forEach(name => s.docs.push({ id: uid('doc'), caseId: c.id, name, status: 'needed', note: '', evidenceId: '' }));
  },

  /* ---- Live analysis of a case ---- */
  signals(caseId) {
    const missedPromise = S.commitments.some(m => m.caseId === caseId && m.party === 'them' && (m.status === 'missed' || (m.status === 'pending' && m.due && daysUntil(m.due) < 0)))
      || S.waits.some(w => w.caseId === caseId && w.status === 'waiting' && w.basis === 'promised' && w.expectedBy && daysUntil(w.expectedBy) < 0);
    const deadlinePassed = S.deadlines.some(d => d.caseId === caseId && d.kind === 'external' && (d.status === 'missed' || (d.status === 'open' && d.date && daysUntil(d.date) < 0)));
    return { missedPromise, deadlinePassed };
  },

  rankPaths(caseId) {
    const c = getCase(caseId);
    if (!c) return [];
    const sig = this.signals(caseId);
    const order = { worked: 0, chosen: 1, considering: 2, didnt_work: 3, ruled_out: 4 };
    const list = S.paths.filter(p => p.caseId === caseId).map(p => ({ path: p, ...(p.custom ? { score: 0, reasons: [] } : this.scorePath(c.type, p, c.answers, sig)) }));
    const live = list.filter(x => ['considering', 'chosen'].includes(x.path.status));
    const best = live.length ? Math.max(...live.map(x => x.score)) : null;
    list.forEach(x => { x.best = best !== null && x.score === best && ['considering', 'chosen'].includes(x.path.status) && live.filter(y => y.score === best).length < live.length; });
    return list.sort((a, b) => (order[a.path.status] - order[b.path.status]) || (b.score - a.score));
  },

  taskBlockers(t) {
    const out = [];
    for (const id of t.dependsOn) { const d = S.tasks.find(x => x.id === id); if (d && !d.done) out.push({ kind: 'task', id, text: `After “${truncate(d.text, 60)}”` }); }
    if (t.waitDep) { const w = S.waits.find(x => x.id === t.waitDep); if (w && !['received', 'dropped'].includes(w.status)) out.push({ kind: 'wait', id: w.id, text: `Waiting for: ${truncate(w.what, 60)}` }); }
    if (t.caseDep) { const c2 = getCase(t.caseDep); if (c2 && !isClosed(c2)) out.push({ kind: 'case', id: c2.id, text: `Needs “${truncate(c2.title, 50)}” resolved first` }); }
    return out;
  },

  openTasks(caseId) { return S.tasks.filter(t => t.caseId === caseId && !t.done).sort(byOrder); },
  actionableTasks(caseId) { return this.openTasks(caseId).filter(t => this.taskBlockers(t).length === 0); },

  nextStep(caseId) {
    const c = getCase(caseId);
    if (!c) return null;
    if (isClosed(c)) return { kind: 'closed', text: RES_STATES[c.resolution.state].label };
    if (c.resolution.state === 'monitoring' && c.resolution.monitorUntil && daysUntil(c.resolution.monitorUntil) <= 0) {
      return { kind: 'monitor', text: `Check it’s still resolved${c.resolution.condition ? ': ' + c.resolution.condition : ''}`, why: 'Your monitoring date has arrived.' };
    }
    const pending = this.openWaits(caseId).map(w => ({ w, st: this.waitState(w) }));
    const missed = pending.find(x => x.st.key === 'missed');
    const followUp = ({ w, st }) => ({ kind: 'followup', wait: w, purpose: st.key === 'missed' ? 'escalate' : 'follow_up', text: `${st.key === 'missed' ? 'Escalate' : 'Follow up'}: ${w.what}`, why: `${st.label}${w.from ? ' — ' + w.from : ''}.` });
    if (missed) return followUp(missed);
    const acts = this.actionableTasks(caseId);
    if (acts.length) return { kind: 'task', task: acts[0], text: acts[0].text };
    const due = pending.find(x => ['follow', 'overdue'].includes(x.st.key));
    if (due) return followUp(due);
    const open = this.openTasks(caseId);
    const chosen = S.paths.some(p => p.caseId === caseId && p.status === 'chosen');
    if (!open.length && !chosen && !S.comms.some(m => m.caseId === caseId) && !this.openWaits(caseId).length) {
      return { kind: 'choose', text: 'Compare your options and choose an approach', why: 'No approach chosen yet.' };
    }
    if (open.length) {
      const blockers = this.taskBlockers(open[0]);
      return { kind: 'blocked', text: blockers[0] ? blockers[0].text : 'Steps are waiting on something', task: open[0], blockers };
    }
    const waits = this.openWaits(caseId);
    if (waits.length) return { kind: 'wait', text: `Waiting on ${waits[0].from || 'them'}: ${waits[0].what}`, wait: waits[0] };
    if (['monitoring', 'conditional'].includes(c.resolution.state)) return { kind: 'watch', text: c.resolution.state === 'monitoring' ? `Monitoring until ${fmtDate(c.resolution.monitorUntil) || 'you decide'}` : `Waiting for the condition: ${c.resolution.condition || 'not described'}` };
    return { kind: 'resolve', text: 'Check whether the problem is actually resolved', why: 'All steps are done — but a finished checklist isn’t the same as a solved problem.' };
  },

  openWaits(caseId) { return S.waits.filter(w => (!caseId || w.caseId === caseId) && ['waiting', 'escalated'].includes(w.status)); },

  waitState(w) {
    if (w.status === 'received') return { key: 'received', label: 'Received', tone: 'sage' };
    if (w.status === 'dropped') return { key: 'dropped', label: 'Stopped waiting', tone: '' };
    const exp = w.expectedBy ? daysUntil(w.expectedBy) : null;
    const fu = w.followUpOn ? daysUntil(w.followUpOn) : null;
    if (exp !== null && exp < 0 && w.basis === 'promised') return { key: 'missed', label: `Promise missed ${relDay(w.expectedBy)}`, tone: 'coral', rank: 0 };
    if (exp !== null && exp < 0) return { key: 'overdue', label: `Past expected date (${fmtDate(w.expectedBy)})`, tone: 'amber', rank: 1 };
    if (fu !== null && fu <= 0) return { key: 'follow', label: fu === 0 ? 'Follow up today' : `Follow-up due since ${fmtDate(w.followUpOn)}`, tone: 'amber', rank: 2 };
    if (w.status === 'escalated') return { key: 'escalated', label: 'Escalated', tone: 'blue', rank: 3 };
    return { key: 'on_track', label: exp !== null ? `Expected ${relDay(w.expectedBy)}` : (fu !== null ? `Follow up ${relDay(w.followUpOn)}` : 'Waiting'), tone: '', rank: 4 };
  },

  priority(caseId) {
    const c = getCase(caseId);
    if (!c || isClosed(c)) return null;
    let score = 0;
    const reasons = [];
    const add = (pts, text, hot = false) => { score += pts; reasons.push({ text, hot, pts }); };
    const dls = S.deadlines.filter(d => d.caseId === caseId && d.status !== 'met' && d.status !== 'void' && d.date);
    let passedNoted = false;
    let hardSoon = false;
    for (const d of dls) {
      const n = daysUntil(d.date);
      if (d.kind === 'external') {
        if (n < 0 || d.status === 'missed') { if (!passedNoted) { add(1, `${d.label} has passed (${fmtDate(d.date)})`); passedNoted = true; } }
        else if (n <= 2) { add(d.certainty === 'confirmed' ? 6 : 4, `${d.certainty === 'confirmed' ? 'Confirmed' : 'Unconfirmed'} deadline ${relDay(d.date)}: ${d.label}`, true); hardSoon = true; }
        else if (n <= 7) { add(3, `${d.label} ${relDay(d.date)}`); hardSoon = n <= 3 || hardSoon; }
        else if (n <= 14) add(1, `${d.label} ${relDay(d.date)}`);
      } else if (n <= 0) add(1, `Your own target date ${n === 0 ? 'is today' : 'has passed'}`);
    }
    const cons = S.consequences.filter(x => x.caseId === caseId && x.status === 'potential');
    const severe = cons.filter(x => x.severity >= 3 && x.reversibility !== 'reversible');
    if (severe.length) add(4, `Could lead to ${severe[0].text.charAt(0).toLowerCase() + severe[0].text.slice(1)} — ${REVERSIBILITY[severe[0].reversibility].toLowerCase()}`, true);
    else if (cons.some(x => x.severity >= 2)) add(1, 'Has consequences worth avoiding');
    const est = S.consequences.find(x => x.caseId === caseId && x.status === 'established' && x.reversibility === 'reversible');
    if (est) add(1, `Can still be reversed: ${est.text.charAt(0).toLowerCase() + est.text.slice(1)}`);
    const ws = this.openWaits(caseId).map(w => this.waitState(w));
    if (ws.some(x => x.key === 'missed')) add(3, 'They missed a date they promised', true);
    else if (ws.some(x => x.key === 'follow' || x.key === 'overdue')) add(2, 'A follow-up is due');
    const mine = S.commitments.filter(m => m.caseId === caseId && m.party === 'me' && m.status === 'pending' && m.due && daysUntil(m.due) <= 3);
    if (mine.length) add(3, `You said you’d ${truncate(mine[0].text, 50)} by ${fmtDate(mine[0].due)}`, daysUntil(mine[0].due) <= 1);
    const blocks = S.links.filter(l => l.type === 'blocks' && l.from === caseId).map(l => getCase(l.to)).filter(x => x && !isClosed(x));
    if (blocks.length) add(2 * blocks.length, `Resolving this unblocks “${truncate(blocks[0].title, 40)}”${blocks.length > 1 ? ` and ${blocks.length - 1} more` : ''}`);
    const step = this.nextStep(caseId);
    if (step && step.kind === 'monitor') add(2, 'A monitoring check is due');
    const actionable = !!step && ['task', 'choose', 'resolve', 'monitor', 'followup'].includes(step.kind);
    if (!actionable) score -= 2;
    const parked = !!c.parkedUntil && daysUntil(c.parkedUntil) > 0;
    const parkedButUrgent = parked && hardSoon;
    if (parkedButUrgent) reasons.unshift({ text: 'Parked, but a deadline is close', hot: true, pts: 99 });
    reasons.sort((a, b) => (b.hot - a.hot) || (b.pts - a.pts));
    return { caseId, score, reasons, step, actionable, parked: parked && !parkedButUrgent };
  },

  prioritized() {
    return S.cases.map(c => this.priority(c.id)).filter(Boolean).sort((a, b) => b.score - a.score);
  },

  caseStatus(caseId) {
    const c = getCase(caseId);
    const r = RES_STATES[c.resolution.state];
    if (r.closed) return { key: c.resolution.state, label: r.label, tone: r.tone };
    if (c.parkedUntil && daysUntil(c.parkedUntil) > 0) return { key: 'parked', label: `Parked until ${fmtDate(c.parkedUntil)}`, tone: '' };
    if (c.resolution.state !== 'open') return { key: c.resolution.state, label: r.label, tone: r.tone };
    const step = this.nextStep(caseId);
    if (step.kind === 'followup') return { key: 'waiting', label: step.purpose === 'escalate' ? 'Promise missed' : 'Follow-up due', tone: step.purpose === 'escalate' ? 'coral' : 'amber' };
    if (step.kind === 'wait') return { key: 'waiting', label: 'Waiting on others', tone: 'amber' };
    if (step.kind === 'blocked') return { key: 'blocked', label: 'Blocked', tone: 'blue' };
    if (step.kind === 'resolve') return { key: 'check', label: 'Ready to verify', tone: 'sage' };
    const started = S.tasks.some(t => t.caseId === caseId && t.done) || S.comms.some(m => m.caseId === caseId && m.status !== 'draft');
    return started ? { key: 'progress', label: 'In progress', tone: '' } : { key: 'new', label: 'Not started', tone: '' };
  },

  resolution(caseId) {
    const crit = S.criteria.filter(x => x.caseId === caseId && x.status !== 'na');
    const met = crit.filter(x => x.status === 'met');
    const evidenced = met.filter(x => x.evidenceIds.length);
    const pendingTheirs = S.commitments.filter(m => m.caseId === caseId && m.party === 'them' && m.status === 'pending');
    const tasksOpen = this.openTasks(caseId).length;
    let suggest = null; let text = '';
    if (!crit.length) { text = 'Add at least one statement of what “resolved” means, so you’ll know when you’re done.'; }
    else if (evidenced.length === crit.length) { suggest = 'verified'; text = 'Every criterion is met and backed by evidence. You can close this as verified.'; }
    else if (met.length === crit.length) { suggest = 'closed_unverified'; text = `Everything is marked as met, but ${plural(crit.length - evidenced.length, 'criterion', 'criteria')} ${crit.length - evidenced.length === 1 ? 'has' : 'have'} no evidence yet. Add evidence to verify, or close it as not verified.`; }
    else if (met.length) { suggest = 'partial'; text = `${met.length} of ${crit.length} criteria met.`; }
    else text = 'None of the criteria are met yet.';
    if (pendingTheirs.length && suggest !== 'verified') text += ` ${plural(pendingTheirs.length, 'promise')} from the other side ${pendingTheirs.length === 1 ? 'is' : 'are'} still pending — “resolved on a condition” may fit.`;
    return { crit, met, evidenced, suggest, text, tasksOpen, pendingTheirs };
  },

  focusQueue(minutes) {
    const pri = this.prioritized().filter(p => !p.parked && p.actionable);
    const pool = [];
    pri.forEach(p => { this.actionableTasks(p.caseId).slice(0, 2).forEach(t => pool.push({ task: t, caseId: p.caseId, reasons: p.reasons })); });
    const queue = []; let used = 0;
    for (const item of pool) {
      const eff = item.task.effort || 10;
      if (used + eff <= minutes || queue.length === 0) { queue.push(item); used += eff; }
      if (queue.length >= 6) break;
    }
    return { queue, minutes: used, available: pool.length };
  },

  agenda() {
    const items = [];
    const open = new Set(S.cases.filter(c => !isClosed(c)).map(c => c.id));
    S.deadlines.filter(d => open.has(d.caseId) && d.date && ['open', 'missed'].includes(d.status)).forEach(d => items.push({ date: d.date, kind: d.kind === 'self' ? 'target' : 'deadline', title: d.label, caseId: d.caseId, certainty: d.certainty, id: d.id, passed: d.status === 'missed' || daysUntil(d.date) < 0 }));
    S.waits.filter(w => open.has(w.caseId) && ['waiting', 'escalated'].includes(w.status)).forEach(w => {
      if (w.expectedBy) items.push({ date: w.expectedBy, kind: 'expected', title: `${w.basis === 'promised' ? 'Promised' : 'Expected'}: ${w.what}`, caseId: w.caseId, id: w.id, certainty: w.basis === 'promised' ? 'confirmed' : 'estimated' });
      if (w.followUpOn) items.push({ date: w.followUpOn, kind: 'followup', title: `Follow up: ${w.what}`, caseId: w.caseId, id: w.id });
    });
    S.commitments.filter(m => open.has(m.caseId) && m.status === 'pending' && m.due).forEach(m => items.push({ date: m.due, kind: m.party === 'me' ? 'mine' : 'theirs', title: m.party === 'me' ? `You committed: ${m.text}` : `They committed: ${m.text}`, caseId: m.caseId, id: m.id }));
    S.cases.forEach(c => {
      if (c.resolution.state === 'monitoring' && c.resolution.monitorUntil) items.push({ date: c.resolution.monitorUntil, kind: 'monitor', title: 'Monitoring check', caseId: c.id });
      if (c.parkedUntil && daysUntil(c.parkedUntil) >= 0 && !isClosed(c)) items.push({ date: c.parkedUntil, kind: 'parked', title: 'Parked case comes back', caseId: c.id });
    });
    S.obligations.forEach(o => items.push({ date: o.next, kind: 'obligation', title: o.title, id: o.id }));
    return items.sort((a, b) => a.date.localeCompare(b.date));
  },

  insights() {
    const out = [];
    const counts = {};
    S.cases.forEach(c => { counts[c.type] = (counts[c.type] || 0) + 1; });
    Object.entries(counts).forEach(([type, n]) => {
      if (n < 2 || type === 'general') return;
      out.push({ id: `type:${type}`, kind: 'pattern', title: `${n} of your cases were ${pb(type).label.toLowerCase()}`, text: 'Not a judgement — just a pattern. A small change upstream could stop the next one before it starts.', type, suggestions: pb(type).prevention });
    });
    const parties = {};
    S.cases.forEach(c => { const k = norm(c.counterparty); if (k) (parties[k] = parties[k] || { name: c.counterparty, n: 0 }).n++; });
    Object.entries(parties).forEach(([k, v]) => { if (v.n >= 2) out.push({ id: `party:${k}`, kind: 'pattern', title: `${v.n} cases involved ${v.name}`, text: 'It may help to keep their contact details, your account numbers and past outcomes together — the next contact will be quicker.' }); });
    const lags = [];
    S.cases.forEach(c => {
      const d = S.deadlines.find(x => x.caseId === c.id && x.kind === 'external' && x.date && x.date < c.createdAt);
      if (d) lags.push(daysBetween(d.date, c.createdAt));
    });
    if (lags.length >= 2) {
      const sorted = [...lags].sort((a, b) => a - b); const med = sorted[Math.floor(sorted.length / 2)];
      if (med >= 4) out.push({ id: 'lag', kind: 'timing', title: `Things tend to reach this app about ${med} days after the original date`, text: 'That’s common and fine. If you’d like more room next time, a reminder a week before due dates is an easy, optional change.' });
    }
    const byApproach = {};
    S.paths.filter(p => ['worked', 'didnt_work'].includes(p.status)).forEach(p => { const a = (byApproach[p.approach] = byApproach[p.approach] || { w: 0, n: 0 }); a.n++; if (p.status === 'worked') a.w++; });
    Object.entries(byApproach).forEach(([a, v]) => out.push({ id: `worked:${a}`, kind: 'track', title: `${APPROACHES[a]}: worked ${v.w} of ${v.n} time${v.n === 1 ? '' : 's'} for you`, text: v.n < 3 ? 'An early pattern from your own cases — useful context, not a prediction.' : 'Your own track record — useful when choosing next time, though every case differs.' }));
    const missedBy = {};
    S.commitments.filter(m => m.party === 'them' && (m.status === 'missed' || (m.status === 'pending' && m.due && daysUntil(m.due) < 0))).forEach(m => { const c = getCase(m.caseId); const k = (c && c.counterparty) || 'The other side'; missedBy[k] = (missedBy[k] || 0) + 1; });
    Object.entries(missedBy).forEach(([k, n]) => out.push({ id: `promises:${norm(k)}`, kind: 'track', title: `${k} missed ${plural(n, 'promised date')}`, text: 'Next time, ask for dates in writing and set your follow-up for the day after.' }));
    return out.filter(i => !S.dismissed.includes(i.id));
  },
};

function buildICS(events) {
  const escI = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const fold = line => { const out = []; let l = line; while (l.length > 73) { out.push(l.slice(0, 73)); l = ' ' + l.slice(73); } out.push(l); return out.join('\r\n'); };
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//After the Fact//Local//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  events.forEach(e => {
    lines.push('BEGIN:VEVENT', `UID:${e.uid}@after-the-fact.local`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${icsDate(e.date)}`, `DTEND;VALUE=DATE:${icsDate(addDays(e.date, 1))}`, fold(`SUMMARY:${escI(e.title)}`));
    if (e.desc) lines.push(fold(`DESCRIPTION:${escI(e.desc)}`));
    if (e.rrule) lines.push(`RRULE:${e.rrule}`);
    if (e.alarmDays !== undefined && e.alarmDays !== null) lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', fold(`DESCRIPTION:${escI(e.title)}`), `TRIGGER:-P${Math.max(0, e.alarmDays)}D`, 'END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n') + '\r\n';
}
const RRULES = { monthly: 'FREQ=MONTHLY', quarterly: 'FREQ=MONTHLY;INTERVAL=3', yearly: 'FREQ=YEARLY', once: '' };

/* ===== 50-comms.js ===== */
/* ---------------- Communication drafting ----------------
   Drafts are assembled from the case: its reference, confirmed facts, earlier
   contacts and promises. Unknowns stay as visible [placeholders] — never
   invented. The person reviews and sends everything themselves. */

const REF_NOUN = { payment: 'my account', appointment: 'my appointment', renewal: 'my renewal', return: 'my order', application: 'my application', notice: 'your notice', penalty: 'citation', billing: 'a charge on my account', owed: 'my claim', general: 'this matter' };
const REF_KIND = { payment: 'account number', appointment: '', renewal: 'reference or PIN', return: 'order number', application: 'application number', notice: 'reference', penalty: 'citation number', billing: 'account number', owed: 'reference number', general: 'reference' };

const Comms = {
  pathDef(caseId, pathId) {
    const c = getCase(caseId); const p = S.paths.find(x => x.id === pathId);
    return c && p ? pb(c.type).paths.find(x => x.key === p.key) || null : null;
  },

  defaults(caseId, { pathId = '', purpose = '', waitId = '', channel = '' } = {}) {
    const c = getCase(caseId);
    const chosen = pathId || (S.paths.find(p => p.caseId === caseId && p.status === 'chosen') || {}).id || '';
    const def = this.pathDef(caseId, chosen);
    const pc = (def && def.comm) || {};
    const o = {
      channel: channel || 'email', purpose: purpose || pc.purpose || (c.type === 'owed' ? 'follow_up' : 'request'),
      stance: pc.stance || (c.type === 'owed' ? 'neutral' : 'acknowledge'), tone: 'warm', proposal: pc.proposal || '', replyBy: '',
      pathId: chosen, includeFacts: true, waitId,
    };
    if (purpose === 'follow_up' || purpose === 'escalate') { o.stance = 'neutral'; o.tone = purpose === 'escalate' ? 'firm' : 'neutral'; }
    if (o.purpose === 'dispute' || o.purpose === 'complaint') o.stance = o.stance === 'neutral' ? 'neutral' : 'dispute';
    return o;
  },

  refPhrase(c) {
    const kind = REF_KIND[c.type];
    return REF_NOUN[c.type] + (kind ? ` (${c.reference || '[' + kind + ']'})` : '');
  },

  priorContact(caseId) {
    const prior = S.comms.filter(m => m.caseId === caseId && m.direction === 'out' && ['sent', 'done'].includes(m.status) && m.date).sort((a, b) => a.date.localeCompare(b.date));
    const promises = S.commitments.filter(m => m.caseId === caseId && m.party === 'them' && ['pending', 'missed'].includes(m.status));
    let line = '';
    if (prior.length) line = `I contacted you on ${listJoin(prior.slice(-3).map(m => `${fmtDate(m.date, { year: true })} (${CHANNELS[m.channel].toLowerCase()}${m.reference ? ', ref ' + m.reference : ''})`))}`;
    if (promises.length) {
      const p = promises[promises.length - 1];
      line += `${line ? '. ' : ''}I was told you would ${p.text.replace(/\.$/, '').replace(/^(you will|you'll|they will|they'll|will)\s+/i, '')}${p.due ? ` by ${fmtDate(p.due, { year: true })}` : ''}`;
      if (p.due && daysUntil(p.due) < 0) line += ', but I haven’t received this yet';
    }
    return { prior, promises, line };
  },

  compose(caseId, o) {
    const c = getCase(caseId);
    const P = pb(c.type); const pc = P.comm;
    const def = this.pathDef(caseId, o.pathId);
    const dc = (def && def.comm) || {};
    const name = '[Your name]';
    const org = c.counterparty || '';
    const kind = REF_KIND[c.type];
    const topic = pc.topic.replace('[reference]', c.reference || '[reference]').replace('[order number]', c.reference || '[order number]').replace('[citation number]', c.reference || '[citation number]');
    const refShort = c.reference ? `${kind ? kind.split(' ')[0] + ' ' : ''}${c.reference}` : truncate(c.title, 50);
    const subj = { request: `Request regarding ${refShort}`, arrangement: `Payment arrangement — ${refShort}`, reschedule: 'Rebooking my appointment', inquiry: `Question about ${refShort}`, update: `Update — ${refShort}`, follow_up: `Follow-up — ${refShort}`, negotiate: `Proposal — ${refShort}`, dispute: `Dispute — ${refShort}`, complaint: `Formal complaint — ${refShort}`, escalate: `Escalation request — ${refShort}` }[o.purpose];
    const prior = this.priorContact(caseId);
    const issue = pc.issue;
    const claim = dc.disputeLine || pc.disputeLine;
    const stanceLine = {
      neutral: '',
      acknowledge: `I’m aware that ${issue}.`,
      apologize: `I’m sorry that ${issue}.`,
      accept: `${cap(issue)}. That was my oversight, and I take responsibility for it.`,
      dispute: `I believe ${claim}${o.reason ? `, because ${o.reason}` : ''}.`,
      negotiate: `I’d like to find a way to resolve ${topic} that works for both of us.`,
    }[o.stance];
    const ask = dc.ask || '[what you are asking for]';
    const proposal = o.proposal || dc.proposal || '';
    const askLine = {
      request: `Would you be able to ${ask}?`,
      arrangement: `Would it be possible to set up a payment arrangement? ${proposal ? `I could pay ${proposal}.` : 'I’d like to agree an amount and schedule I can reliably keep — for example [amount] every [week or month].'}`,
      reschedule: `I’d like to book a new appointment. ${proposal ? `Times that work well for me: ${proposal}.` : 'I’m generally available [days and times].'}`,
      inquiry: `Could you tell me ${pc.inquiry}?`,
      update: `I wanted to let you know that ${proposal || '[what you have done, or will do and when]'}. Please let me know if you need anything else from me.`,
      follow_up: `${prior.line ? prior.line + '.' : 'I’m following up on my earlier contact about this.'} Could you let me know where things stand, and confirm the date I can expect it to be completed?`,
      negotiate: `I’d like to propose ${proposal || '[your proposal]'}. Would that work for you?`,
      dispute: `Please review this and correct it${o.tone === 'warm' ? ' if you agree' : ''}. I’d be grateful for written confirmation of the outcome.`,
      complaint: `I’d like to make a formal complaint about ${topic}. ${prior.line ? prior.line + '. ' : ''}Please confirm you’ve received this, and let me know your complaints process and when I can expect a response.`,
      escalate: `${prior.line ? prior.line + '. ' : 'I’ve raised this before. '}As it hasn’t been resolved, I’d like to escalate it — could you pass this to a supervisor or your complaints team?`,
    }[o.purpose];
    const facts = o.includeFacts ? S.facts.filter(f => f.caseId === caseId && f.kind === 'confirmed' && f.text).slice(0, 6) : [];
    const factsBlock = facts.length ? `For reference:\n${facts.map(f => '• ' + f.text).join('\n')}` : '';
    const close = { warm: 'Thank you so much for your help — I really appreciate it.', neutral: 'Thank you for your help.', firm: `Please reply by ${o.replyBy ? fmtDate(o.replyBy, { year: true }) : '[date]'}.` }[o.tone];
    let body;
    if (o.channel === 'call') {
      body = [
        `Hi, my name is ${name}, and I’m calling about ${this.refPhrase(c)}.`,
        stanceLine, askLine,
        factsBlock ? `(If asked — ${facts.map(f => f.text).join('; ')}.)` : '',
        o.tone === 'firm' ? 'I’d like to get this resolved today if possible.' : close,
        '— Before you hang up: ask for their name, a reference number for this call, and what happens next and by when.',
      ].filter(Boolean).join('\n\n');
    } else {
      const greet = o.tone === 'firm' ? `Dear ${org || 'Sir or Madam'},` : `Hello${org ? ' ' + org + ' team' : ''},`;
      const signoff = o.tone === 'firm' ? (o.channel === 'letter' ? 'Yours sincerely,' : 'Regards,') : (o.tone === 'warm' ? 'Many thanks,' : 'Kind regards,');
      const core = [greet, `I’m writing about ${this.refPhrase(c)}.`, stanceLine, askLine, factsBlock, o.tone === 'firm' ? `${close} Thank you.` : close, `${signoff}\n${name}`].filter(Boolean).join('\n\n');
      body = o.channel === 'letter' ? `${name}\n[Your address]\n\n${fmtDate(today(), { year: true })}\n\n${org || '[Organization]'}\n[Their address]\n\nRe: ${subj}\n\n${core}` : core;
    }
    return { subject: o.channel === 'call' ? `Call — ${subj}` : subj, body: body.replace(/\n{3,}/g, '\n\n') };
  },

  preflight(caseId, text, o) {
    const out = [];
    const ph = [...new Set((text.match(/\[[^\]\n]{1,60}\]/g) || []))];
    if (ph.length) out.push({ level: 'warn', text: `${plural(ph.length, 'placeholder')} to fill before sending: ${ph.slice(0, 5).join(', ')}${ph.length > 5 ? '…' : ''}` });
    const chosen = S.paths.find(p => p.caseId === caseId && p.status === 'chosen');
    const disputing = o.purpose === 'dispute' || o.purpose === 'complaint' || (chosen && ['dispute', 'appeal'].includes(chosen.approach));
    if (disputing && ['apologize', 'accept'].includes(o.stance)) out.push({ level: 'warn', text: 'You’re disputing this. Apologising or taking responsibility in the same message can undermine your position.' });
    if (o.stance === 'dispute' && ['request', 'arrangement'].includes(o.purpose)) out.push({ level: 'info', text: 'Disputing the charge while asking for a courtesy can send mixed signals. Consider keeping them in separate messages.' });
    if (o.stance === 'accept') out.push({ level: 'info', text: 'Taking responsibility is a meaningful statement, and a written one can be quoted later. Make sure it’s what you intend.' });
    const confirmedText = S.facts.filter(f => f.caseId === caseId && f.kind === 'confirmed').map(f => f.text).join(' ');
    const amounts = [...new Set(text.match(/[$£€]\s?\d[\d,]*(\.\d{1,2})?/g) || [])].filter(a => !confirmedText.includes(a.replace(/\s/g, '')));
    if (amounts.length) out.push({ level: 'warn', text: `Mentions ${listJoin(amounts)}, which you haven’t marked as confirmed. Check it against a statement before sending.` });
    const unverified = S.facts.filter(f => f.caseId === caseId && ['unverified', 'assumption'].includes(f.kind) && f.text && text.includes(f.text));
    if (unverified.length) out.push({ level: 'warn', text: `Includes ${plural(unverified.length, 'detail')} you haven’t confirmed yet.` });
    const missing = S.facts.filter(f => f.caseId === caseId && f.kind === 'missing');
    if (missing.length) out.push({ level: 'info', text: `${plural(missing.length, 'detail')} still unknown (e.g. “${truncate(missing[0].text, 60)}”). You may be asked — or you can ask them.` });
    if (o.purpose === 'follow_up' && !this.priorContact(caseId).prior.length) out.push({ level: 'info', text: 'No earlier contact is logged for this case, so the draft refers to “my earlier contact”. Adjust if needed.' });
    return out;
  },

  callPlan(caseId, o) {
    const c = getCase(caseId);
    const kind = REF_KIND[c.type];
    const checklist = [];
    if (kind) checklist.push(c.reference ? `Your ${kind}: ${c.reference}` : `Your ${kind}`);
    S.docs.filter(d => d.caseId === caseId && d.status !== 'sent').slice(0, 4).forEach(d => checklist.push(d.name));
    checklist.push('Somewhere to take notes (the call notes here work)');
    if (['reschedule', 'arrangement', 'negotiate'].includes(o.purpose)) checklist.push('Your calendar and what you can commit to');
    const questions = S.facts.filter(f => f.caseId === caseId && f.kind === 'missing').slice(0, 4).map(f => `Can you confirm: ${f.text.charAt(0).toLowerCase() + f.text.slice(1)}?`);
    const extra = {
      request: 'If that isn’t possible, is there anything else you can do?',
      arrangement: 'Will fees or interest continue during the arrangement?',
      dispute: 'How long will the review take, and is collection paused meanwhile?',
      follow_up: 'What exactly is causing the delay?',
      escalate: 'Who will own this now, and when will I hear back?',
      reschedule: 'Can you send a reminder before the new appointment?',
    }[o.purpose];
    if (extra) questions.push(extra);
    questions.push('What happens next, and by when?', 'Can I have a reference number for this call?', 'Could you confirm that in writing?');
    return { checklist, questions };
  },
};

/* ===== 60-store.js ===== */
/* ---------------- Live state, persistence and operations ---------------- */
let S = null;
const Runtime = { saveBlocked: false, saveError: '', corruptKey: '', corruptRaw: '', newerSchema: false, notices: [], idbOk: false, firstRun: false };

const getCase = id => (S ? S.cases.find(c => c.id === id) || null : null);
const isClosed = c => !!(c && RES_STATES[c.resolution.state].closed);
const byCase = (coll, caseId) => S[coll].filter(r => r.caseId === caseId);
const findRec = (coll, id) => S[coll].find(r => r.id === id) || null;

async function loadState() {
  const notices = [];
  if (!LocalStore.available) {
    notices.push({ level: 'warn', key: 'nostorage', text: 'This browser isn’t allowing the app to save (private browsing or blocked storage). Everything works, but changes will be lost when this tab closes — export a backup to keep your work.' });
    return { state: emptyState(), firstRun: true, notices };
  }
  const raw = LocalStore.get(APP.lsKey);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (Number(parsed.schema) > APP.schema) {
        Runtime.saveBlocked = true; Runtime.newerSchema = true;
        notices.push({ level: 'alert', key: 'newer', text: 'This data was saved by a newer version of AFTER THE FACT. To avoid losing anything, this version won’t save changes. Export a backup or open the newer version.' });
      }
      const { state, report } = normalizeState(parsed);
      if (report.dropped) notices.push({ level: 'info', key: 'repair', text: `Some saved records were incomplete and were set aside while loading (${report.dropped}). A safety snapshot of the previous data is kept in Data & privacy.` });
      if (report.dropped) await Snapshots.take('Before repairing saved data', raw);
      return { state, firstRun: false, notices };
    } catch (e) {
      const key = `${APP.lsKey}_unreadable_${Date.now()}`;
      const kept = LocalStore.set(key, raw);
      Runtime.corruptKey = kept.ok ? key : '';
      if (!kept.ok) { Runtime.saveBlocked = true; Runtime.corruptRaw = raw; }
      const snaps = await Snapshots.list();
      for (const snap of snaps) {
        try {
          const { state } = normalizeState(JSON.parse(snap.json));
          notices.push({ level: 'alert', key: 'corrupt', text: `Your saved data couldn’t be read, so the most recent safety snapshot (${fmtStamp(snap.at)}) was restored. The unreadable data was kept aside untouched — you can download it in Data & privacy.` });
          return { state, firstRun: false, notices };
        } catch (e2) { /* try the next one */ }
      }
      notices.push({ level: 'alert', key: 'corrupt', text: 'Your saved data couldn’t be read. It has been kept aside untouched (download it from Data & privacy), and you’re starting with an empty workspace.' });
      return { state: emptyState(), firstRun: false, notices };
    }
  }
  const v1raw = LocalStore.get(APP.lsV1);
  if (v1raw) {
    try {
      const v1 = JSON.parse(v1raw);
      if (looksLikeV1(v1)) {
        await Snapshots.take('Version 1 data, before upgrading', v1raw);
        const { state: migrated, pendingFiles } = migrateV1(v1);
        const { state } = normalizeState(migrated);
        let failed = 0;
        for (const f of pendingFiles) {
          const ev = state.evidence.find(e => e.file && e.file.blobId === f.blobId);
          try {
            const blob = dataUrlToBlob(f.dataUrl);
            if (!blob) throw new Error('bad data');
            const sha = await sha256Hex(await blob.arrayBuffer());
            await IDB.putBlob(f.blobId, { blob, name: f.name, mime: f.mime || blob.type, size: blob.size });
            if (ev) { ev.file.size = blob.size; ev.file.sha256 = sha; }
          } catch (e) {
            failed++;
            if (ev) { ev.file = null; ev.note += '\nThe original file couldn’t be moved to the new file store. It is still inside your version-1 data, which hasn’t been changed.'; }
          }
        }
        notices.push({ level: 'ok', key: 'migrated', text: `Your data was upgraded to the new case format (${plural(state.cases.length, 'case')}). Nothing was deleted: your original version-1 data is untouched and a snapshot was saved.${failed ? ` ${plural(failed, 'attached file')} couldn’t be moved and ${failed === 1 ? 'remains' : 'remain'} in the version-1 data.` : ''}` });
        return { state, firstRun: false, notices, dirty: true };
      }
    } catch (e) {
      notices.push({ level: 'warn', key: 'v1bad', text: 'Older (version 1) data was found but couldn’t be read. It has been left untouched.' });
    }
  }
  return { state: emptyState(), firstRun: true, notices };
}

function saveState() {
  if (Runtime.saveBlocked) return false;
  S.meta.updatedAt = nowStamp();
  const r = LocalStore.set(APP.lsKey, JSON.stringify(S));
  if (!r.ok) {
    Runtime.saveError = r.reason === 'unavailable' ? '' : r.reason === 'quota'
      ? 'Your browser’s storage is full, so the latest change couldn’t be saved. Export a backup now, then free space (empty the trash or remove old snapshots).'
      : 'The latest change couldn’t be saved. Export a backup to be safe.';
    if (typeof UI !== 'undefined') UI.renderBanners();
    return false;
  }
  if (Runtime.saveError) { Runtime.saveError = ''; if (typeof UI !== 'undefined') UI.renderBanners(); }
  return true;
}

function commit(fn, { caseId = '', render = true } = {}) {
  const out = fn(S);
  if (caseId) { const c = getCase(caseId); if (c) c.updatedAt = nowStamp(); }
  saveState();
  if (render) UI.render();
  return out;
}

function logEvent(caseId, type, text, manual = false) {
  S.events.push({ id: uid('evt'), caseId, at: nowStamp(), type, text: String(text).slice(0, 2000), manual });
}

/* ---------- Trash: nothing is destroyed silently ---------- */
function trashPush(label, items, refs = [], evLinks = []) {
  const t = { id: uid('trash'), at: nowStamp(), label, items, refs, evLinks };
  S.trash.unshift(t);
  S.trash.splice(APP.maxTrash).forEach(old => purgeTrashBlobs(old));
  return t.id;
}
async function purgeTrashBlobs(t) {
  for (const e of T.arr(t.items && t.items.evidence)) {
    if (e && e.file && e.file.blobId && !S.evidence.some(x => x.file && x.file.blobId === e.file.blobId)) {
      try { await IDB.delBlob(e.file.blobId); } catch (err) { /* ignore */ }
    }
  }
}
function deleteRecord(coll, id, label) {
  const rec = findRec(coll, id);
  if (!rec) return null;
  S[coll] = S[coll].filter(r => r.id !== id);
  const refs = [];
  for (const [rc, field, kind] of REFS[coll] || []) {
    S[rc].forEach(r => {
      if (kind === 'arr' && r[field].includes(id)) { r[field] = r[field].filter(x => x !== id); refs.push({ coll: rc, id: r.id, field, kind, value: id }); }
      else if (kind === 'one' && r[field] === id) { r[field] = ''; refs.push({ coll: rc, id: r.id, field, kind, value: id }); }
    });
  }
  const evLinks = [];
  if (LINKABLE[coll]) S.evidence.forEach(e => { const n = e.links.length; e.links = e.links.filter(l => !(l.t === coll && l.id === id)); if (e.links.length !== n) evLinks.push({ evId: e.id, t: coll, id }); });
  if (rec.caseId) logEvent(rec.caseId, 'removed', `Removed: ${label}`);
  return trashPush(label, { [coll]: [rec] }, refs, evLinks);
}
function deleteCaseBundle(caseId) {
  const c = getCase(caseId);
  if (!c) return null;
  const items = { cases: [c] };
  for (const coll of COLLECTIONS) {
    if (['cases', 'links', 'obligations'].includes(coll)) continue;
    const mine = S[coll].filter(r => r.caseId === caseId);
    if (mine.length) { items[coll] = mine; S[coll] = S[coll].filter(r => r.caseId !== caseId); }
  }
  const links = S.links.filter(l => l.from === caseId || l.to === caseId);
  if (links.length) { items.links = links; S.links = S.links.filter(l => !links.includes(l)); }
  S.cases = S.cases.filter(x => x.id !== caseId);
  const refs = [];
  S.tasks.forEach(t => { if (t.caseDep === caseId) { t.caseDep = ''; refs.push({ coll: 'tasks', id: t.id, field: 'caseDep', kind: 'one', value: caseId }); } });
  return trashPush(`Case: ${c.title}`, items, refs, []);
}
function restoreTrash(trashId) {
  const t = S.trash.find(x => x.id === trashId);
  if (!t) return { ok: false, restored: 0, skipped: 0 };
  let restored = 0; let skipped = 0;
  for (const coll of COLLECTIONS) {
    for (const raw of T.arr(t.items[coll])) {
      if (!raw || typeof raw !== 'object') { skipped++; continue; }
      const rec = Normalize[coll](raw);
      const exists = S[coll].some(r => r.id === rec.id);
      const orphan = coll === 'links' ? !(getCase(rec.from) && getCase(rec.to)) : ('caseId' in rec && coll !== 'evidence' && !getCase(rec.caseId));
      if (exists || orphan) { skipped++; continue; }
      if (coll === 'evidence' && rec.caseId && !getCase(rec.caseId)) rec.caseId = '';
      S[coll].push(rec); restored++;
    }
  }
  for (const r of T.arr(t.refs)) {
    const target = r && S[r.coll] ? findRec(r.coll, r.id) : null;
    const valueExists = r && (r.field === 'caseDep' ? getCase(r.value) : Object.keys(REFS).some(c => findRec(c, r.value)));
    if (!target || !valueExists) continue;
    if (r.kind === 'arr') { if (!target[r.field].includes(r.value)) target[r.field].push(r.value); } else if (!target[r.field]) target[r.field] = r.value;
  }
  for (const l of T.arr(t.evLinks)) { const e = l && findRec('evidence', l.evId); if (e && findRec(l.t, l.id) && !e.links.some(x => x.t === l.t && x.id === l.id)) e.links.push({ t: l.t, id: l.id }); }
  S.trash = S.trash.filter(x => x.id !== trashId);
  const caseRec = T.arr(t.items.cases)[0];
  const cid = caseRec ? caseRec.id : (Object.values(t.items).flat().find(r => r && r.caseId) || {}).caseId;
  if (cid && getCase(cid)) logEvent(cid, 'restored', `Restored from trash: ${t.label}`);
  return { ok: true, restored, skipped };
}

/* ---------- Domain operations ---------- */
const Ops = {
  insertBundle(bundle) { for (const [coll, items] of Object.entries(bundle)) S[coll].push(...items.map(r => Normalize[coll](r))); },

  createCase(draft, opts) {
    const { caseId, bundle } = Engine.materialize(draft, opts);
    this.insertBundle(bundle);
    if (S.settings.region && !opts.jurisdiction) getCase(caseId).jurisdiction = S.settings.region;
    return caseId;
  },

  answer(caseId, qid, value) {
    const c = getCase(caseId); const P = pb(c.type);
    const q = P.questions.find(x => x.id === qid); if (!q) return { added: [] };
    const before = Engine.rankPaths(caseId).find(x => x.best);
    c.answers[qid] = value; c.answerSource[qid] = 'you';
    const added = []; const upgraded = [];
    for (const nc of Engine.consequencesFor(c.type, c.answers)) {
      const ex = S.consequences.find(x => x.caseId === caseId && x.key === nc.key);
      if (!ex) { S.consequences.push(Normalize.consequences({ id: uid('csq'), caseId, ...nc })); added.push(nc.text); }
      else {
        if (nc.status === 'established' && ex.status === 'potential') { ex.status = 'established'; upgraded.push(ex.text); }
        if (ex.text === nc.text && ex.severity !== nc.severity) ex.severity = nc.severity;
      }
    }
    const opt = q.opts.find(o => o[0] === value);
    logEvent(caseId, 'understanding', `${q.q} → ${opt ? opt[1] : value}`);
    const after = Engine.rankPaths(caseId).find(x => x.best);
    return { added, upgraded, newBest: after && (!before || before.path.id !== after.path.id) ? after.path.title : '' };
  },

  choosePath(pathId) {
    const p = findRec('paths', pathId); const c = getCase(p.caseId);
    S.paths.forEach(x => { if (x.caseId === p.caseId && x.status === 'chosen' && x.id !== pathId) x.status = 'considering'; });
    p.status = 'chosen';
    let addedTasks = 0;
    if (!S.tasks.some(t => t.pathId === p.id)) {
      const start = Math.max(-1, ...byCase('tasks', p.caseId).map(t => t.order)) + 1;
      const ts = Engine.tasksForPath(p.caseId, p, start, c.type);
      S.tasks.push(...ts.map(Normalize.tasks)); addedTasks = ts.length;
    }
    logEvent(p.caseId, 'path', `Chose an approach: ${p.title}${addedTasks ? ` (${plural(addedTasks, 'step')} added to the plan)` : ''}`);
    return addedTasks;
  },

  setPathStatus(pathId, status, note) {
    const p = findRec('paths', pathId);
    p.status = status; if (note !== undefined) p.note = note;
    logEvent(p.caseId, 'path', `${p.title}: ${PATH_STATUS[status].toLowerCase()}${note ? ` — ${note}` : ''}`);
  },

  toggleTask(taskId) {
    const t = findRec('tasks', taskId);
    t.done = !t.done; t.doneAt = t.done ? nowStamp() : '';
    logEvent(t.caseId, 'task', `${t.done ? 'Done' : 'Reopened'}: ${t.text}`);
    return t.done;
  },

  setResolution(caseId, state, extra = {}) {
    const c = getCase(caseId);
    const prev = c.resolution.state;
    c.resolution.state = state;
    if (extra.note !== undefined) c.resolution.note = extra.note;
    if (extra.condition !== undefined) c.resolution.condition = extra.condition;
    if (extra.monitorUntil !== undefined) c.resolution.monitorUntil = extra.monitorUntil;
    c.resolution.closedAt = RES_STATES[state].closed ? (c.resolution.closedAt && RES_STATES[prev].closed ? c.resolution.closedAt : today()) : '';
    if (RES_STATES[state].closed) c.parkedUntil = '';
    const detail = [extra.condition && `condition: ${extra.condition}`, extra.monitorUntil && `watch until ${fmtDate(extra.monitorUntil)}`, extra.note].filter(Boolean).join(' · ');
    logEvent(caseId, 'resolution', `Status: ${RES_STATES[state].label}${detail ? ' — ' + detail : ''}`);
  },

  receiveWait(waitId, outcome, date) {
    const w = findRec('waits', waitId);
    w.status = 'received'; w.receivedAt = date || today(); w.outcome = outcome || '';
    w.log.push({ id: uid('wl'), date: w.receivedAt, note: `Received${outcome ? ': ' + outcome : ''}` });
    if (w.commitmentId) { const m = findRec('commitments', w.commitmentId); if (m && m.status === 'pending') m.status = 'kept'; }
    logEvent(w.caseId, 'wait', `Received: ${w.what}${outcome ? ' — ' + outcome : ''}`);
  },

  addCommitment(caseId, { party, text, due, commId = '', waitKind = '' }) {
    const m = Normalize.commitments({ id: uid('cmt'), caseId, party, text, due, commId, status: 'pending' });
    S.commitments.push(m);
    if (party === 'them' && waitKind) {
      const c = getCase(caseId);
      const w = Normalize.waits({ id: uid('wait'), caseId, kind: waitKind, what: text, from: c.counterparty, since: today(), expectedBy: due, basis: due ? 'promised' : 'estimate', followUpOn: due ? addDays(due, 1) : offset(7), commitmentId: m.id, log: [{ date: today(), note: `They committed: ${text}${due ? ' by ' + fmtDate(due) : ''}` }] });
      S.waits.push(w); m.waitId = w.id;
    }
    logEvent(caseId, 'commitment', `${party === 'me' ? 'You committed' : 'They committed'}: ${text}${due ? ` (by ${fmtDate(due)})` : ''}`);
    return m;
  },

  async addEvidence(caseId, data, file) {
    const ev = Normalize.evidence({ id: uid('ev'), caseId, ...data, file: null });
    if (file) {
      if (file.size > APP.maxFileBytes) throw new Error(`That file is ${fmtBytes(file.size)}. The limit is ${fmtBytes(APP.maxFileBytes)} — try a smaller export or a photo instead.`);
      const buf = await readFileAs(file, 'buffer');
      const sha = await sha256Hex(buf);
      const blobId = uid('blob');
      const blob = new Blob([buf], { type: file.type || 'application/octet-stream' });
      await IDB.putBlob(blobId, { blob, name: file.name, mime: file.type, size: file.size });
      ev.file = { blobId, name: file.name.slice(0, 200), mime: file.type || '', size: file.size, sha256: sha };
    }
    return ev;
  },
};

const CHANNEL_ICON = { call: 'phone', email: 'mail', letter: 'letter', message: 'message', in_person: 'person' };

/* Ephemeral UI state (not saved) */

const Router = {
  parse() {
    const h = location.hash.replace(/^#\/?/, '');
    const [path, q] = h.split('?');
    const parts = path.split('/').filter(Boolean).map(p => { try { return decodeURIComponent(p); } catch (e) { return p; } });
    return { name: parts[0] || 'today', parts, query: new URLSearchParams(q || ''), key: path };
  },
  go(path) {
    const target = '#/' + path;
    if (location.hash === target) UI.render(); else location.hash = target;
  },
};
const href = (...parts) => '#/' + parts.map(p => encodeURIComponent(p)).join('/');

const NAV = [
  { id: 'today', label: 'Today', icon: 'today' },
  { id: 'cases', label: 'Cases', icon: 'cases' },
  { id: 'waiting', label: 'Waiting', icon: 'waiting' },
  { id: 'dates', label: 'Dates', icon: 'dates' },
  { id: 'evidence', label: 'Evidence', icon: 'evidence' },
  { id: 'insights', label: 'Insights', icon: 'insights' },
  { id: 'data', label: 'Data & privacy', icon: 'data' },
];

const UI = {
  lastKey: null,
  after: [],
  render({ scrollTop = false } = {}) {
    if (!S) return;
    const route = Router.parse();
    const ae = document.activeElement;
    const fk = ae && ae.dataset ? ae.dataset.fk : null;
    const sel = fk && typeof ae.selectionStart === 'number' ? [ae.selectionStart, ae.selectionEnd] : null;
    const same = this.lastKey === route.key;
    const y = window.scrollY;
    const view = Views[route.name] || Views.notFound;
    let html;
    try { html = view(route); } catch (e) { console.error(e); html = Views.error(e); }
    const host = document.getElementById('view');
    host.innerHTML = html;
    if (!same) { host.classList.remove('view-in'); void host.offsetWidth; host.classList.add('view-in'); }
    this.renderNav(route);
    this.renderBanners();
    if (fk) {
      const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
      if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ } } }
    }
    if (!same || scrollTop) {
      window.scrollTo(0, 0);
      if (this.lastKey !== null && !fk) document.getElementById('main').focus({ preventScroll: true });
    } else window.scrollTo(0, y);
    this.lastKey = route.key;
    const h1 = host.querySelector('h1');
    document.title = `${h1 ? h1.textContent.trim() + ' · ' : ''}AFTER THE FACT`;
    const hooks = this.after; this.after = [];
    hooks.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
  },

  renderNav(route) {
    const active = route.name === 'case' ? 'cases' : route.name === 'new' ? 'cases' : route.name === 'focus' ? 'today' : route.name;
    const openCases = S.cases.filter(c => !isClosed(c)).length;
    const attention = Engine.openWaits().filter(w => ['missed', 'follow', 'overdue'].includes(Engine.waitState(w).key)).length;
    const counts = { cases: openCases ? `<span class="count">${openCases}</span>` : '', waiting: attention ? `<span class="count hot" title="Need attention">${attention}</span>` : '' };
    document.getElementById('rail-nav').innerHTML = NAV.map((n, i) => `${i === 5 ? '<div class="rail-sep" role="separator"></div>' : ''}<a class="rail-link" href="${href(n.id)}" ${active === n.id ? 'aria-current="page"' : ''}><span class="lbl">${ico(n.icon)}${n.label}</span>${counts[n.id] || ''}</a>`).join('')
      + `<div class="rail-sep" role="separator"></div><a class="rail-link" href="#/new"><span class="lbl">${ico('plus')}New case</span></a>`;
    const moreActive = ['dates', 'evidence', 'insights', 'data'].includes(active);
    document.getElementById('bottom-nav').innerHTML = [
      `<a class="bn-item" href="#/today" ${active === 'today' ? 'aria-current="page"' : ''}>${ico('today')}<span>Today</span></a>`,
      `<a class="bn-item" href="#/cases" ${active === 'cases' ? 'aria-current="page"' : ''}>${ico('cases')}<span>Cases</span></a>`,
      `<a class="bn-item bn-new" href="#/new" aria-label="New case"><span class="bn-plus">${ICON.plus}</span><span class="lbl">New</span></a>`,
      `<a class="bn-item" href="#/waiting" ${active === 'waiting' ? 'aria-current="page"' : ''}>${ico('waiting')}<span>Waiting</span>${attention ? '<i class="dot" aria-label="needs attention"></i>' : ''}</a>`,
      `<button type="button" class="bn-item" data-act="more-sheet" ${moreActive ? 'aria-current="page"' : ''} aria-haspopup="dialog">${ico('more')}<span>More</span></button>`,
    ].join('');
  },

  renderBanners() {
    const out = [];
    const route = Router.parse();
    if (Runtime.saveError) out.push(banner('alert', esc(Runtime.saveError), `<a class="btn btn-sm" href="#/data">Back up now</a>`));
    if (!LocalStore.available) out.push(banner('warn', 'Saving is unavailable in this browser session. Your work lasts until the tab closes.', '<a class="btn btn-sm" href="#/data">Export</a>'));
    for (const n of Runtime.notices) {
      if (UIState.dismissedNotices.has(n.key)) continue;
      out.push(banner(n.level, esc(n.text), `${n.key === 'corrupt' && Runtime.corruptKey ? '<button class="btn btn-sm" data-act="download-corrupt">Download unreadable data</button>' : ''}<button class="btn btn-sm btn-ghost" data-act="dismiss-notice" data-key="${esc(n.key)}">Dismiss</button>`));
    }
    if (S && S.cases.some(c => c.sample) && route.name !== 'data') out.push(banner('info', 'You’re exploring example cases. They show how the app works with realistic situations.', `<button class="btn btn-sm" data-act="remove-samples">Remove examples</button>`));
    document.getElementById('banners').innerHTML = out.join('');
  },

  toast(msg, tone = '', action = null) {
    const host = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = `toast ${tone}`;
    el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
    if (action) el.querySelector('button').addEventListener('click', () => { action.fn(); el.remove(); });
    host.appendChild(el);
    while (host.children.length > 3) host.firstChild.remove();
    setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, action ? 8000 : 4200);
  },
};

function banner(level, html, actions = '') {
  return `<div class="banner ${level}" role="${level === 'alert' ? 'alert' : 'status'}"><div class="grow"><p>${html}</p>${actions ? `<div class="cluster">${actions}</div>` : ''}</div></div>`;
}

/* ---------- Dialogs: accessible, stackable, mobile sheets ---------- */
const Dialog = {
  stack: [],
  open({ title, sub = '', body = '', foot = '', size = '', onSubmit = null, onClose = null, onOpen = null }) {
    const host = document.getElementById('dlg-host');
    const wrap = document.createElement('div');
    wrap.className = 'dlg-root';
    const tid = uid('dt');
    wrap.innerHTML = `<div class="dlg-backdrop" data-dlg-close></div><form class="dlg ${size}" role="dialog" aria-modal="true" aria-labelledby="${tid}" novalidate>
      <div class="dlg-grip" aria-hidden="true"></div>
      <div class="dlg-head"><div class="grow"><h2 class="dlg-title" id="${tid}">${esc(title)}</h2>${sub ? `<p class="dlg-sub">${sub}</p>` : ''}</div><button type="button" class="icon-btn" data-dlg-close aria-label="Close">${ICON.close}</button></div>
      <div class="dlg-body">${body}</div>${foot ? `<div class="dlg-foot">${foot}</div>` : ''}</form>`;
    host.appendChild(wrap);
    const formEl = wrap.querySelector('form');
    const rec = { wrap, form: formEl, prevFocus: document.activeElement, onClose };
    this.stack.push(rec);
    document.body.classList.add('no-scroll');
    formEl.addEventListener('submit', async e => {
      e.preventDefault();
      if (!onSubmit) return;
      const invalid = [...formEl.querySelectorAll('[required]')].find(f => !String(f.value || '').trim());
      if (invalid) { invalid.focus(); UI.toast('Please fill in the required field.', 'warn'); return; }
      const btns = [...formEl.querySelectorAll('button[type=submit]')];
      btns.forEach(b => { b.disabled = true; });
      try { const r = await onSubmit(new FormData(formEl), formEl, e.submitter); if (r !== false) this.close(rec); }
      catch (err) { console.error(err); UI.toast(err && err.message ? err.message : 'Something went wrong.', 'warn'); }
      finally { btns.forEach(b => { b.disabled = false; }); }
    });
    wrap.addEventListener('click', e => {
      const el = e.target.closest('[data-dlg-close]');
      if (!el) return;
      const link = el.tagName === 'A' ? el.getAttribute('href') : '';
      if (!el.dataset.act) e.preventDefault();
      this.close(rec);
      if (link && link.startsWith('#')) { e.preventDefault(); location.hash = link; }
    });
    if (onOpen) onOpen(formEl, rec);
    setTimeout(() => {
      if (!document.contains(formEl) || formEl.contains(document.activeElement)) return; // never steal focus from someone already typing
      const f = formEl.querySelector('[autofocus]') || formEl.querySelector('.dlg-body input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([type=file]), .dlg-body textarea, .dlg-body select');
      (f || formEl.querySelector('.dlg-head .icon-btn')).focus({ preventScroll: true });
    }, 40);
    return rec;
  },
  close(rec = this.stack[this.stack.length - 1]) {
    if (!rec) return;
    rec.wrap.remove();
    this.stack = this.stack.filter(r => r !== rec);
    if (rec.onClose) rec.onClose();
    if (!this.stack.length) { document.body.classList.remove('no-scroll'); if (this.onEmpty) this.onEmpty(); }
    if (rec.prevFocus && document.contains(rec.prevFocus)) rec.prevFocus.focus({ preventScroll: true });
  },
  closeAll() { while (this.stack.length) this.close(); },
  top() { return this.stack[this.stack.length - 1] || null; },
};

function confirmDialog({ title, text, ok = 'Confirm', danger = false, cancel = 'Cancel' }) {
  return new Promise(resolve => {
    let done = false;
    Dialog.open({
      title, body: `<p class="ink2">${text}</p>`,
      foot: `<button type="button" class="btn" data-dlg-close>${esc(cancel)}</button><button type="submit" class="btn ${danger ? 'btn-primary' : 'btn-ink'}">${esc(ok)}</button>`,
      onSubmit: () => { done = true; resolve(true); },
      onClose: () => { if (!done) resolve(false); },
    });
  });
}

/* ---------- Small render helpers ---------- */
const pill = (text, tone = '', dot = false) => `<span class="pill ${tone}">${dot ? '<i class="pdot"></i>' : ''}${esc(text)}</span>`;
const empty = (title, text, actions = '') => `<div class="empty"><p class="h3">${esc(title)}</p><p>${text}</p>${actions ? `<div class="cluster">${actions}</div>` : ''}</div>`;
const whyList = (reasons, max = 3) => (reasons && reasons.length ? `<div class="why">${reasons.slice(0, max).map(r => `<span class="why-item ${r.hot ? 'hot' : ''}">${esc(r.text)}</span>`).join('')}</div>` : '');
const statusPill = caseId => { const s = Engine.caseStatus(caseId); return pill(s.label, s.tone, true); };
const certaintyPill = c => pill(CERTAINTY[c] || c, c === 'confirmed' ? 'sage' : c === 'estimated' ? 'amber' : 'line');
const field = (label, input, hint = '', id = '') => `<label class="field" ${id ? `for="${id}"` : ''}><span class="label">${label}</span>${input}${hint ? `<span class="hint">${hint}</span>` : ''}</label>`;
const inputEl = (name, value = '', attrs = '') => `<input class="input" name="${name}" value="${esc(value)}" ${attrs}>`;
const textareaEl = (name, value = '', attrs = '') => `<textarea class="textarea" name="${name}" ${attrs}>${esc(value)}</textarea>`;
const selectEl = (name, options, value, attrs = '') => `<select class="select" name="${name}" ${attrs}>${options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
const segEl = (name, options, value, legend) => `<fieldset class="field"><legend class="label">${legend}</legend><div class="seg">${options.map(([v, l]) => `<label><input type="radio" name="${name}" value="${esc(v)}" ${v === value ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div></fieldset>`;
const entriesOf = obj => Object.entries(obj).map(([k, v]) => [k, typeof v === 'string' ? v : v.label]);
const caseTitle = id => { const c = getCase(id); return c ? c.title : 'Unknown case'; };
const caseLinkEl = (id, cls = 'linkish plain') => `<a class="${cls}" href="${href('case', id)}">${esc(caseTitle(id))}</a>`;

/* ===== Today ===== */
Views.today = () => {
  if (!S.cases.length) return welcomeView();
  const pri = Engine.prioritized();
  const active = pri.filter(p => !p.parked);
  const actionable = active.filter(p => p.actionable);
  const top = actionable[0];
  const attention = actionable.slice(1).filter(p => p.reasons.some(r => r.hot) || p.score >= 4).slice(0, 2);
  const shown = new Set([top, ...attention].filter(Boolean).map(p => p.caseId));
  const rest = active.filter(p => !shown.has(p.caseId));
  const parked = pri.filter(p => p.parked);
  const waits = Engine.openWaits();
  const wNeeds = waits.map(w => ({ w, st: Engine.waitState(w) })).filter(x => ['missed', 'follow', 'overdue'].includes(x.st.key)).sort((a, b) => a.st.rank - b.st.rank);
  const soon = Engine.agenda().filter(i => { const n = daysUntil(i.date); return n >= 0 && n <= 7 && i.kind !== 'parked'; }).slice(0, 5);
  const restSoon = rest.some(p => S.deadlines.some(d => d.caseId === p.caseId && d.kind === 'external' && d.status === 'open' && daysUntil(d.date) >= 0 && daysUntil(d.date) <= 7));
  const openN = active.length;
  const lede = openN ? `${plural(openN, 'open case')}${waits.length ? ` · ${waits.length} in someone else’s court` : ''}${parked.length ? ` · ${parked.length} parked` : ''}.` : 'Every case is closed, parked or waiting.';

  let focal = '';
  if (top) {
    const c = getCase(top.caseId); const st = top.step;
    const btns = [];
    if (st.kind === 'task') {
      btns.push(`<button class="btn btn-sage" data-act="toggle-task" data-id="${esc(st.task.id)}">${ico('check', 'sm')}Mark done</button>`);
      btns.push(`<a class="btn" href="${href('case', c.id)}">Open case</a>`);
    } else if (st.kind === 'choose') btns.push(`<a class="btn btn-ink" href="${href('case', c.id, 'options')}">Compare options</a>`);
    else if (st.kind === 'followup') { btns.push(`<button class="btn btn-ink" data-act="compose" data-case="${esc(c.id)}" data-purpose="${st.purpose}" data-wait="${esc(st.wait.id)}">${st.purpose === 'escalate' ? 'Draft an escalation' : 'Draft a follow-up'}</button>`); btns.push(`<a class="btn" href="${href('case', c.id, 'waiting')}">Details</a>`); }
    else if (st.kind === 'resolve' || st.kind === 'monitor') btns.push(`<a class="btn btn-ink" href="${href('case', c.id, 'resolve')}">Check resolution</a>`);
    else btns.push(`<a class="btn" href="${href('case', c.id)}">Open case</a>`);
    const eff = st.task && st.task.effort ? `<span class="pill line">about ${st.task.effort} min</span>` : '';
    focal = `<section class="focal" aria-labelledby="start-here">
      <div class="between"><span class="eyebrow" id="start-here">Start here</span>${eff}</div>
      <p class="focus-task" style="font-size:clamp(22px,4vw,28px)">${esc(st.text)}</p>
      <p class="small ink2 mt8">${caseLinkEl(c.id)} · ${esc(pb(c.type).short)}</p>
      ${whyList(top.reasons, 3)}
      <div class="cluster mt16">${btns.join('')}</div>
    </section>`;
  } else {
    focal = `<section class="card"><p class="h3">Nothing needs you right now.</p><p class="small ink2 mt4">${waits.length ? `You’re waiting on ${plural(waits.length, 'reply', 'replies')} or actions from others. The Waiting view shows when to follow up.` : 'Open cases are parked or waiting on other steps.'}</p><div class="cluster mt12"><a class="btn" href="#/waiting">See what you’re waiting on</a></div></section>`;
  }

  const attnHTML = attention.length ? `<section class="section"><div class="section-head"><h2 class="h3">Also worth attention</h2></div><div class="list">${attention.map(p => {
    const c = getCase(p.caseId);
    return `<div class="item"><div class="item-main"><a class="item-title serif stretch" style="text-decoration:none" href="${href('case', c.id)}">${esc(c.title)}</a><p class="item-sub">${esc(p.step.text)}</p>${whyList(p.reasons, 2)}</div></div>`;
  }).join('')}</div></section>` : '';

  const waitHTML = waits.length ? `<section class="section"><div class="section-head"><h2 class="h3">In someone else’s court</h2><a class="linkish" href="#/waiting">All waiting</a></div>
    ${wNeeds.length ? `<div class="list">${wNeeds.slice(0, 3).map(({ w, st }) => `<div class="item"><div class="item-main"><p class="item-title">${esc(w.what)}</p><p class="item-sub">${esc(w.from || 'Them')} · ${caseLinkEl(w.caseId)}</p><div class="item-meta">${pill(st.label, st.tone)}</div></div></div>`).join('')}</div>`
      : `<p class="small ink2">${plural(waits.length, 'thing')} pending, all on track. Nothing to chase yet.</p>`}</section>` : '';

  const soonHTML = soon.length ? `<section class="section"><div class="section-head"><h2 class="h3">Next 7 days</h2><a class="linkish" href="#/dates">All dates</a></div><div class="list plain">${soon.map(agendaRow).join('')}</div></section>` : '';

  const restHTML = rest.length ? `<section class="section"><div class="section-head"><h2 class="h3">Everything else can wait</h2></div>
    <p class="small ink2">${plural(rest.length, 'other open case')}${restSoon ? '' : ' — none has a deadline in the next 7 days'}. They’re tracked; you don’t need to hold them in your head.</p>
    ${UIState.showAllToday ? `<div class="list mt12">${rest.map(p => { const c = getCase(p.caseId); return `<a class="item link" href="${href('case', c.id)}"><div class="item-main"><p class="item-title">${esc(c.title)}</p><p class="item-sub">${esc(p.step ? p.step.text : '')}</p></div>${statusPill(c.id)}</a>`; }).join('')}</div>` : ''}

    <div class="cluster mt12">${[5, 15, 30].map(m => `<button class="btn btn-sm" data-act="start-focus" data-min="${m}">${ico('focus', 'sm')}${m} min</button>`).join('')}</div></section>` : '';

  return `<div class="page-head"><p class="eyebrow">${greeting()} · ${esc(fmtDate(today(), { weekday: true }))}</p><h1 class="h1">${top ? 'Here’s where to start.' : 'You’re all caught up for now.'}</h1><p class="lede">${lede}</p></div>
    ${focal}${attnHTML}${waitHTML}${soonHTML}${focusHTML}${restHTML}
    <section class="section">${quickIntake(true)}</section>`;
};

    <section class="section"><div class="between"><div><p class="strong">Want to look around first?</p><p class="small ink2">Load a set of realistic example cases. You can remove them in one tap.</p></div><div class="cluster"><button class="btn" data-act="load-samples">Explore examples</button><a class="btn btn-ghost" href="#/data">Restore a backup</a></div></div></section>`;
}

function agendaRow(i) {
  const kindLabel = { deadline: 'Deadline', target: 'Your target', expected: 'Expected', followup: 'Follow-up', mine: 'Your commitment', theirs: 'Their promise', monitor: 'Monitoring check', parked: 'Parked case returns', obligation: 'Recurring' }[i.kind];
  const n = daysUntil(i.date);
  return `<div class="item"><div class="agenda-date">${esc(fmtDate(i.date))}<br><span>${esc(n === 0 ? 'today' : relDay(i.date).replace(/^in /, ''))}</span></div>
    <div class="item-main"><p class="item-title">${esc(i.title)}</p><div class="item-meta">${pill(kindLabel, i.kind === 'theirs' || i.kind === 'expected' ? 'blue' : i.kind === 'deadline' ? 'amber' : '')}${i.certainty && i.kind !== 'target' ? certaintyPill(i.certainty) : ''}${i.caseId ? `<span>${caseLinkEl(i.caseId)}</span>` : (i.kind === 'obligation' ? '<a class="linkish plain" href="#/insights">Recurring obligations</a>' : '')}</div></div></div>`;
}

/* ===== Intake ===== */
Views.new = () => {
  const I = UIState.intake;
  if (!I || !I.draft) {
    const text = I && I.text ? I.text : '';
    return `<a class="back" href="#/today">${ico('back', 'sm')}Back</a>
      <div class="page-head"><p class="eyebrow">New case · step 1 of 2</p><h1 class="h1">What went wrong?</h1><p class="lede">Write it the way you’d tell a friend. Include anything you remember — when it happened, amounts, who it’s with. You can correct everything afterwards.</p></div>
      <form data-form="intake-describe" class="card">
        <label class="label" for="intake-text">Describe the situation</label>
        <textarea id="intake-text" class="textarea" name="text" rows="4" data-fk="intake-text" data-input="intake-text" placeholder="e.g. I missed my car registration renewal last month and I’m not sure what I need to renew it…" required>${esc(text)}</textarea>
        <div class="between mt12"><span class="xs muted">Stays on this device. Nothing is sent anywhere.</span><button class="btn btn-primary" type="submit">Continue</button></div>
      </form>
      <div class="section"><p class="eyebrow" style="margin-bottom:8px">Or start from an example</p><div class="cluster">${EXAMPLES.map((e, i) => `<button class="btn btn-sm btn-quiet" data-act="intake-example" data-i="${i}">${esc(e)}</button>`).join('')}</div></div>`;
  }
  const d = I.draft; const P = pb(d.type);
  const ranked = P.paths.map(p => ({ p, ...Engine.scorePath(d.type, p, d.answers) })).sort((a, b) => b.score - a.score);
  if (I.pathKey === undefined || (I.pathKey && !P.paths.some(p => p.key === I.pathKey))) I.pathKey = ranked[0].p.key;
  const cls = d.classification;
  const alts = (cls.alternatives || []).filter(t => t !== d.type);
  const fromWords = [...d.when.map(w => `${esc(cap(w.phrase))} → around ${esc(fmtDate(w.date, { year: true }))}`), ...d.amounts.map(a => esc(a.phrase))];
  const cons = Engine.consequencesFor(d.type, d.answers);
  return `<button class="back linkish plain" style="border:0;background:none" data-act="intake-back">${ico('back', 'sm')}Edit description</button>
    <div class="page-head"><p class="eyebrow">New case · step 2 of 2</p><h1 class="h1">Here’s what I understood.</h1><p class="lede">Check it, answer only the questions that change what to do, and pick where to start. Nothing is saved until you create the case.</p></div>
    <form data-form="intake-create" class="stack stack-lg">
      <section class="card stack">
        <blockquote class="serif italic ink2" style="margin:0;font-size:17px">“${esc(d.text)}”</blockquote>
        <div class="grid2">
          ${field('Case title', `<input class="input" name="title" value="${esc(d.title)}" data-input="intake-field" data-k="title" data-fk="intake-title" required>`)}
          ${field('Kind of situation', selectEl('type', PLAYBOOK_ORDER.map(k => [k, PLAYBOOKS[k].label]), d.type, 'data-change="intake-type"'), cls.confident ? '' : 'Best guess from your words — change it if it’s not right.')}
        </div>
        ${alts.length ? `<p class="small ink2">It could also be: ${alts.map(t => `<button type="button" class="btn btn-xs btn-quiet" data-act="intake-settype" data-type="${t}">${esc(PLAYBOOKS[t].label)}</button>`).join(' ')}</p>` : ''}
        ${fromWords.length ? `<div><p class="label">Picked up from your words</p><div class="cluster">${fromWords.map(w => `<span class="pill line">${w}</span>`).join('')}</div><p class="hint">Saved as <b>unverified</b> until you check them against a statement, letter or the organization.</p></div>` : ''}
      </section>

      <section>
        <div class="section-head"><h2 class="h2">A few questions that change the plan</h2></div>
        <p class="section-note">Skip any you’re unsure about — “not sure” is a real answer, and it’ll be tracked as missing information.</p>
        <div class="stack">${P.questions.map(q => `<fieldset class="card flat"><legend class="strong" style="font-size:15px;padding:0">${esc(q.q)}</legend>
          <p class="xs muted mt4">${esc(q.why)}${d.answerSource[q.id] === 'inferred' ? ' <span class="pill amber">Inferred from your words — change if wrong</span>' : ''}</p>
          <div class="seg mt8">${q.opts.map(([v, l]) => `<label><input type="radio" name="q_${q.id}" value="${esc(v)}" data-change="intake-answer" data-q="${q.id}" data-fk="q-${q.id}-${esc(v)}" ${d.answers[q.id] === v ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div></fieldset>`).join('')}</div>
      </section>

      <section>
        <div class="section-head"><h2 class="h2">Where to start</h2></div>
        <p class="section-note">Ranked using your answers. It’s a starting point, not a verdict — you can compare every option and switch later.</p>
        <div class="choices">${ranked.map((r, i) => `<label class="choice"><input type="radio" name="path" value="${esc(r.p.key)}" data-change="intake-path" ${I.pathKey === r.p.key ? 'checked' : ''}><span class="box"><b>${esc(r.p.title)}${i === 0 && r.score > ranked[ranked.length - 1].score ? ' <span class="pill sage">Best fit for your answers</span>' : ''}</b><small>${esc(r.p.why)}</small>${r.reasons.length ? `<small class="mt4">${r.reasons.map(x => `${x.delta > 0 ? '+' : '−'} ${esc(x.text)}`).join(' · ')}</small>` : ''}</span></label>`).join('')}
          <label class="choice"><input type="radio" name="path" value="" data-change="intake-path" ${I.pathKey === '' ? 'checked' : ''}><span class="box"><b>I’ll decide later</b><small>Create the case without a plan yet. The first step will be to compare options.</small></span></label></div>
      </section>

      ${cons.length ? `<section><div class="section-head"><h2 class="h3">What could be at stake</h2></div><p class="section-note">General guidance for this kind of situation — your case may differ. You can mark each as happened, avoided or not relevant later.</p>
        <ul class="bullets">${cons.map(c => `<li>${esc(c.text)} <span class="muted xs">— ${esc(REVERSIBILITY[c.rev || c.reversibility].toLowerCase())}${c.status === 'established' ? ', already happened' : ''}</span></li>`).join('')}</ul></section>` : ''}

      <details class="disclose"><summary>Add details now (optional)</summary>
        <div class="grid2 mt12">
          ${field('Who it’s with', `<input class="input" name="counterparty" value="${esc(I.counterparty || '')}" data-input="intake-field" data-k="counterparty" placeholder="e.g. your water utility">`)}
